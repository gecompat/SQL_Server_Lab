name: ${LAB_W4_COMPOSE_PROJECT:?LAB_W4_COMPOSE_PROJECT is required}

services:
  sql-primary:
    image: ${LAB_W4_SQL_IMAGE:?LAB_W4_SQL_IMAGE is required}
    hostname: ${LAB_W4_PRIMARY_HOSTNAME:-lab-sql-primary}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LAB_W4_SQL_SA_PASSWORD:?LAB_W4_SQL_SA_PASSWORD is required}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CS_AS
      MSSQL_MEMORY_LIMIT_MB: ${LAB_W4_MSSQL_MEMORY_LIMIT_MB:?LAB_W4_MSSQL_MEMORY_LIMIT_MB is required}
      MSSQL_AGENT_ENABLED: "true"
    volumes:
      - type: bind
        source: ${LAB_W4_PRIMARY_DATA_DIR:?LAB_W4_PRIMARY_DATA_DIR is required}
        target: /var/opt/mssql
      - type: bind
        source: ${LAB_W4_RUNTIME_DIR:?LAB_W4_RUNTIME_DIR is required}
        target: /lab/runtime
    networks:
      - lab-management
      - lab-data
    labels:
      lab001.owner: SQL_SERVER_ANALYZE
      lab001.run-id: ${LAB_W4_RUN_ID:?LAB_W4_RUN_ID is required}
      lab001.topology: ${LAB_W4_TOPOLOGY_ID:?LAB_W4_TOPOLOGY_ID is required}
      lab001.role: SQL_PRIMARY
    healthcheck: &sql-healthcheck
      test:
        - CMD-SHELL
        - >-
          sqlcmd_path="$$(command -v sqlcmd 2>/dev/null || true)";
          if [ -z "$$sqlcmd_path" ]; then
          for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd;
          do if [ -x "$$candidate" ]; then sqlcmd_path="$$candidate"; break; fi; done;
          fi;
          test -n "$$sqlcmd_path" &&
          "$$sqlcmd_path" -C -b -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -Q "SET NOCOUNT ON; SELECT 1;"
          >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: "no"

  sql-secondary:
    image: ${LAB_W4_SQL_IMAGE:?LAB_W4_SQL_IMAGE is required}
    hostname: ${LAB_W4_SECONDARY_HOSTNAME:-lab-sql-secondary}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LAB_W4_SQL_SA_PASSWORD:?LAB_W4_SQL_SA_PASSWORD is required}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CS_AS
      MSSQL_MEMORY_LIMIT_MB: ${LAB_W4_MSSQL_MEMORY_LIMIT_MB:?LAB_W4_MSSQL_MEMORY_LIMIT_MB is required}
      MSSQL_AGENT_ENABLED: "true"
    volumes:
      - type: bind
        source: ${LAB_W4_SECONDARY_DATA_DIR:?LAB_W4_SECONDARY_DATA_DIR is required}
        target: /var/opt/mssql
      - type: bind
        source: ${LAB_W4_RUNTIME_DIR:?LAB_W4_RUNTIME_DIR is required}
        target: /lab/runtime
    networks:
      - lab-management
      - lab-data
    labels:
      lab001.owner: SQL_SERVER_ANALYZE
      lab001.run-id: ${LAB_W4_RUN_ID:?LAB_W4_RUN_ID is required}
      lab001.topology: ${LAB_W4_TOPOLOGY_ID:?LAB_W4_TOPOLOGY_ID is required}
      lab001.role: SQL_SECONDARY
    healthcheck: *sql-healthcheck
    restart: "no"

  sql-tertiary:
    image: ${LAB_W4_SQL_IMAGE:?LAB_W4_SQL_IMAGE is required}
    hostname: ${LAB_W4_TERTIARY_HOSTNAME:-lab-sql-tertiary}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LAB_W4_SQL_SA_PASSWORD:?LAB_W4_SQL_SA_PASSWORD is required}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CS_AS
      MSSQL_MEMORY_LIMIT_MB: ${LAB_W4_MSSQL_MEMORY_LIMIT_MB:?LAB_W4_MSSQL_MEMORY_LIMIT_MB is required}
      MSSQL_AGENT_ENABLED: "true"
    volumes:
      - type: bind
        source: ${LAB_W4_TERTIARY_DATA_DIR:?LAB_W4_TERTIARY_DATA_DIR is required}
        target: /var/opt/mssql
      - type: bind
        source: ${LAB_W4_RUNTIME_DIR:?LAB_W4_RUNTIME_DIR is required}
        target: /lab/runtime
    networks:
      - lab-management
      - lab-data
    labels:
      lab001.owner: SQL_SERVER_ANALYZE
      lab001.run-id: ${LAB_W4_RUN_ID:?LAB_W4_RUN_ID is required}
      lab001.topology: ${LAB_W4_TOPOLOGY_ID:?LAB_W4_TOPOLOGY_ID is required}
      lab001.role: SQL_TERTIARY
    healthcheck: *sql-healthcheck
    restart: "no"

networks:
  lab-management:
    internal: true
    labels:
      lab001.owner: SQL_SERVER_ANALYZE
      lab001.run-id: ${LAB_W4_RUN_ID:?LAB_W4_RUN_ID is required}
      lab001.topology: ${LAB_W4_TOPOLOGY_ID:?LAB_W4_TOPOLOGY_ID is required}
      lab001.segment: LAB_MANAGEMENT
  lab-data:
    internal: true
    labels:
      lab001.owner: SQL_SERVER_ANALYZE
      lab001.run-id: ${LAB_W4_RUN_ID:?LAB_W4_RUN_ID is required}
      lab001.topology: ${LAB_W4_TOPOLOGY_ID:?LAB_W4_TOPOLOGY_ID is required}
      lab001.segment: LAB_DATA
