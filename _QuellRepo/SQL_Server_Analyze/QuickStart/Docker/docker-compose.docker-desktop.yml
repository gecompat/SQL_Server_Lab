services:
  sql2019:
    volumes: !override
      - type: volume
        source: sql2019-instance
        target: /var/opt/mssql
      - type: bind
        source: ${SQL2019_BACKUP_DIR:?SQL2019_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true

  sql2022:
    volumes: !override
      - type: volume
        source: sql2022-instance
        target: /var/opt/mssql
      - type: bind
        source: ${SQL2022_BACKUP_DIR:?SQL2022_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true

  sql2025:
    volumes: !override
      - type: volume
        source: sql2025-instance
        target: /var/opt/mssql
      - type: bind
        source: ${SQL2025_BACKUP_DIR:?SQL2025_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true

volumes:
  sql2019-instance:
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2019"
      quickstart.storage-role: instance
  sql2022-instance:
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2022"
      quickstart.storage-role: instance
  sql2025-instance:
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2025"
      quickstart.storage-role: instance
