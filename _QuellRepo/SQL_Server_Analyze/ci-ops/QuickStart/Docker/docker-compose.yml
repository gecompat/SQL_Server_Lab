name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-sql-healthcheck: &sql-healthcheck
  test:
    - CMD-SHELL
    - >-
      sqlcmd_path="$$(command -v sqlcmd 2>/dev/null || true)";
      if [ -z "$$sqlcmd_path" ]; then
      for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd;
      do if [ -x "$$candidate" ]; then sqlcmd_path="$$candidate"; break; fi; done;
      fi;
      test -n "$$sqlcmd_path" &&
      SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" "$$sqlcmd_path" -C -b
      -S localhost -U sa -Q
      "SET NOCOUNT ON; SELECT CONVERT(int, SERVERPROPERTY('ProductMajorVersion'));"
      >/dev/null 2>&1
  interval: 5s
  timeout: 5s
  retries: 120
  start_period: 20s

x-sql-environment: &sql-environment
  ACCEPT_EULA: "Y"
  MSSQL_PID: Developer
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
  MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CS_AS}
  MSSQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:?SQL_MEMORY_LIMIT_MB is required}
  MSSQL_AGENT_ENABLED: ${MSSQL_AGENT_ENABLED:-true}
  MSSQL_DATA_DIR: /var/opt/mssql/data
  MSSQL_LOG_DIR: /var/opt/mssql/log
  MSSQL_BACKUP_DIR: /var/opt/mssql/backup

x-sql-common: &sql-common
  environment: *sql-environment
  cpus: ${CONTAINER_CPUS:?CONTAINER_CPUS is required}
  mem_limit: ${CONTAINER_MEMORY:?CONTAINER_MEMORY is required}
  init: true
  restart: "no"
  stop_grace_period: 60s
  healthcheck: *sql-healthcheck
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - quickstart-data

services:
  sql2019:
    <<: *sql-common
    profiles: [sql2019]
    image: ${SQL2019_IMAGE:-mcr.microsoft.com/mssql/server:2019-latest}
    hostname: sql2019
    ports:
      - target: 1433
        published: ${SQL2019_PORT:-14331}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SQL2019_DATA_DIR:?SQL2019_DATA_DIR is required}
        target: /var/opt/mssql/data
      - type: bind
        source: ${SQL2019_LOG_DIR:?SQL2019_LOG_DIR is required}
        target: /var/opt/mssql/log
      - type: bind
        source: ${SQL2019_BACKUP_DIR:?SQL2019_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2019"

  sql2022:
    <<: *sql-common
    profiles: [sql2022]
    image: ${SQL2022_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    hostname: sql2022
    ports:
      - target: 1433
        published: ${SQL2022_PORT:-14332}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SQL2022_DATA_DIR:?SQL2022_DATA_DIR is required}
        target: /var/opt/mssql/data
      - type: bind
        source: ${SQL2022_LOG_DIR:?SQL2022_LOG_DIR is required}
        target: /var/opt/mssql/log
      - type: bind
        source: ${SQL2022_BACKUP_DIR:?SQL2022_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2022"

  sql2025:
    <<: *sql-common
    profiles: [sql2025]
    image: ${SQL2025_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest}
    hostname: sql2025
    ports:
      - target: 1433
        published: ${SQL2025_PORT:-14335}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SQL2025_DATA_DIR:?SQL2025_DATA_DIR is required}
        target: /var/opt/mssql/data
      - type: bind
        source: ${SQL2025_LOG_DIR:?SQL2025_LOG_DIR is required}
        target: /var/opt/mssql/log
      - type: bind
        source: ${SQL2025_BACKUP_DIR:?SQL2025_BACKUP_DIR is required}
        target: /var/opt/mssql/backup
      - type: bind
        source: ${INSTALLER_ROOT:?INSTALLER_ROOT is required}
        target: /quickstart/installer
        read_only: true
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
      quickstart.sql-version: "2025"

networks:
  quickstart-data:
    internal: true
    labels:
      quickstart.owner: SQL_SERVER_ANALYZE_QUICKSTART
      quickstart.scope: ${QUICKSTART_SCOPE_ID:?QUICKSTART_SCOPE_ID is required}
