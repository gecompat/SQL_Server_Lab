name: Docker QuickStart validation

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'QuickStart/**'
      - 'Code/Tests/Static/Validate_QuickStart_Docker.py'
      - '.github/workflows/quickstart-docker-validation.yml'
  push:
    branches:
      - main
      - 'agent/quickstart-*'
    paths:
      - '.gitignore'
      - 'QuickStart/**'
      - 'Code/Tests/Static/Validate_QuickStart_Docker.py'
      - '.github/workflows/quickstart-docker-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate isolated Docker QuickStart
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate static QuickStart contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ./Code/Tests/Static/Validate_QuickStart_Docker.py --repository-root .

      - name: Parse all QuickStart PowerShell scripts
        shell: pwsh
        run: |
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'quickstart-powershell-parser-errors.txt'
          $allErrors = [Collections.Generic.List[object]]::new()
          Get-ChildItem ./QuickStart/Docker -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref] $tokens,
                [ref] $errors
            ) | Out-Null
            foreach ($errorRecord in @($errors)) {
              $allErrors.Add([pscustomobject]@{
                  File = $_.FullName
                  Line = $errorRecord.Extent.StartLineNumber
                  Column = $errorRecord.Extent.StartColumnNumber
                  Message = $errorRecord.Message
              })
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors |
              ForEach-Object { "$($_.File):$($_.Line):$($_.Column): $($_.Message)" } |
              Set-Content -LiteralPath $diagnosticPath -Encoding utf8
            Get-Content -LiteralPath $diagnosticPath
            throw "QuickStart PowerShell contains $($allErrors.Count) parser error(s)."
          }

      - name: Upload parser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quickstart-powershell-parser-errors
          path: ${{ runner.temp }}/quickstart-powershell-parser-errors.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Install pinned PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyze QuickStart PowerShell
        shell: pwsh
        run: |
          $findings = @(
            Get-ChildItem ./QuickStart/Docker -Filter '*.ps1' -Recurse |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          )
          if ($findings.Count -gt 0) {
            $findings | Select-Object RuleName, Severity, ScriptName, Line | Format-Table -AutoSize
            throw "QuickStart analyzer reported $($findings.Count) error finding(s)."
          }

      - name: Validate normal and Slow-I/O Compose models
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/sql-server-analyze-quickstart"
          mkdir -p \
            "${runtime_root}/control/installer" \
            "${runtime_root}/data/2019" "${runtime_root}/data/2022" "${runtime_root}/data/2025" \
            "${runtime_root}/log/2019" "${runtime_root}/log/2022" "${runtime_root}/log/2025" \
            "${runtime_root}/backup/2019" "${runtime_root}/backup/2022" "${runtime_root}/backup/2025"

          cat > ./QuickStart/Docker/.env <<ENV
          QUICKSTART_SCHEMA_VERSION='1'
          QUICKSTART_SCOPE_ID='a1b2c3d4e5f6'
          QUICKSTART_RUNTIME_MODE='DOCKER_ENGINE_LINUX'
          COMPOSE_PROJECT_NAME='ssa-quickstart-a1b2c3d4e5f6'
          COMPOSE_PROFILES='sql2019,sql2022,sql2025'
          SQL_VERSIONS='2019,2022,2025'
          BIND_ADDRESS='127.0.0.1'
          MSSQL_SA_PASSWORD='SyntheticComposePassword-42!'
          MSSQL_COLLATION='SQL_Latin1_General_CP1_CS_AS'
          MSSQL_AGENT_ENABLED='true'
          FRAMEWORK_DATABASE='LabAnalyze'
          INSTALL_FRAMEWORK='true'
          RESOURCE_PROFILE='COMPACT'
          CONTAINER_CPUS='2.0'
          CONTAINER_MEMORY='3g'
          SQL_MEMORY_LIMIT_MB='2048'
          STORAGE_LAYOUT='SINGLE_ROOT'
          LAB_ROOT='${runtime_root}'
          DATA_ROOT='${runtime_root}/data'
          LOG_ROOT='${runtime_root}/log'
          BACKUP_ROOT='${runtime_root}/backup'
          INSTALLER_ROOT='${runtime_root}/control/installer'
          SQL2019_PORT='14331'
          SQL2022_PORT='14332'
          SQL2025_PORT='14335'
          SQL2019_DATA_DIR='${runtime_root}/data/2019'
          SQL2019_LOG_DIR='${runtime_root}/log/2019'
          SQL2019_BACKUP_DIR='${runtime_root}/backup/2019'
          SQL2022_DATA_DIR='${runtime_root}/data/2022'
          SQL2022_LOG_DIR='${runtime_root}/log/2022'
          SQL2022_BACKUP_DIR='${runtime_root}/backup/2022'
          SQL2025_DATA_DIR='${runtime_root}/data/2025'
          SQL2025_LOG_DIR='${runtime_root}/log/2025'
          SQL2025_BACKUP_DIR='${runtime_root}/backup/2025'
          SQL2019_IMAGE='mcr.microsoft.com/mssql/server:2019-latest'
          SQL2022_IMAGE='mcr.microsoft.com/mssql/server:2022-latest'
          SQL2025_IMAGE='mcr.microsoft.com/mssql/server:2025-latest'
          IO_PROFILE='NORMAL'
          SLOW_IO_DEVICE='/dev/sdb1'
          SLOW_IO_READ_BPS='20mb'
          SLOW_IO_WRITE_BPS='10mb'
          ENV

          docker compose \
            --env-file ./QuickStart/Docker/.env \
            -f ./QuickStart/Docker/docker-compose.yml \
            config --quiet

          docker compose \
            --env-file ./QuickStart/Docker/.env \
            -f ./QuickStart/Docker/docker-compose.yml \
            -f ./QuickStart/Docker/docker-compose.slow-io.yml \
            config --quiet

          rm -f ./QuickStart/Docker/.env

  windows-path-safety:
    name: Validate Windows path-safety contract
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run synthetic path-safety tests
        shell: pwsh
        run: |
          ./QuickStart/Docker/Validation/Invoke-QuickStartPathSafetyTests.ps1
