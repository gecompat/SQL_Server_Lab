name: SQL Server compatibility matrix (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-compatibility-matrix-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate SQL Server 2019, 2022, and 2025
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate GitHub-hosted toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          pwsh --version

      - name: Generate ephemeral SQL credential
        shell: bash
        run: |
          set -euo pipefail
          generated_value="A$(openssl rand -hex 16)a1!"
          echo "::add-mask::$generated_value"
          echo "QTLAB_SQL_SECRET=$generated_value" >> "$GITHUB_ENV"

      - name: Install and validate compatibility matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $ports = @{
              2019 = 14331
              2022 = 14332
              2025 = 14335
          }

          & ./Lab/Install-Lab.ps1 `
              -Action Install `
              -Runtime DOCKER `
              -SqlVersions @(2019, 2022, 2025) `
              -Ports $ports `
              -AdminLogin ExampleSqlAdmin `
              -SecretEnvironmentVariable QTLAB_SQL_SECRET `
              -ResourceProfile SMALL `
              -PersistenceMode TEMPORARY `
              -ScopeName ci-sql-matrix `
              -AcceptEula `
              -InstallFramework `
              -NonInteractive

          if (-not $?) {
              throw 'SQL Server compatibility-matrix installation failed.'
          }

          $statusOutput = @(
              & ./Lab/Install-Lab.ps1 `
                  -Action Status `
                  -ScopeName ci-sql-matrix `
                  -NonInteractive
          )
          $statusOutput | Format-List

          $status = $statusOutput |
              Where-Object {
                  $_ -is [psobject] -and
                  $_.PSObject.Properties.Name -contains 'Status'
              } |
              Select-Object -Last 1

          if ($null -eq $status -or [string] $status.Status -ne 'READY') {
              throw 'SQL Server compatibility matrix did not reach READY.'
          }

      - name: Destroy compatibility matrix
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
              & ./Lab/Install-Lab.ps1 `
                  -Action Destroy `
                  -ScopeName ci-sql-matrix `
                  -Force `
                  -NonInteractive
          }
          catch {
              Write-Warning 'Compatibility-matrix cleanup could not complete.'
              Write-Warning $_.Exception.Message
          }
