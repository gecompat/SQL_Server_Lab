name: Adapter Smoke - Docker (GitHub-hosted)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-server-lab-adapter-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  adapter-smoke:
    name: Project adapter end-to-end on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sqlcmd (mssql-tools18)
        run: |
          set -euo pipefail
          package_url="https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output packages-microsoft-prod.deb "$package_url"
          dpkg-deb --info packages-microsoft-prod.deb >/dev/null
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          /opt/mssql-tools18/bin/sqlcmd -?

      - name: Adapter smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Integration/Invoke-AdapterSmokeTest.ps1 -Version 2025 -Provider docker

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -aq --filter 'name=sql-lab-' | xargs -r docker rm -f || true
