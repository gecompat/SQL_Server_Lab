name: Adapter Smoke - Docker (GitHub-hosted)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Adapters/**'
      - 'Private/ProjectAdapter.ps1'
      - 'Private/SqlReadiness.ps1'
      - 'Private/PathSafety.ps1'
      - 'Private/RunResolution.ps1'
      - 'Public/Install-SqlServerLabAdapter.ps1'
      - 'Public/Test-SqlServerLabAdapter.ps1'
      - 'Schemas/project-adapter.schema.json'
      - 'Tests/Integration/Invoke-AdapterSmokeTest.ps1'
      - '.github/workflows/adapter-smoke-github-hosted.yml'

permissions:
  contents: read

concurrency:
  group: sql-server-lab-adapter-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  adapter-smoke:
    name: Project adapter end-to-end on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sqlcmd (mssql-tools18)
        run: |
          set -euo pipefail
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          /opt/mssql-tools18/bin/sqlcmd -?

      - name: Static contracts (adapter)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Static/Invoke-ProjectAdapterChecks.ps1

      - name: Adapter smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Integration/Invoke-AdapterSmokeTest.ps1 -Version 2025 -Provider docker

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -aq --filter 'name=sql-lab-' | xargs -r docker rm -f || true
