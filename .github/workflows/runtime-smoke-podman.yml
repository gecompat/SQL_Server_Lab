name: Runtime Smoke - Podman

on:
  workflow_call:
    outputs:
      validation_classification:
        description: VALIDATED, VALIDATION_FAILURE, INFRASTRUCTURE_UNAVAILABLE oder UNKNOWN
        value: ${{ jobs.podman-smoke.outputs.validation_classification }}
      validated_capabilities:
        description: Capabilities completed successfully; absent on failure
        value: ${{ jobs.podman-smoke.outputs.validated_capabilities }}
    inputs:
      capabilities:
        description: Comma-separated capability scope; * requests qualification
        required: false
        default: "*"
        type: string
      mode:
        description: Auszufuehrender Podman-Nachweis
        required: false
        default: lifecycle
        type: string
  workflow_dispatch:
    inputs:
      capabilities:
        description: Comma-separated capability scope; * requests qualification
        required: false
        default: "*"
        type: string
      mode:
        description: Auszufuehrender Podman-Nachweis
        required: true
        default: lifecycle
        type: choice
        options:
          - lifecycle
          - cli-acceptance
          - owned-run-recovery
      root_location:
        type: choice
        options: [profile, runner-work]
        required: false
      state_id:
        description: Exact 32-character state directory UUID
        type: string
        required: false
      policy_id:
        description: Expected ownership policy UUID
        type: string
        required: false
      run_id:
        description: Exact nonpersistent test RunId
        type: string
        required: false
      provider:
        type: choice
        options: [docker, podman]
        required: false

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-podman-${{ github.workflow }}-${{ github.ref }}
  # Forced cancellation can bypass the PowerShell finally cleanup on the
  # persistent self-hosted runner. Serialize newer runs instead.
  cancel-in-progress: false

jobs:
  podman-smoke:
    if: inputs.mode != 'owned-run-recovery'
    name: Podman provider runtime / CLI acceptance
    runs-on: [self-hosted, SQL_Lab, Podman]
    # Full capability qualification exceeded 45 minutes on the owned runner.
    # Keep a finite 90-minute ceiling; individual native operations stay bounded.
    timeout-minutes: 90
    outputs:
      validation_classification: ${{ steps.runtime-preflight.outputs.validation_classification }}
      validated_capabilities: ${{ steps.runtime-acceptance.outputs.validated_capabilities }}
    env:
      SQL_SERVER_LAB_CI_CAPABILITIES: ${{ inputs.capabilities }}
      SQL_SERVER_LAB_CI_MODE: ${{ inputs.mode }}
      SQL_SERVER_LAB_RESOURCE_LIFECYCLE: test
      SQL_SERVER_LAB_TEST_OPERATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime preflight
        id: runtime-preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $scope=& .\Tools\Resolve-CiRuntimeScope.ps1 -Provider podman -Capabilities $env:SQL_SERVER_LAB_CI_CAPABILITIES -Mode $env:SQL_SERVER_LAB_CI_MODE
          $selectedCapabilities=@($scope.Capabilities)
          $classification = 'UNKNOWN'
          $logPath = Join-Path $env:RUNNER_TEMP 'podman-preflight.private.log'
          function Set-ValidationClassification([string]$Value) {
            $script:classification = $Value
            "validation_classification=$Value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          Set-ValidationClassification UNKNOWN
          try {
            . .\Tests\Common\OwnedHostTestScope.ps1
            $tools=@(& .\Tools\Initialize-SqlServerLabHostTools.ps1 -Name podman)
            if (@($tools | Where-Object { -not $_.Available }).Count) { throw 'OWNED_HOST_TEST_TOOL_UNAVAILABLE' }
            $module=Import-Module .\SqlServerLab.psd1 -Force -PassThru
            # Runner temp is erased before the next job, including after timeout.
            # Keep protected ownership receipts available for scoped recovery.
            $stateRoot=Join-Path (Split-Path $env:RUNNER_TEMP -Parent) ([guid]::NewGuid().ToString('N'))
            $null=Initialize-OwnedHostTestRoot -Module $module -StateRoot $stateRoot -Providers podman -ParentOperationId ([guid]::NewGuid().ToString('D'))
            "SQL_SERVER_LAB_CI_OWN_STATE_ROOT=$stateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            sqlcmd -? *>> $logPath
            if ($LASTEXITCODE -ne 0) { throw 'sqlcmd ist nicht verwendbar.' }
            Set-ValidationClassification VALIDATED
          }
          catch {
            try { $_ | Out-String | Add-Content -LiteralPath $logPath } catch { }
            Set-ValidationClassification INFRASTRUCTURE_UNAVAILABLE
            $message = "INFRASTRUCTURE_UNAVAILABLE: Podman-/sqlcmd-Voraussetzung ist nicht erreichbar oder nicht verwendbar."
            "::error title=INFRASTRUCTURE_UNAVAILABLE::$message" | Write-Host
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Infrastruktur nicht verfügbar`n`n$message`n`nEs liegt kein Nachweis für einen Implementierungsfehler vor. Nach Wiederherstellung nur diesen Lauf erneut ausführen."
            exit 1
          }

      - name: Podman SQL Server lifecycle / CLI acceptance
        id: runtime-acceptance
        timeout-minutes: 75
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT 'podman-smoke-matrix.private.log'
          $scope=& .\Tools\Resolve-CiRuntimeScope.ps1 -Provider podman -Capabilities $env:SQL_SERVER_LAB_CI_CAPABILITIES -Mode $env:SQL_SERVER_LAB_CI_MODE
          $selectedCapabilities=@($scope.Capabilities)
          Write-Host ('REQUESTED capabilities: ' + ($selectedCapabilities -join ','))
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Runtime_Smoke' } else { 'SQL_Server_Lab_Runtime_Smoke' }
          $mutex = $null
          $acquired = $false
          try {
            $mutex = [System.Threading.Mutex]::new($false, $mutexName)
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(10))
            if (-not $acquired) { throw 'Runtime-Smoke-Hostlock konnte innerhalb von 10 Minuten nicht erworben werden.' }

            if ($env:SQL_SERVER_LAB_CI_MODE -eq 'cli-acceptance') {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerCliAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                -Provider podman `
                -Version 2022-CU18 *> $logPath
              if ($LASTEXITCODE -ne 0) { throw "Podman CLI Acceptance endete mit Exitcode $LASTEXITCODE." }
            }
            else {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SmokeMatrix.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                -Provider podman `
                -ReferenceVersion 2025 `
                -TestAutoStart *> $logPath
              $matrixExitCode = $LASTEXITCODE
              if ($matrixExitCode -ne 0) { throw "Podman Smoke Matrix endete mit Exitcode $matrixExitCode." }

              if ('collation' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerCollationAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $collationExitCode = $LASTEXITCODE
                if ($collationExitCode -ne 0) { throw "Podman Collation-Akzeptanz endete mit Exitcode $collationExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: collation' }

              if ('restore' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-RestoreSmokeTest.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -Version 2025 *>> $logPath
                $restoreExitCode = $LASTEXITCODE
                if ($restoreExitCode -ne 0) { throw "Podman Restore Smoke Test endete mit Exitcode $restoreExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: restore' }

              if ('pitr' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PointInTimeRecoveryAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -Version 2025 -RuntimeMutexAlreadyHeld *>> $logPath
                $pitrExitCode = $LASTEXITCODE
                if ($pitrExitCode -ne 0) { throw "Podman Point-in-Time-Recovery-Akzeptanz endete mit Exitcode $pitrExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: pitr' }


              if ('upgrade' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SqlVersionUpgradeAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $upgradeExitCode = $LASTEXITCODE
                if ($upgradeExitCode -ne 0) { throw "SQL version upgrade reference failed (exit $upgradeExitCode)." }
              } else { Write-Host 'NOT_APPLICABLE capability: upgrade' }
              if ('batch' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-BatchWorkflowSmokeTest.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -Version 2025 *>> $logPath
                $batchExitCode = $LASTEXITCODE
                if ($batchExitCode -ne 0) { throw "Podman Batch Workflow Smoke Test endete mit Exitcode $batchExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: batch' }

              if ('tool' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerToolAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld -EvidencePath (Join-Path $env:RUNNER_TEMP 'podman-container-tool-acceptance.json') *>> $logPath
                $toolExitCode = $LASTEXITCODE
                if ($toolExitCode -ne 0) { throw "Podman Container-Tool-Akzeptanz endete mit Exitcode $toolExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: tool' }

              if ('removal' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PersistentStorageRemovalExecutorAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -Policy DELETE_WITH_RUN `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $removalExitCode = $LASTEXITCODE
                if ($removalExitCode -ne 0) { throw "Podman Persistent-Storage-Removal-Akzeptanz endete mit Exitcode $removalExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: removal' }

              if ('package' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerDatabasePackageExportAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $packageExportExitCode = $LASTEXITCODE
                if ($packageExportExitCode -ne 0) { throw "Podman Database-Package-Export-Akzeptanz endete mit Exitcode $packageExportExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: package' }

              if ('transfer-preflight' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PortableContainerTransferPreflightAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $preflightExitCode = $LASTEXITCODE
                if ($preflightExitCode -ne 0) { throw "Podman Portable-Container-Transfer-Preflight-Akzeptanz endete mit Exitcode $preflightExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: transfer-preflight' }

              if ('transfer' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PortableContainerTransferAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $transferExitCode = $LASTEXITCODE
                if ($transferExitCode -ne 0) { throw "Podman Portable-Container-Transfer-Akzeptanz endete mit Exitcode $transferExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: transfer' }

              if ('ai-vector' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-AiVectorCoreAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -Provider podman *>> $logPath
                $aiVectorExitCode = $LASTEXITCODE
                if ($aiVectorExitCode -ne 0) { throw "Podman AI-Vector-Core-Akzeptanz endete mit Exitcode $aiVectorExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: ai-vector' }

              if ('ai-samples' -cin $selectedCapabilities) {
                & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-AiPodmanSamplesReferenceAcceptance.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT `
                  -RuntimeMutexAlreadyHeld *>> $logPath
                $aiSamplesExitCode = $LASTEXITCODE
                if ($aiSamplesExitCode -ne 0) { throw "Podman AI-Sample-Referenz endete mit Exitcode $aiSamplesExitCode." }
              } else { Write-Host 'NOT_APPLICABLE capability: ai-samples' }
            }
            $completedCapabilities = if ($env:SQL_SERVER_LAB_CI_MODE -ceq 'cli-acceptance') { 'cli-acceptance' } else { $selectedCapabilities -join ',' }
            "validated_capabilities=$completedCapabilities" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'PODMAN_RUNTIME_SUCCEEDED'
          }
          catch {
            try { $_ | Out-String | Add-Content -LiteralPath $logPath } catch { }
            Write-Host '::error title=PODMAN_RUNTIME_FAILED::PODMAN_RUNTIME_FAILED: Private diagnostics remain local on the runner.'
            exit 1
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            if ($null -ne $mutex) { $mutex.Dispose() }
          }

      - name: Complete own test-resource cleanup
        if: ${{ always() && env.SQL_SERVER_LAB_CI_OWN_STATE_ROOT != '' }}
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -NonInteractive -File ./Tests/Integration/Complete-OwnedHostTestRoot.ps1 -StateRoot $env:SQL_SERVER_LAB_CI_OWN_STATE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'OWNED_TEST_CLEANUP_RECOVERY_REQUIRED: protected runner-local state retained.' }

  owned-run-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'owned-run-recovery'
    runs-on: [self-hosted, SQL_Lab, Podman]
    timeout-minutes: 10
    env:
      RECOVERY_LOCATION: ${{ inputs.root_location }}
      RECOVERY_STATE_ID: ${{ inputs.state_id }}
      RECOVERY_POLICY_ID: ${{ inputs.policy_id }}
      RECOVERY_RUN_ID: ${{ inputs.run_id }}
      RECOVERY_PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Recover exactly one receipt-bound nonpersistent CI run
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try {
            foreach($name in @('RECOVERY_POLICY_ID','RECOVERY_RUN_ID')) {
              $value=[Environment]::GetEnvironmentVariable($name)
              $id=[guid]::Empty
              if(-not [guid]::TryParseExact($value,'D',[ref]$id) -or $id -eq [guid]::Empty -or $id.ToString('D') -cne $value){throw 'RECOVERY_ID_INVALID'}
            }
            $stateId=$env:RECOVERY_STATE_ID
            if($stateId -cnotmatch '^[0-9a-f]{32}$' -or $stateId -ceq ('0'*32)){throw 'RECOVERY_STATE_ID_INVALID'}
            if($env:RECOVERY_PROVIDER -cnotin @('docker','podman')){throw 'RECOVERY_PROVIDER_INVALID'}
            $root=switch -CaseSensitive ($env:RECOVERY_LOCATION) {
              profile { Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) ('SqlServerLab/diagnostics/ci-runs/ci-'+$stateId) }
              runner-work { Join-Path (Split-Path $env:RUNNER_TEMP -Parent) $stateId }
              default { throw 'RECOVERY_LOCATION_INVALID' }
            }
            $null=& ./Tools/Initialize-SqlServerLabHostTools.ps1 -Name $env:RECOVERY_PROVIDER
            $module=Import-Module ./SqlServerLab.psd1 -Force -PassThru
            & $module {
              param($Root,$PolicyId,$RunId,$Provider)
              $policy=Get-LabOwnedHostPolicy -StateRoot $Root -Required
              if($policy.PolicyId -cne $PolicyId){throw 'RECOVERY_POLICY_MISMATCH'}
              $null=Get-LabOwnedHostRunPolicy -RunId $RunId -StateRoot $Root
              $state=Get-LabRunState -RunId $RunId -StateRoot $Root
              $plan=Get-Content (Join-Path $Root ('runs/'+$RunId+'/cleanup-plan.json')) -Raw|ConvertFrom-Json -Depth 30
              if($state.runId -cne $RunId -or $plan.runId -cne $RunId -or $plan.scopeId -cne $state.scopeId -or
                $state.metadata.persistentData -isnot [bool] -or $state.metadata.persistentData -ne $false -or
                @($plan.steps).Count -eq 0 -or @($plan.steps|Where-Object {$_.provider -cne $Provider -or $_.resourceType -cnotin @('container','volume')}).Count){throw 'RECOVERY_RUN_SCOPE_INVALID'}
              $mutex=[Threading.Mutex]::new($false,'Global\SQL_Server_Lab_Runtime_Smoke')
              $held=$false
              $log=Join-Path $Root 'owned-ci-recovery.private.log'
              try {
                try {$held=$mutex.WaitOne([timespan]::FromMinutes(2))}catch [Threading.AbandonedMutexException]{$held=$true}
                if(-not $held){throw 'RECOVERY_RUNTIME_MUTEX_TIMEOUT'}
                # Missing containers can leave a task after an interrupted or
                # unelevated cleanup. The existing guard verifies its original
                # policy, intention, script hash, principal and receipt first.
                Remove-LabOwnedHostAutoStartIfUnused -StateRoot $Root -RunId $RunId -Provider $Provider *> $log
                Remove-SqlServerLab -RunId $RunId -StateRoot $Root -Force -Confirm:$false *>> $log
                $final=Get-LabRunState -RunId $RunId -StateRoot $Root
                if($final.state -cne 'REMOVED'){throw 'RECOVERY_RUN_NOT_REMOVED'}
                foreach($kind in @('container','volume')) {
                  $arguments=if($kind -ceq 'container'){@('ps','-a','--filter',('label=sql-server-lab.run-id='+$RunId),'--format','{{.ID}}')}else{@('volume','ls','--filter',('label=sql-server-lab.run-id='+$RunId),'--format','{{.Name}}')}
                  $remaining=Invoke-LabOwnedHostPinnedCommand -StateRoot $Root -Provider $Provider -Arguments $arguments
                  if($remaining.ExitCode -ne 0 -or $remaining.Stdout.Trim()){throw 'RECOVERY_NATIVE_RESIDUE'}
                }
                $expectedTask='SQL_Server_Lab_Owned_'+$policy.PolicyId.Replace('-','')+'_'+$RunId.Replace('-','')+'_'+$Provider
                $tasks=@(Get-ScheduledTask -ErrorAction Stop)
                if(@($tasks|Where-Object {$_.TaskPath -ceq '\' -and $_.TaskName -ceq $expectedTask}).Count){throw 'RECOVERY_TASK_REMAINS'}
              } finally {if($held){$mutex.ReleaseMutex()};$mutex.Dispose()}
            } $root $env:RECOVERY_POLICY_ID $env:RECOVERY_RUN_ID $env:RECOVERY_PROVIDER
            Write-Host 'OWNED_CI_RUN_RECOVERY_SUCCEEDED: no containers, volumes or autostart task remain.'
          } catch {throw 'OWNED_CI_RUN_RECOVERY_FAILED: inspect protected runner-local diagnostics.'}
