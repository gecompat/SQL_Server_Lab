name: Runtime Smoke - Podman

on:
  workflow_call:
    inputs:
      mode:
        description: Auszufuehrender Podman-Nachweis
        required: false
        default: lifecycle
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Auszufuehrender Podman-Nachweis
        required: true
        default: lifecycle
        type: choice
        options:
          - lifecycle
          - cli-acceptance

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-podman-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman-smoke:
    name: Podman provider with SQL Server 2025
    runs-on: [self-hosted, SQL_Lab, Podman]
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          .\Tests\Integration\Initialize-PodmanRuntime.ps1
          sqlcmd -?
          if ($LASTEXITCODE -ne 0) { throw 'sqlcmd ist nicht verwendbar.' }

      - name: Podman SQL Server 2025 lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'podman-smoke-matrix.log'
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Runtime_Smoke' } else { 'SQL_Server_Lab_Runtime_Smoke' }
          $mutex = [System.Threading.Mutex]::new($false, $mutexName)
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(10))
            if (-not $acquired) { throw 'Runtime-Smoke-Hostlock konnte innerhalb von 10 Minuten nicht erworben werden.' }

            if ('${{ inputs.mode }}' -eq 'cli-acceptance') {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerCliAcceptance.ps1 `
                -Provider podman `
                -Version 2022-CU18 2>&1 | Tee-Object -FilePath $logPath
              if ($LASTEXITCODE -ne 0) { throw "Podman CLI Acceptance endete mit Exitcode $LASTEXITCODE." }
            }
            else {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SmokeMatrix.ps1 `
                -Provider podman `
                -ReferenceVersion 2025 `
                -TestAutoStart 2>&1 | Tee-Object -FilePath $logPath
              $matrixExitCode = $LASTEXITCODE
              if ($matrixExitCode -ne 0) { throw "Podman Smoke Matrix endete mit Exitcode $matrixExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-RestoreSmokeTest.ps1 `
                -Provider podman `
                -Version 2025 2>&1 | Tee-Object -FilePath $logPath -Append
              $restoreExitCode = $LASTEXITCODE
              if ($restoreExitCode -ne 0) { throw "Podman Restore Smoke Test endete mit Exitcode $restoreExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-BatchWorkflowSmokeTest.ps1 `
                -Provider podman `
                -Version 2025 2>&1 | Tee-Object -FilePath $logPath -Append
              $batchExitCode = $LASTEXITCODE
              if ($batchExitCode -ne 0) { throw "Podman Batch Workflow Smoke Test endete mit Exitcode $batchExitCode." }
            }
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }

      - name: Upload Podman smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: podman-smoke-matrix-log
          path: ${{ runner.temp }}/podman-smoke-matrix.log
          if-no-files-found: ignore
          retention-days: 7
