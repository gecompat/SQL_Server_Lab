name: Runtime Smoke - Podman

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Catalogs/**'
      - 'Private/**'
      - 'Providers/Podman/**'
      - 'Public/**'
      - 'Tests/**'
      - 'SqlServerLab.psd1'
      - 'SqlServerLab.psm1'
      - '.github/workflows/runtime-smoke-podman.yml'

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-podman
  cancel-in-progress: false

jobs:
  podman-smoke:
    name: Podman provider, versions and parallel runs
    runs-on: [self-hosted, SQL_Lab, Podman]
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          podman info
          podman machine list
          sqlcmd -?

      - name: Static contracts
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Static\Invoke-DocumentationChecks.ps1
          .\Tests\Static\Invoke-ArtifactResolverChecks.ps1
          .\Tests\Static\Invoke-ReadinessContractChecks.ps1
          .\Tests\Static\Invoke-MixedProviderLifecycleChecks.ps1
          .\Tests\Static\Invoke-ProjectAdapterChecks.ps1
          .\Tests\Static\Invoke-SampleHandlerChecks.ps1
          .\Tests\Static\Invoke-ManifestBuilderChecks.ps1

      - name: Podman smoke matrix
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'podman-smoke-matrix.log'
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Runtime_Smoke' } else { 'SQL_Server_Lab_Runtime_Smoke' }
          $mutex = [System.Threading.Mutex]::new($false, $mutexName)
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(10))
            if (-not $acquired) { throw 'Runtime-Smoke-Hostlock konnte innerhalb von 10 Minuten nicht erworben werden.' }

            & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SmokeMatrix.ps1 `
              -Provider podman `
              -FullMatrix `
              -IncludeParallel 2>&1 | Tee-Object -FilePath $logPath
            $matrixExitCode = $LASTEXITCODE
            if ($matrixExitCode -ne 0) { throw "Podman Smoke Matrix endete mit Exitcode $matrixExitCode." }
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }

      - name: Upload Podman smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-smoke-matrix-log
          path: ${{ runner.temp }}/podman-smoke-matrix.log
          if-no-files-found: ignore
          retention-days: 7
