name: PR3 Podman Port Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr3-docker-diagnosis.yml
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  podman-port-diagnosis:
    name: Podman container and port diagnosis
    runs-on:
      - self-hosted
      - SQL_Lab
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-consistency-repair

      - name: Diagnose raw Podman SQL container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $containerName = "sql-lab-podman-diag-$env:GITHUB_RUN_ID"
          $port = 14330
          $password = "SqlLab_$([guid]::NewGuid().ToString('N'))_Aa1!"
          $image = 'mcr.microsoft.com/mssql/server:2022-latest'

          function Test-TcpPort {
              param([string]$HostName, [int]$Port)
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                  $task = $client.ConnectAsync($HostName, $Port)
                  if (-not $task.Wait(1000)) { return $false }
                  return $client.Connected
              }
              catch { return $false }
              finally { $client.Dispose() }
          }

          try {
              podman info | Out-Null
              $arguments = @(
                  'run', '-d',
                  '--name', $containerName,
                  '-p', "${port}:1433",
                  '-e', 'ACCEPT_EULA=Y',
                  '-e', "MSSQL_SA_PASSWORD=$password",
                  '-e', 'MSSQL_PID=Developer',
                  '--memory', '4096m',
                  '--cpus', '4',
                  '--health-cmd', '/opt/mssql-tools*/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b',
                  '--health-interval', '5s',
                  '--health-timeout', '3s',
                  '--health-retries', '30',
                  $image
              )

              $containerId = podman @arguments
              if ($LASTEXITCODE -ne 0) {
                  throw 'podman run ist fehlgeschlagen.'
              }
              Write-Host "ContainerId=$containerId"

              for ($attempt = 1; $attempt -le 40; $attempt++) {
                  $state = (podman inspect $containerName --format '{{.State.Status}}|{{.State.ExitCode}}|{{.State.Error}}' 2>&1 | Out-String).Trim()
                  $mapping = (podman port $containerName 1433 2>&1 | Out-String).Trim()
                  $tcpOpen = Test-TcpPort -HostName '127.0.0.1' -Port $port
                  Write-Host "attempt=$attempt state=$state tcpOpen=$tcpOpen mapping=$mapping"

                  if ($tcpOpen) {
                      $output = sqlcmd -S "127.0.0.1,$port" -U sa -P $password -C -b -Q 'SET NOCOUNT ON; SELECT 1;' -h -1 -W 2>&1
                      if ($LASTEXITCODE -eq 0) {
                          Write-Host "sqlcmd=SUCCESS output=$(($output | Out-String).Trim())"
                          exit 0
                      }
                      Write-Host "sqlcmd=NOT_READY output=$(($output | Out-String).Trim())"
                  }

                  if ($state -match '^(exited|dead)\|') { break }
                  Start-Sleep -Seconds 3
              }

              Write-Host '--- podman inspect summary ---'
              podman inspect $containerName --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} ports={{json .NetworkSettings.Ports}}'
              Write-Host '--- podman logs ---'
              podman logs --tail 200 $containerName
              throw 'Podman-Container wurde nicht ueber den Hostport erreichbar.'
          }
          finally {
              podman rm -f $containerName 1>$null 2>$null
          }
