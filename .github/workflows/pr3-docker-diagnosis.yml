name: PR3 Podman Snapshot Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr3-docker-diagnosis.yml
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  podman-snapshot:
    name: Podman 30-second snapshot
    runs-on:
      - self-hosted
      - SQL_Lab
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-consistency-repair

      - name: Capture Podman SQL snapshot
        id: diagnosis
        continue-on-error: true
        shell: pwsh
        env:
          DIAG_RESULT: ${{ runner.temp }}/pr3-podman-snapshot.txt
        run: |
          $ErrorActionPreference = 'Stop'
          $containerName = "sql-lab-podman-snapshot-$env:GITHUB_RUN_ID"
          $port = 14330
          $password = "SqlLab_$([guid]::NewGuid().ToString('N'))_Aa1!"
          $image = 'mcr.microsoft.com/mssql/server:2022-latest'

          function Test-TcpPort {
              param([string]$HostName, [int]$Port)
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                  $task = $client.ConnectAsync($HostName, $Port)
                  if (-not $task.Wait(1000)) { return $false }
                  return $client.Connected
              }
              catch { return $false }
              finally { $client.Dispose() }
          }

          try {
              podman info | Out-Null
              $arguments = @(
                  'run', '-d',
                  '--name', $containerName,
                  '-p', "${port}:1433",
                  '-e', 'ACCEPT_EULA=Y',
                  '-e', "MSSQL_SA_PASSWORD=$password",
                  '-e', 'MSSQL_PID=Developer',
                  '--memory', '4096m',
                  '--cpus', '4',
                  $image
              )

              $containerId = (podman @arguments | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'podman run ist fehlgeschlagen.' }
              Start-Sleep -Seconds 30

              $state = (podman inspect $containerName --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' 2>&1 | Out-String).Trim()
              $ports = (podman inspect $containerName --format 'ports={{json .NetworkSettings.Ports}}' 2>&1 | Out-String).Trim()
              $mapping = (podman port $containerName 1433 2>&1 | Out-String).Trim()
              $tcpOpen = Test-TcpPort -HostName '127.0.0.1' -Port $port
              $logs = (podman logs --tail 80 $containerName 2>&1 | Out-String).Trim()

              @(
                  "containerId=$containerId"
                  $state
                  $ports
                  "mapping=$mapping"
                  "tcpOpen=$tcpOpen"
                  '--- SQL container log ---'
                  $logs
              ) | Set-Content -LiteralPath $env:DIAG_RESULT -Encoding utf8

              if (-not $tcpOpen) {
                  throw 'Podman-Hostport ist nach 30 Sekunden nicht erreichbar.'
              }
          }
          catch {
              if (-not (Test-Path -LiteralPath $env:DIAG_RESULT)) {
                  $_.Exception.Message | Set-Content -LiteralPath $env:DIAG_RESULT -Encoding utf8
              }
              throw
          }
          finally {
              podman rm -f $containerName 1>$null 2>$null
          }

      - name: Write snapshot into PR body
        if: always()
        uses: actions/github-script@v7
        env:
          DIAG_RESULT: ${{ runner.temp }}/pr3-podman-snapshot.txt
          DIAG_OUTCOME: ${{ steps.diagnosis.outcome }}
        with:
          script: |
            const fs = require('fs');
            const start = '<!-- PR3_PODMAN_SNAPSHOT_START -->';
            const end = '<!-- PR3_PODMAN_SNAPSHOT_END -->';
            const text = fs.existsSync(process.env.DIAG_RESULT)
              ? fs.readFileSync(process.env.DIAG_RESULT, 'utf8')
              : 'Kein Snapshot erzeugt.';
            const lines = text.split(/\r?\n/).filter(Boolean).slice(-100);
            const block = [
              start,
              '## Podman 30-Sekunden-Snapshot',
              '',
              `Ergebnis: **${process.env.DIAG_OUTCOME.toUpperCase()}**`,
              '',
              '```text',
              lines.join('\n'),
              '```',
              end
            ].join('\n');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3
            });
            let body = pr.data.body || '';
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`, 'm');
            body = pattern.test(body) ? body.replace(pattern, block) : `${body}\n\n${block}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3,
              body
            });

      - name: Fail job when snapshot failed
        if: steps.diagnosis.outcome == 'failure'
        shell: pwsh
        run: throw 'Podman-Snapshot ist fehlgeschlagen. Siehe PR-Text.'
