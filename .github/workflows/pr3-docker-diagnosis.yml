name: PR3 Podman Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr3-docker-diagnosis.yml
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  podman-minimal:
    name: Podman minimal provisioning
    runs-on:
      - self-hosted
      - SQL_Lab
    timeout-minutes: 25

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-consistency-repair

      - name: Run focused Podman diagnosis
        id: diagnosis
        continue-on-error: true
        shell: pwsh
        env:
          DIAG_LOG: ${{ runner.temp }}/pr3-podman-diagnosis.log
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              Test-ModuleManifest ./SqlServerLab.psd1 | Out-Null
              Import-Module ./SqlServerLab.psd1 -Force
              podman info | Out-Null
              ./Tests/Integration/Invoke-SmokeTest.ps1 -Provider podman -Version '2022' *>&1 |
                  Tee-Object -FilePath $env:DIAG_LOG
          }
          catch {
              $_ | Out-String | Tee-Object -FilePath $env:DIAG_LOG -Append
              throw
          }

      - name: Write compact result into PR body
        if: always()
        uses: actions/github-script@v7
        env:
          DIAG_LOG: ${{ runner.temp }}/pr3-podman-diagnosis.log
          DIAG_OUTCOME: ${{ steps.diagnosis.outcome }}
        with:
          script: |
            const fs = require('fs');
            const start = '<!-- PR3_PODMAN_DIAG_START -->';
            const end = '<!-- PR3_PODMAN_DIAG_END -->';
            let text = fs.existsSync(process.env.DIAG_LOG)
              ? fs.readFileSync(process.env.DIAG_LOG, 'utf8')
              : 'Keine Diagnoselogdatei erzeugt.';
            const lines = text.split(/\r?\n/).filter(Boolean);
            const tail = lines.slice(-35).join('\n');
            const block = [
              start,
              '## Aktuelle Podman-Diagnose',
              '',
              `Ergebnis: **${process.env.DIAG_OUTCOME.toUpperCase()}**`,
              '',
              '```text',
              tail,
              '```',
              end
            ].join('\n');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3
            });
            let body = pr.data.body || '';
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`, 'm');
            body = pattern.test(body)
              ? body.replace(pattern, block)
              : `${body}\n\n${block}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3,
              body
            });

      - name: Fail job when diagnosis failed
        if: steps.diagnosis.outcome == 'failure'
        shell: pwsh
        run: throw 'Podman-Diagnose ist fehlgeschlagen. Siehe PR-Text.'
