name: PR3 Podman Route Diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr3-docker-diagnosis.yml
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  podman-route:
    name: Podman machine route diagnosis
    runs-on:
      - self-hosted
      - SQL_Lab
    timeout-minutes: 6

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-consistency-repair

      - name: Test localhost and machine routes
        id: diagnosis
        continue-on-error: true
        shell: pwsh
        env:
          DIAG_RESULT: ${{ runner.temp }}/pr3-podman-route.txt
        run: |
          $ErrorActionPreference = 'Stop'
          $containerName = "sql-lab-podman-route-$env:GITHUB_RUN_ID"
          $port = 14330
          $password = "SqlLab_$([guid]::NewGuid().ToString('N'))_Aa1!"
          $image = 'mcr.microsoft.com/mssql/server:2022-latest'

          function Test-TcpPort {
              param([string]$HostName, [int]$Port)
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                  $task = $client.ConnectAsync($HostName, $Port)
                  if (-not $task.Wait(1000)) { return $false }
                  return $client.Connected
              }
              catch { return $false }
              finally { $client.Dispose() }
          }

          try {
              podman info | Out-Null
              $machineAddressText = (podman machine ssh -- hostname -I 2>$null | Out-String).Trim()
              $machineAddress = [regex]::Match($machineAddressText, '(?<!\d)(?:\d{1,3}\.){3}\d{1,3}(?!\d)').Value
              $machineDetected = -not [string]::IsNullOrWhiteSpace($machineAddress)

              $arguments = @(
                  'run', '-d',
                  '--name', $containerName,
                  '-p', "${port}:1433",
                  '-e', 'ACCEPT_EULA=Y',
                  '-e', "MSSQL_SA_PASSWORD=$password",
                  '-e', 'MSSQL_PID=Developer',
                  '--memory', '4096m',
                  '--cpus', '4',
                  $image
              )
              $null = podman @arguments
              if ($LASTEXITCODE -ne 0) { throw 'podman run ist fehlgeschlagen.' }

              $localhostTcp = $false
              $machineTcp = $false
              $sqlViaMachine = $false
              for ($attempt = 1; $attempt -le 40; $attempt++) {
                  $localhostTcp = Test-TcpPort -HostName '127.0.0.1' -Port $port
                  if ($machineDetected) {
                      $machineTcp = Test-TcpPort -HostName $machineAddress -Port $port
                  }

                  if ($machineTcp) {
                      $output = sqlcmd -S "${machineAddress},${port}" -U sa -P $password -C -b -Q 'SET NOCOUNT ON; SELECT 1;' -h -1 -W 2>&1
                      if ($LASTEXITCODE -eq 0) {
                          $sqlViaMachine = $true
                          break
                      }
                  }
                  if ($localhostTcp) { break }
                  Start-Sleep -Seconds 3
              }

              @(
                  "machineAddressDetected=$machineDetected"
                  "localhostTcp=$localhostTcp"
                  "machineTcp=$machineTcp"
                  "sqlViaMachine=$sqlViaMachine"
              ) | Set-Content -LiteralPath $env:DIAG_RESULT -Encoding utf8

              if (-not $localhostTcp -and -not $sqlViaMachine) {
                  throw 'Weder localhost noch die Podman-Machine-Route ist fuer SQL erreichbar.'
              }
          }
          catch {
              if (-not (Test-Path -LiteralPath $env:DIAG_RESULT)) {
                  $_.Exception.Message | Set-Content -LiteralPath $env:DIAG_RESULT -Encoding utf8
              }
              throw
          }
          finally {
              podman rm -f $containerName 1>$null 2>$null
          }

      - name: Write route result into PR body
        if: always()
        uses: actions/github-script@v7
        env:
          DIAG_RESULT: ${{ runner.temp }}/pr3-podman-route.txt
          DIAG_OUTCOME: ${{ steps.diagnosis.outcome }}
        with:
          script: |
            const fs = require('fs');
            const start = '<!-- PR3_PODMAN_ROUTE_START -->';
            const end = '<!-- PR3_PODMAN_ROUTE_END -->';
            const text = fs.existsSync(process.env.DIAG_RESULT)
              ? fs.readFileSync(process.env.DIAG_RESULT, 'utf8').trim()
              : 'Kein Routenergebnis erzeugt.';
            const block = [
              start,
              '## Podman-Routendiagnose',
              '',
              `Ergebnis: **${process.env.DIAG_OUTCOME.toUpperCase()}**`,
              '',
              '```text',
              text,
              '```',
              end
            ].join('\n');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3
            });
            let body = pr.data.body || '';
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`, 'm');
            body = pattern.test(body) ? body.replace(pattern, block) : `${body}\n\n${block}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 3,
              body
            });

      - name: Fail when no route works
        if: steps.diagnosis.outcome == 'failure'
        shell: pwsh
        run: throw 'Podman-Routendiagnose ist fehlgeschlagen. Siehe PR-Text.'
