name: CSharp SQL2025 Native Acceptance
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Approved CSharp acceptance profile
        required: true
        type: choice
        options: [csharp-sql2025]
      request_sha256:
        description: SHA256 of the explicitly staged local request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sql-server-lab-csharp-native
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'gecompat/SQL_Server_Lab' && github.event.repository.full_name == github.repository
    runs-on: [self-hosted, SQL_Lab, Hyper-V]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Isolated CSharp SQL2025 acceptance
        shell: pwsh
        env:
          CSHARP_PROFILE: ${{ inputs.profile }}
          CSHARP_REQUEST_HASH: ${{ inputs.request_sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          $localLog=Join-Path $env:RUNNER_TEMP ('csharp-native-'+[guid]::NewGuid().ToString('N')+'.log')
          try {
          & ./Tests/Integration/Invoke-CSharpNativeRequestAcceptance.ps1 -Profile $env:CSHARP_PROFILE -RequestSha256 $env:CSHARP_REQUEST_HASH *> $localLog
          Write-Host 'CSharp SQL2025 Native Acceptance: PASS; own cleanup verified.'
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $localLog
            . ./Tests/Common/CSharpNativeProfileRequest.ps1
            $diagnostic=Get-CSharpNativeRequestFailureDiagnostic $_
            $diagnostic | ConvertTo-Json -Compress | Write-Host
            throw $diagnostic.ReasonCode
          }
