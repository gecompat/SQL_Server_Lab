name: CSharp SQL2025 Native Acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Explicit verified Windows Server 2025 OS_SEALED artifact
        required: true
        type: string
      payload_root:
        description: Local directory containing extension.zip, runtime.zip and SqlServerLab.CSharpProbe.dll
        required: true
        type: string
      package_sha256:
        description: Independently reviewed extension SHA256
        required: true
        type: string
      probe_sha256:
        description: Independently reviewed probe SHA256
        required: true
        type: string
      sql_media_path:
        description: Registered SQL2025 ISO path relative to media root
        required: true
        type: string
      media_edition:
        description: SQL2025 media edition
        required: true
        type: choice
        options: [Enterprise, Standard, Eval]
      state_root:
        description: Existing registered state root; empty uses runner configuration
        required: false
        type: string
      media_root:
        description: Existing hash-registered media root; empty uses runner configuration
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sql-server-lab-csharp-native
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'gecompat/SQL_Server_Lab' && github.event.repository.full_name == github.repository
    runs-on: [self-hosted, SQL_Lab, Hyper-V]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Isolated CSharp SQL2025 acceptance
        shell: pwsh
        env:
          CSHARP_ARTIFACT: ${{ inputs.artifact_id }}
          CSHARP_PAYLOAD: ${{ inputs.payload_root }}
          CSHARP_PACKAGE_HASH: ${{ inputs.package_sha256 }}
          CSHARP_PROBE_HASH: ${{ inputs.probe_sha256 }}
          CSHARP_SQL_MEDIA: ${{ inputs.sql_media_path }}
          CSHARP_MEDIA_EDITION: ${{ inputs.media_edition }}
          CSHARP_STATE: ${{ inputs.state_root }}
          CSHARP_MEDIA_ROOT: ${{ inputs.media_root }}
        run: |
          $ErrorActionPreference='Stop'
          $localLog=Join-Path $env:RUNNER_TEMP ('csharp-native-'+[guid]::NewGuid().ToString('N')+'.log')
          try {
          & ./Tests/Integration/Invoke-CSharpHyperVAcceptance.ps1 `
            -ArtifactId $env:CSHARP_ARTIFACT `
            -Package (Join-Path $env:CSHARP_PAYLOAD 'extension.zip') -PackageSha256 $env:CSHARP_PACKAGE_HASH `
            -Probe (Join-Path $env:CSHARP_PAYLOAD 'SqlServerLab.CSharpProbe.dll') -ProbeSha256 $env:CSHARP_PROBE_HASH `
            -RuntimeArchive (Join-Path $env:CSHARP_PAYLOAD 'runtime.zip') `
            -SqlMediaPath $env:CSHARP_SQL_MEDIA -MediaEdition $env:CSHARP_MEDIA_EDITION `
            -StateRoot $env:CSHARP_STATE -MediaRoot $env:CSHARP_MEDIA_ROOT *> $localLog
          Write-Host 'CSharp SQL2025 Native Acceptance: PASS; own cleanup verified.'
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $localLog
            . ./Tests/Common/CSharpNativeAcceptance.ps1
            $diagnostic=Get-CSharpNativeFailureDiagnostic $_
            $diagnostic | ConvertTo-Json -Compress | Write-Host
            throw $diagnostic.ReasonCode
          }
