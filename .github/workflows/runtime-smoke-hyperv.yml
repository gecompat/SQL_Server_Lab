name: Runtime Smoke - Hyper-V Lifecycle

on:
  workflow_call:
    inputs:
      mode:
        description: Auszufuehrender Hyper-V-Nachweis
        required: false
        default: lifecycle
        type: string
      image_artifact_id:
        description: Optionales OS_SEALED-Artifact fuer den Slot-Batch
        required: false
        type: string
      media_root:
        description: Media Root fuer die vollstaendige CLI-Akzeptanz
        required: false
        default: D:\Lab_Base
        type: string
      media_edition:
        description: SQL-Medienedition fuer die vollstaendige CLI-Akzeptanz
        required: false
        default: Enterprise
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Auszufuehrender Hyper-V-Nachweis
        required: true
        default: lifecycle
        type: choice
        options:
          - lifecycle
          - slot-batch
          - shared-environments
          - cli-acceptance
      image_artifact_id:
        description: Optionales OS_SEALED-Artifact; leer waehlt das neueste passende Artifact
        required: false
        type: string
      media_root:
        description: Media Root mit hashregistrierter SQL-ISO
        required: false
        default: D:\Lab_Base
        type: string
      media_edition:
        description: SQL-Medienedition fuer die vollstaendige CLI-Akzeptanz
        required: true
        default: Enterprise
        type: choice
        options:
          - Enterprise
          - Standard
          - Eval

permissions:
  contents: read

env:
  SQL_SERVER_LAB_RESOURCE_LIFECYCLE: test
  SQL_SERVER_LAB_TEST_OPERATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: sql-server-lab-runtime-smoke-hyperv-${{ github.workflow }}-${{ github.ref }}
  # Forced cancellation can bypass the PowerShell finally cleanup on the
  # persistent self-hosted runner. Serialize newer runs instead.
  cancel-in-progress: false

jobs:
  # Jede Runtime-Ressource ist damit auch nach einem harten Runner-Abbruch
  # zeitgebunden und vom Maintenance-Plan sicher als Testartefakt erkennbar.
  hyperv-lifecycle-smoke:
    name: Hyper-V lifecycle, isolated OS-slot batch, or shared environments
    runs-on: [self-hosted, SQL_Lab, Hyper-V]
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hyper-V preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          $null = Get-VMHost -ErrorAction Stop
          Get-Command New-VM, New-VHD, Get-VMFirmware -ErrorAction Stop

      - name: Hyper-V lifecycle smoke
        if: inputs.mode == 'lifecycle'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-HyperVSmokeTest.ps1

      - name: Hyper-V OS-slot batch with scoped cleanup
        if: inputs.mode == 'slot-batch'
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\SqlServerLab.psd1 -Force
          $module = Get-Module SqlServerLab
          $artifactId = '${{ inputs.image_artifact_id }}'
          if ([string]::IsNullOrWhiteSpace($artifactId)) {
            $artifact = & $module {
              @(Get-HyperVImageArtifact -SkipIntegrityCheck | Where-Object {
                [string]$_.artifactState -eq 'OS_SEALED' -and
                [string]$_.licenseType -ne 'test-only'
              } | Sort-Object { [datetime]$_.registeredAt } -Descending | Select-Object -First 1)[0]
            }
            if (-not $artifact) { throw 'HYPERV_SLOT_BATCH_OS_SEALED_ARTIFACT_NOT_FOUND' }
            $artifactId = [string]$artifact.artifactId
          }
          .\Tests\Integration\Invoke-BatchWorkflowSmokeTest.ps1 `
            -Provider hyperv `
            -ArtifactId $artifactId

      - name: Recover registered Windows test environments
        if: inputs.mode == 'shared-environments'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-TestEnvironmentRuntimeReadiness.ps1 -Recover

      - name: Accept all shared SQL test environments and CMS
        if: inputs.mode == 'shared-environments'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-TestEnvironmentAcceptance.ps1

      - name: Fresh Windows slot and complete SQL CLI acceptance
        if: inputs.mode == 'cli-acceptance'
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{
            MediaRoot = '${{ inputs.media_root }}'
            SqlVersion = '2025'
            MediaEdition = '${{ inputs.media_edition }}'
          }
          $artifactId = '${{ inputs.image_artifact_id }}'
          if (-not [string]::IsNullOrWhiteSpace($artifactId)) { $arguments.ArtifactId = $artifactId }
          .\Tests\Integration\Invoke-HyperVCliAcceptance.ps1 @arguments
