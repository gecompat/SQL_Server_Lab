name: Runtime Smoke - Hyper-V Lifecycle

on:
  workflow_call:
    inputs:
      mode:
        description: Auszufuehrender Hyper-V-Nachweis
        required: false
        default: lifecycle
        type: string
      image_artifact_id:
        description: Optionales OS_SEALED-Artifact fuer den Slot-Batch oder SQL_PREPARED_SEALED-Artifact fuer Reconcile-Acceptances
        required: false
        type: string
      media_root:
        description: Media Root fuer die vollstaendige CLI-Akzeptanz
        required: false
        default: D:\Lab_Base
        type: string
      media_edition:
        description: SQL-Medienedition fuer die vollstaendige CLI-Akzeptanz
        required: false
        default: Enterprise
        type: string
  workflow_dispatch:
    inputs:
      clone_source_run_id:
        description: Optionaler gestoppter Windows-2025-Slot als Clone-Quelle fuer Ressourcen- oder Storage-Acceptance
        required: false
        type: string
      mode:
        description: Auszufuehrender Hyper-V-Nachweis
        required: true
        default: lifecycle
        type: choice
        options:
          - lifecycle
          - slot-batch
          - shared-environments
          - cli-acceptance
          - locale-acceptance
          - sql-configuration-reconcile-acceptance
          - sql-guest-evaluation-capture-acceptance
          - sql-storage-reconcile-acceptance
          - sql-port-reconcile-acceptance
          - resource-reconcile-acceptance
          - resource-reconcile-own-run-acceptance
          - storage-reconcile-acceptance
          - sample-manifest-acceptance
          - external-runtime-reconcile-acceptance
          - ai-rag-own-run-acceptance
      ai_preflight_only:
        description: Im KI-Own-Run-Modus ausschließlich vorhandenes Artifact und Hostmodelle lesend prüfen
        required: false
        type: boolean
        default: true
      ai_state_root:
        description: Expliziter bestehender State Root für KI-Artifactkatalog und eigenen neuen Run; leer verwendet Runnerkonfiguration
        required: false
        type: string
      resource_state_root:
        description: Expliziter bestehender State Root für die Resource-Own-Run-Abnahme; leer verwendet Runnerkonfiguration
        required: false
        type: string
      capture_state_root:
        description: Expliziter bestehender State Root für SQL-Gast-Capture-Artifactkatalog und eigenen neuen Run; leer verwendet Runnerkonfiguration
        required: false
        type: string
      image_artifact_id:
        description: Optionales OS_SEALED-Artifact fuer den Slot-Batch oder SQL_PREPARED_SEALED-Artifact fuer Reconcile-Acceptances; leer waehlt jeweils das neueste passende Artifact
        required: false
        type: string
      media_root:
        description: Media Root mit hashregistrierter SQL-ISO
        required: false
        default: D:\Lab_Base
        type: string
      media_edition:
        description: SQL-Medienedition fuer die vollstaendige CLI-Akzeptanz
        required: true
        default: Enterprise
        type: choice
        options:
          - Enterprise
          - Standard
          - Eval

permissions:
  contents: read

env:
  SQL_SERVER_LAB_RESOURCE_LIFECYCLE: test
  SQL_SERVER_LAB_TEST_OPERATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: sql-server-lab-runtime-smoke-hyperv-${{ github.workflow }}-${{ github.ref }}
  # Forced cancellation can bypass the PowerShell finally cleanup on the
  # persistent self-hosted runner. Serialize newer runs instead.
  cancel-in-progress: false

jobs:
  # Jede Runtime-Ressource ist damit auch nach einem harten Runner-Abbruch
  # zeitgebunden und vom Maintenance-Plan sicher als Testartefakt erkennbar.
  hyperv-lifecycle-smoke:
    name: Hyper-V lifecycle, isolated OS-slot batch, or shared environments
    runs-on: [self-hosted, SQL_Lab, Hyper-V]
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hyper-V preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          $null = Get-VMHost -ErrorAction Stop
          Get-Command New-VM, New-VHD, Get-VMFirmware -ErrorAction Stop

      - name: Hyper-V lifecycle smoke
        if: inputs.mode == 'lifecycle'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-HyperVSmokeTest.ps1

      - name: Reject AI own-run acceptance outside trusted manual dispatch
        if: inputs.mode == 'ai-rag-own-run-acceptance' && !(github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository)
        run: |
          throw 'AI_HYPERV_MANUAL_DISPATCH_REQUIRED'

      - name: Read-only Hyper-V AI artifact and host model preflight
        if: inputs.mode == 'ai-rag-own-run-acceptance' && github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_SERVER_LAB_CI_AI_STATE_ROOT: ${{ inputs.ai_state_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID)) { throw 'AI_HYPERV_EXPLICIT_ARTIFACT_REQUIRED' }
          .\Tests\Integration\Invoke-AiHyperVOwnRunAcceptance.ps1 -ArtifactId $env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID -StateRoot $env:SQL_SERVER_LAB_CI_AI_STATE_ROOT -PreflightOnly

      - name: Hyper-V AI own-run acceptance
        if: inputs.mode == 'ai-rag-own-run-acceptance' && github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository && inputs.ai_preflight_only == false
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_SERVER_LAB_CI_AI_STATE_ROOT: ${{ inputs.ai_state_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-AiHyperVOwnRunAcceptance.ps1 -ArtifactId $env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID -StateRoot $env:SQL_SERVER_LAB_CI_AI_STATE_ROOT

      - name: Hyper-V Windows locale and cold start
        if: inputs.mode == 'locale-acceptance'
        run: |
          .\Tests\Integration\Invoke-HyperVWindowsLocaleAcceptance.ps1

      - name: Hyper-V OS-slot batch with scoped cleanup
        if: inputs.mode == 'slot-batch'
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\SqlServerLab.psd1 -Force
          $module = Get-Module SqlServerLab
          $artifactId = '${{ inputs.image_artifact_id }}'
          if ([string]::IsNullOrWhiteSpace($artifactId)) {
            $artifact = & $module {
              @(Get-HyperVImageArtifact -SkipIntegrityCheck | Where-Object {
                [string]$_.artifactState -eq 'OS_SEALED' -and
                [string]$_.licenseType -ne 'test-only'
              } | Sort-Object { [datetime]$_.registeredAt } -Descending | Select-Object -First 1)[0]
            }
            if (-not $artifact) { throw 'HYPERV_SLOT_BATCH_OS_SEALED_ARTIFACT_NOT_FOUND' }
            $artifactId = [string]$artifact.artifactId
          }
          .\Tests\Integration\Invoke-BatchWorkflowSmokeTest.ps1 `
            -Provider hyperv `
            -ArtifactId $artifactId

      - name: Recover registered Windows test environments
        if: inputs.mode == 'shared-environments'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-TestEnvironmentRuntimeReadiness.ps1 -Recover

      - name: Accept all shared SQL test environments and CMS
        if: inputs.mode == 'shared-environments'
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-TestEnvironmentAcceptance.ps1

      - name: Fresh Windows slot and complete SQL CLI acceptance
        if: inputs.mode == 'cli-acceptance'
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{
            MediaRoot = '${{ inputs.media_root }}'
            SqlVersion = '2025'
            MediaEdition = '${{ inputs.media_edition }}'
          }
          $artifactId = '${{ inputs.image_artifact_id }}'
          if (-not [string]::IsNullOrWhiteSpace($artifactId)) { $arguments.ArtifactId = $artifactId }
          .\Tests\Integration\Invoke-HyperVCliAcceptance.ps1 @arguments

      - name: Hyper-V SQL configuration reconcile acceptance
        if: inputs.mode == 'sql-configuration-reconcile-acceptance'
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          $artifactId = '${{ inputs.image_artifact_id }}'
          if (-not [string]::IsNullOrWhiteSpace($artifactId)) { $arguments.ArtifactId = $artifactId }
          .\Tests\Integration\Invoke-HyperVSqlConfigurationReconcileAcceptance.ps1 @arguments

      - name: Reject SQL guest evaluation capture outside trusted manual dispatch
        if: inputs.mode == 'sql-guest-evaluation-capture-acceptance' && !(github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository)
        run: |
          throw 'SQL_GUEST_CAPTURE_MANUAL_DISPATCH_REQUIRED'

      - name: Hyper-V SQL guest evaluation capture acceptance
        if: inputs.mode == 'sql-guest-evaluation-capture-acceptance' && github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository
        env:
          SQL_GUEST_CAPTURE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_GUEST_CAPTURE_STATE_ROOT: ${{ inputs.capture_state_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SQL_GUEST_CAPTURE_ARTIFACT_ID)) { throw 'SQL_GUEST_CAPTURE_EXPLICIT_ARTIFACT_REQUIRED' }
          .\Tests\Integration\Invoke-SqlGuestEvaluationCaptureAcceptance.ps1 -ArtifactId $env:SQL_GUEST_CAPTURE_ARTIFACT_ID -StateRoot $env:SQL_GUEST_CAPTURE_STATE_ROOT

      - name: Reject SQL storage reconcile acceptance outside manual main
        if: inputs.mode == 'sql-storage-reconcile-acceptance' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_SQL_STORAGE_RECONCILE_CI_MANUAL_MAIN_REQUIRED'
      - name: Hyper-V SQL storage reconcile acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'sql-storage-reconcile-acceptance'
        env:
          SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID: ${{ inputs.clone_source_run_id }}
          SQL_SERVER_LAB_CI_MEDIA_ROOT: ${{ inputs.media_root }}
          SQL_SERVER_LAB_CI_MEDIA_EDITION: ${{ inputs.media_edition }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          if ([string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID)) { throw 'HYPERV_SQL_STORAGE_RECONCILE_CI_CLONE_SOURCE_REQUIRED' }
          $arguments.CloneSourceRunId = [string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID
          $arguments.MediaRoot = [string]$env:SQL_SERVER_LAB_CI_MEDIA_ROOT
          $arguments.MediaEdition = [string]$env:SQL_SERVER_LAB_CI_MEDIA_EDITION
          .\Tests\Integration\Invoke-HyperVSqlStorageReconcileAcceptance.ps1 @arguments

      - name: Hyper-V SQL port reconcile acceptance
        if: inputs.mode == 'sql-port-reconcile-acceptance'
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          $artifactId = '${{ inputs.image_artifact_id }}'
          if (-not [string]::IsNullOrWhiteSpace($artifactId)) { $arguments.ArtifactId = $artifactId }
          .\Tests\Integration\Invoke-HyperVSqlPortReconcileAcceptance.ps1 @arguments
      - name: Reject resource reconcile acceptance outside manual main
        if: inputs.mode == 'resource-reconcile-acceptance' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_RESOURCE_RECONCILE_CI_MANUAL_MAIN_REQUIRED'
      - name: Reject resource reconcile own-run acceptance outside trusted manual dispatch
        if: inputs.mode == 'resource-reconcile-own-run-acceptance' && !(github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository)
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_RESOURCE_OWN_RUN_MANUAL_DISPATCH_REQUIRED'
      - name: Hyper-V resource reconcile own-run acceptance
        if: inputs.mode == 'resource-reconcile-own-run-acceptance' && github.event_name == 'workflow_dispatch' && github.event.repository.full_name == github.repository
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID: ${{ inputs.clone_source_run_id }}
          SQL_SERVER_LAB_CI_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          SQL_SERVER_LAB_CI_RESOURCE_STATE_ROOT: ${{ inputs.resource_state_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-HyperVResourceReconcileOwnRunAcceptance.ps1 -ArtifactId $env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID -StateRoot $env:SQL_SERVER_LAB_CI_RESOURCE_STATE_ROOT
      - name: Hyper-V resource reconcile acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'resource-reconcile-acceptance'
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID: ${{ inputs.clone_source_run_id }}
          SQL_SERVER_LAB_CI_MEDIA_ROOT: ${{ inputs.media_root }}
          SQL_SERVER_LAB_CI_MEDIA_EDITION: ${{ inputs.media_edition }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          if (-not [string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID)) {
            $arguments.ArtifactId = [string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID
          }
          if (-not [string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID)) {
            $arguments.CloneSourceRunId = [string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID
            $arguments.MediaRoot = [string]$env:SQL_SERVER_LAB_CI_MEDIA_ROOT
            $arguments.MediaEdition = [string]$env:SQL_SERVER_LAB_CI_MEDIA_EDITION
          }
          .\Tests\Integration\Invoke-HyperVResourceReconcileCiAcceptance.ps1 @arguments
      - name: Reject storage reconcile acceptance outside manual main
        if: inputs.mode == 'storage-reconcile-acceptance' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_STORAGE_RECONCILE_CI_MANUAL_MAIN_REQUIRED'
      - name: Hyper-V storage reconcile acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'storage-reconcile-acceptance'
        env:
          SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID: ${{ inputs.clone_source_run_id }}
          SQL_SERVER_LAB_CI_MEDIA_ROOT: ${{ inputs.media_root }}
          SQL_SERVER_LAB_CI_MEDIA_EDITION: ${{ inputs.media_edition }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          if ([string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID)) { throw 'HYPERV_STORAGE_RECONCILE_CI_CLONE_SOURCE_REQUIRED' }
          $arguments.CloneSourceRunId = [string]$env:SQL_SERVER_LAB_CI_CLONE_SOURCE_RUN_ID
          $arguments.MediaRoot = [string]$env:SQL_SERVER_LAB_CI_MEDIA_ROOT
          $arguments.MediaEdition = [string]$env:SQL_SERVER_LAB_CI_MEDIA_EDITION
          .\Tests\Integration\Invoke-HyperVStorageReconcileAcceptance.ps1 @arguments
      - name: Reject sample manifest acceptance outside manual main
        if: inputs.mode == 'sample-manifest-acceptance' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_SAMPLE_MANIFEST_CI_MANUAL_MAIN_REQUIRED'
      - name: Hyper-V sample manifest acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'sample-manifest-acceptance'
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{}
          if (-not [string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID)) {
            $arguments.ArtifactId = [string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID
          }
          .\Tests\Integration\Invoke-HyperVSampleManifestCiAcceptance.ps1 @arguments
      - name: Reject external runtime reconcile acceptance outside manual main
        if: inputs.mode == 'external-runtime-reconcile-acceptance' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          $ErrorActionPreference = 'Stop'
          throw 'HYPERV_EXTERNAL_RUNTIME_CI_MANUAL_MAIN_REQUIRED'
      - name: Hyper-V External Runtime reconcile acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'external-runtime-reconcile-acceptance'
        env:
          SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          SQL_SERVER_LAB_CI_MEDIA_ROOT: ${{ inputs.media_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{ MediaRoot = [string]$env:SQL_SERVER_LAB_CI_MEDIA_ROOT }
          if (-not [string]::IsNullOrWhiteSpace([string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID)) {
            $arguments.ArtifactId = [string]$env:SQL_SERVER_LAB_CI_IMAGE_ARTIFACT_ID
          }
          .\Tests\Integration\Invoke-HyperVExternalRuntimeReconcileCiAcceptance.ps1 @arguments
