name: Runtime Smoke - Mixed Providers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Private/**'
      - 'Providers/Docker/**'
      - 'Providers/Podman/**'
      - 'Public/**'
      - 'Schemas/**'
      - 'Tests/**'
      - 'SqlServerLab.psd1'
      - 'SqlServerLab.psm1'
      - '.github/workflows/runtime-smoke-mixed-providers.yml'

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-mixed-providers
  cancel-in-progress: false

jobs:
  mixed-provider-smoke:
    name: Docker and Podman in one lifecycle
    runs-on: [self-hosted, SQL_Lab, Docker, Podman]
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          docker info
          podman info
          sqlcmd -?

      - name: Static contracts
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Static\Invoke-DocumentationChecks.ps1
          .\Tests\Static\Invoke-ReadinessContractChecks.ps1
          .\Tests\Static\Invoke-MixedProviderLifecycleChecks.ps1

      - name: Mixed provider smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'mixed-provider-smoke.log'
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Runtime_Smoke' } else { 'SQL_Server_Lab_Runtime_Smoke' }
          $mutex = [System.Threading.Mutex]::new($false, $mutexName)
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(10))
            if (-not $acquired) { throw 'Runtime-Smoke-Hostlock konnte innerhalb von 10 Minuten nicht erworben werden.' }

            & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-MixedProviderSmokeTest.ps1 2>&1 | Tee-Object -FilePath $logPath
            $smokeExitCode = $LASTEXITCODE
            if ($smokeExitCode -ne 0) { throw "Mixed-Provider-Smoke-Test endete mit Exitcode $smokeExitCode." }
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }

      - name: Upload mixed provider smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-provider-smoke-log
          path: ${{ runner.temp }}/mixed-provider-smoke.log
          if-no-files-found: ignore
          retention-days: 7
