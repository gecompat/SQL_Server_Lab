name: Runtime Smoke - Docker

on:
  workflow_call:
    outputs:
      validation_classification:
        description: VALIDATED, VALIDATION_FAILURE, INFRASTRUCTURE_UNAVAILABLE oder UNKNOWN
        value: ${{ jobs.docker-smoke.outputs.validation_classification }}
    inputs:
      mode:
        description: Auszufuehrender Docker-Nachweis
        required: false
        default: lifecycle
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Auszufuehrender Docker-Nachweis
        required: true
        default: lifecycle
        type: choice
        options:
          - lifecycle
          - cli-acceptance

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-docker-${{ github.workflow }}-${{ github.ref }}
  # Forced cancellation can bypass the PowerShell finally cleanup on the
  # persistent self-hosted runner. Serialize newer runs instead.
  cancel-in-progress: false

jobs:
  docker-smoke:
    name: Docker provider runtime / CLI acceptance
    runs-on: [self-hosted, SQL_Lab, Docker]
    timeout-minutes: 45
    outputs:
      validation_classification: ${{ steps.runtime-preflight.outputs.validation_classification }}
    env:
      SQL_SERVER_LAB_RESOURCE_LIFECYCLE: test
      SQL_SERVER_LAB_TEST_OPERATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime preflight
        id: runtime-preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $classification = 'UNKNOWN'
          function Set-ValidationClassification([string]$Value) {
            $script:classification = $Value
            "validation_classification=$Value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          Set-ValidationClassification UNKNOWN
          try {
            $PSVersionTable.PSVersion
            docker info
            if ($LASTEXITCODE -ne 0) { throw 'Docker-Runtime ist nicht erreichbar.' }
            sqlcmd -?
            if ($LASTEXITCODE -ne 0) { throw 'sqlcmd ist nicht verwendbar.' }
            Set-ValidationClassification VALIDATED
          }
          catch {
            Set-ValidationClassification INFRASTRUCTURE_UNAVAILABLE
            $message = "INFRASTRUCTURE_UNAVAILABLE: Docker-/sqlcmd-Voraussetzung ist nicht erreichbar oder nicht verwendbar. $($_.Exception.Message)"
            "::error title=INFRASTRUCTURE_UNAVAILABLE::$message" | Write-Host
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Infrastruktur nicht verfügbar`n`n$message`n`nEs liegt kein Nachweis für einen Implementierungsfehler vor. Nach Wiederherstellung nur diesen Lauf erneut ausführen."
            throw $message
          }

      - name: Docker SQL Server lifecycle / CLI acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'docker-smoke-matrix.log'
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Runtime_Smoke' } else { 'SQL_Server_Lab_Runtime_Smoke' }
          $mutex = [System.Threading.Mutex]::new($false, $mutexName)
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(10))
            if (-not $acquired) { throw 'Runtime-Smoke-Hostlock konnte innerhalb von 10 Minuten nicht erworben werden.' }

            if ('${{ inputs.mode }}' -eq 'cli-acceptance') {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerCliAcceptance.ps1 `
                -Provider docker `
                -Version 2022-CU18 2>&1 | Tee-Object -FilePath $logPath
              if ($LASTEXITCODE -ne 0) { throw "Docker CLI Acceptance endete mit Exitcode $LASTEXITCODE." }
            }
            else {
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SmokeMatrix.ps1 `
                -Provider docker `
                -ReferenceVersion 2025 `
                -TestAutoStart 2>&1 | Tee-Object -FilePath $logPath
              $matrixExitCode = $LASTEXITCODE
              if ($matrixExitCode -ne 0) { throw "Docker Smoke Matrix endete mit Exitcode $matrixExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerCollationAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $collationExitCode = $LASTEXITCODE
              if ($collationExitCode -ne 0) { throw "Docker Collation-Akzeptanz endete mit Exitcode $collationExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-RestoreSmokeTest.ps1 `
                -Provider docker `
                -Version 2025 2>&1 | Tee-Object -FilePath $logPath -Append
              $restoreExitCode = $LASTEXITCODE
              if ($restoreExitCode -ne 0) { throw "Docker Restore Smoke Test endete mit Exitcode $restoreExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PointInTimeRecoveryAcceptance.ps1 `
                -Provider docker `
                -Version 2025 -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $pitrExitCode = $LASTEXITCODE
              if ($pitrExitCode -ne 0) { throw "Docker Point-in-Time-Recovery-Akzeptanz endete mit Exitcode $pitrExitCode." }


              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SqlVersionUpgradeAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $upgradeExitCode = $LASTEXITCODE
              if ($upgradeExitCode -ne 0) { throw "SQL version upgrade reference failed (exit $upgradeExitCode)." }
              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-BatchWorkflowSmokeTest.ps1 `
                -Provider docker `
                -Version 2025 2>&1 | Tee-Object -FilePath $logPath -Append
              $batchExitCode = $LASTEXITCODE
              if ($batchExitCode -ne 0) { throw "Docker Batch Workflow Smoke Test endete mit Exitcode $batchExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerToolAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld -EvidencePath (Join-Path $env:RUNNER_TEMP 'docker-container-tool-acceptance.json') 2>&1 | Tee-Object -FilePath $logPath -Append
              $toolExitCode = $LASTEXITCODE
              if ($toolExitCode -ne 0) { throw "Docker Container-Tool-Akzeptanz endete mit Exitcode $toolExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PersistentStorageRemovalExecutorAcceptance.ps1 `
                -Provider docker `
                -Policy DELETE_WITH_RUN `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $removalExitCode = $LASTEXITCODE
              if ($removalExitCode -ne 0) { throw "Docker Persistent-Storage-Removal-Akzeptanz endete mit Exitcode $removalExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-ContainerDatabasePackageExportAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $packageExportExitCode = $LASTEXITCODE
              if ($packageExportExitCode -ne 0) { throw "Docker Database-Package-Export-Akzeptanz endete mit Exitcode $packageExportExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PortableContainerTransferPreflightAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $preflightExitCode = $LASTEXITCODE
              if ($preflightExitCode -ne 0) { throw "Docker Portable-Container-Transfer-Preflight-Akzeptanz endete mit Exitcode $preflightExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-PortableContainerTransferAcceptance.ps1 `
                -Provider docker `
                -RuntimeMutexAlreadyHeld 2>&1 | Tee-Object -FilePath $logPath -Append
              $transferExitCode = $LASTEXITCODE
              if ($transferExitCode -ne 0) { throw "Docker Portable-Container-Transfer-Akzeptanz endete mit Exitcode $transferExitCode." }

              & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-AiVectorCoreAcceptance.ps1 `
                -Provider docker 2>&1 | Tee-Object -FilePath $logPath -Append
              $aiVectorExitCode = $LASTEXITCODE
              if ($aiVectorExitCode -ne 0) { throw "Docker AI-Vector-Core-Akzeptanz endete mit Exitcode $aiVectorExitCode." }
            }
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }

      - name: Upload Docker smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-matrix-log
          path: ${{ runner.temp }}/docker-smoke-matrix.log
          if-no-files-found: ignore
          retention-days: 7
