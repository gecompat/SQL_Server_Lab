name: Runtime Smoke - Docker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Catalogs/**'
      - 'Private/**'
      - '!Private/ZZ_TempDbRestartProvisioning.ps1'
      - '!Private/ZZZ_TempDbProviderInference.ps1'
      - 'Providers/Docker/**'
      - 'Public/**'
      - 'Tests/**'
      - '!Tests/Integration/Invoke-Sql2025FortyGbDemo.ps1'
      - 'SqlServerLab.psd1'
      - 'SqlServerLab.psm1'
      - '.github/workflows/runtime-smoke-docker.yml'

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-docker-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Docker provider, versions and parallel runs
    runs-on: [self-hosted, SQL_Lab, Docker]
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          docker info
          sqlcmd -?

      - name: Static contracts
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Static\Invoke-DocumentationChecks.ps1
          .\Tests\Static\Invoke-ReadinessContractChecks.ps1

      - name: Docker smoke matrix
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'docker-smoke-matrix.log'
          $mutexName = if ($IsWindows) { 'Global\SQL_Server_Lab_Docker_Host' } else { 'SQL_Server_Lab_Docker_Host' }
          $mutex = [System.Threading.Mutex]::new($false, $mutexName)
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(45))
            if (-not $acquired) { throw 'Docker-Hostlock konnte innerhalb von 45 Minuten nicht erworben werden.' }

            & pwsh -NoLogo -NoProfile -File .\Tests\Integration\Invoke-SmokeMatrix.ps1 `
              -Provider docker `
              -FullMatrix `
              -IncludeParallel 2>&1 | Tee-Object -FilePath $logPath
            $matrixExitCode = $LASTEXITCODE
            if ($matrixExitCode -ne 0) { throw "Docker Smoke Matrix endete mit Exitcode $matrixExitCode." }
          }
          finally {
            if ($acquired) { $mutex.ReleaseMutex() }
            $mutex.Dispose()
          }

      - name: Upload Docker smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-matrix-log
          path: ${{ runner.temp }}/docker-smoke-matrix.log
          if-no-files-found: ignore
          retention-days: 7
