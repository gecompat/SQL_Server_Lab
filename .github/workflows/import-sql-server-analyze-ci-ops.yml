name: Import SQL_Server_Analyze ci-ops snapshot

on:
  push:
    branches:
      - agent/import-sql-server-analyze-ci-ops
    paths:
      - .github/workflows/import-sql-server-analyze-ci-ops.yml

permissions:
  contents: write

concurrency:
  group: import-sql-server-analyze-ci-ops
  cancel-in-progress: false

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-sql-server-analyze-ci-ops
          fetch-depth: 0

      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          repository: gecompat/SQL_Server_Analyze
          ref: e16f08c3d4ce03da6c3ac704d8df4806ac77804d
          path: .source-ci-ops
          fetch-depth: 1
          persist-credentials: false

      - name: Copy and validate snapshot
        shell: bash
        run: |
          set -euo pipefail

          destination="_QuellRepo/SQL_Server_Analyze/ci-ops"
          rm -rf "$destination"
          mkdir -p "$destination"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/' \
            .source-ci-ops/ "$destination/"

          if find "$destination" -name .git -print -quit | grep -q .; then
            echo "A .git entry was copied into the destination." >&2
            exit 1
          fi

          differences="$(rsync -acn --delete \
            --exclude='.git' \
            --exclude='.git/' \
            .source-ci-ops/ "$destination/")"

          if [[ -n "$differences" ]]; then
            echo "Source and destination differ after copying:" >&2
            printf '%s\n' "$differences" >&2
            exit 1
          fi

          source_files="$(find .source-ci-ops -type f ! -path '*/.git/*' ! -name .git | wc -l | tr -d ' ')"
          target_files="$(find "$destination" -type f | wc -l | tr -d ' ')"

          if [[ "$source_files" != "$target_files" ]]; then
            echo "File-count mismatch: source=$source_files target=$target_files" >&2
            exit 1
          fi

          source_commit="$(git -C .source-ci-ops rev-parse HEAD)"
          echo "Validated source commit: $source_commit"
          echo "Validated file count: $source_files"

          rm -rf .source-ci-ops

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _QuellRepo/SQL_Server_Analyze/ci-ops

          if git diff --cached --quiet; then
            echo "Snapshot already matches the requested source branch."
            exit 0
          fi

          git commit -m "Import SQL_Server_Analyze ci-ops snapshot"
          git push origin HEAD:agent/import-sql-server-analyze-ci-ops
