name: Temporary branch audit and cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit-cleanup:
    if: github.head_ref == 'automation/branch-audit-cleanup-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report remaining branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/temporary_branch_audit.py
