name: Temporary branch audit and cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit-cleanup:
    if: github.head_ref == 'automation/branch-audit-cleanup-20260728'
    runs-on: ubuntu-latest
    steps:
      - name: Report remaining branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCRIPT_URL: https://raw.githubusercontent.com/gecompat/SQL_Server_Lab/automation/branch-audit-cleanup-20260728/.github/scripts/temporary_branch_audit.py
        shell: bash
        run: curl --fail --silent --show-error "$SCRIPT_URL" | python -
