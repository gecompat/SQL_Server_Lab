name: PR3 Runtime Diagnosis

on:
  push:
    branches:
      - agent/documentation-consistency-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr3-runtime-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-minimal:
    name: Docker minimal provisioning
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./SqlServerLab.psd1 | Out-Null
          Import-Module ./SqlServerLab.psd1 -Force
          Get-Command New-SqlServerLab, Remove-SqlServerLab, Test-LabResources | Select-Object Name, CommandType

      - name: Verify Docker availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker info | Out-Null
          Test-LabResources -Provider docker | Select-Object Status, Details

      - name: Run Docker smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Tests/Integration/Invoke-SmokeTest.ps1 -Provider docker -Version '2022'
