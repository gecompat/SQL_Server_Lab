name: Runtime Smoke - Fresh Hyper-V SQL Acceptance

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      media_root:
        description: Media Root mit der hashverifizierten SQL-ISO
        required: true
        default: D:\Lab_Base
        type: string
      image_artifact_id:
        description: Registrierte immutable Windows-OS-Baseline
        required: true
        default: hyperv-os-sealed-2d175924c8e647969a82e36f931b22397108bd94a030e0e947b7e66e47e0be9a
        type: string
      sql_version:
        description: SQL Server Hauptversion
        required: true
        default: '2025'
        type: choice
        options:
          - '2025'
      media_edition:
        description: SQL-Medienedition
        required: true
        default: Eval
        type: choice
        options:
          - Eval
          - Enterprise
          - Standard

permissions:
  contents: read

concurrency:
  group: sql-server-lab-runtime-smoke-hyperv-sql-fresh-acceptance
  cancel-in-progress: false

jobs:
  fresh-hyperv-sql-acceptance:
    name: Fresh real Windows SQL acceptance and host reachability
    runs-on: [self-hosted, SQL_Lab, Hyper-V]
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Elevated Hyper-V preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'RUNNER_NOT_ELEVATED' }
          Get-VMHost -ErrorAction Stop
          Get-Command Mount-VHD, New-VMSwitch, sqlcmd -ErrorAction Stop

      - name: Create fresh SQL builder from verified media
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\SqlServerLab.psd1 -Force
          $module = Get-Module SqlServerLab
          $build = & $module {
            param($MediaRoot,$ArtifactId,$SqlVersion,$MediaEdition)
            Initialize-HyperVSqlPreparedImageBuild -MediaRoot $MediaRoot -ImageArtifactId $ArtifactId -SqlVersion $SqlVersion -MediaEdition $MediaEdition
          } '${{ inputs.media_root || 'D:\Lab_Base' }}' '${{ inputs.image_artifact_id || 'hyperv-os-sealed-2d175924c8e647969a82e36f931b22397108bd94a030e0e947b7e66e47e0be9a' }}' '${{ inputs.sql_version || '2025' }}' '${{ inputs.media_edition || 'Eval' }}'
          "HYPERV_SQL_BUILD_ID=$($build.buildId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Created fresh Hyper-V SQL build: $($build.buildId)"

      - name: Complete OOBE, SQL acceptance and host reachability
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Integration\Invoke-HyperVSqlAcceptanceRun.ps1 -BuildId $env:HYPERV_SQL_BUILD_ID
