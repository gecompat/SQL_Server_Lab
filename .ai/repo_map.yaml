schema_version: 1
project:
  name: SQL_Server_Lab
  purpose: "Lokale, isolierte und reproduzierbare SQL-Server-Testumgebungen"
  default_branch: main
  module_manifest: SqlServerLab.psd1
  module_loader: SqlServerLab.psm1
  runtime_status: CONTAINER_CORE_IMPLEMENTED_HYPERV_SPECIALIZATION_READINESS_ORCHESTRATION

sources_of_truth:
  exported_commands: SqlServerLab.psd1
  module_loading: SqlServerLab.psm1
  manifest_structure: Schemas/lab-manifest.schema.json
  manifest_resolution: Private/ManifestParser.ps1
  manifest_builder_validation: Private/ManifestBuilder.ps1
  sql_versions: Catalogs/sql-server-versions.json
  sample_databases: Catalogs/sample-databases.json
  state_contract: Private/StateMachine.ps1
  cleanup_contract: Private/CleanupEngine.ps1
  port_allocation_contract: Private/PortAllocation.ps1
  runtime_limitations: Documentation/Quality/KNOWN_LIMITATIONS.md
  sample_artifact_and_manifest_wizard_target: Documentation/Architecture/SAMPLE_DATABASE_PROVISIONING_AND_MANIFEST_WIZARD.md
  mixed_provider_lifecycle: Documentation/Architecture/MIXED_PROVIDER_LIFECYCLE.md
  hyperv_image_provisioning_network_target: Documentation/Architecture/HYPERV_IMAGE_PROVISIONING_AND_NETWORK_CONTRACT.md
  user_entrypoint: README.md
  user_installation_windows: Documentation/User/INSTALLATION_WINDOWS.md
  user_installation_linux: Documentation/User/INSTALLATION_LINUX.md
  user_walkthrough: Documentation/User/Getting_Started.md
  development_test_setup_windows: Documentation/Development/DEVELOPMENT_AND_TEST_SETUP_WINDOWS.md
  development_test_setup_linux: Documentation/Development/DEVELOPMENT_AND_TEST_SETUP_LINUX.md
  external_media_root: Documentation/HowTo/MEDIA_ROOT_LAYOUT.md
  hyperv_windows_image_build: Documentation/HowTo/HYPERV_WINDOWS_IMAGE_BUILD.md
  workflow_ui: Documentation/HowTo/WORKFLOW_UI.md
  remote_hyperv_host_backlog: Documentation/Project_Planning/HYPERV_REMOTE_HOST_BACKLOG.md
  validation_documentation: Tests/Static/Invoke-DocumentationChecks.ps1
  validation_runtime_contracts: Tests/Static/Invoke-ReadinessContractChecks.ps1
  validation_manifest_builder: Tests/Static/Invoke-ManifestBuilderChecks.ps1
  validation_runtime_matrix: Tests/Integration/Invoke-SmokeMatrix.ps1
  latest_validation_result: Documentation/Quality/VALIDATION_RESULT_2026-08-08.md

public_commands:
  - name: Invoke-SqlServerLab
    source: Public/Invoke-SqlServerLab.ps1
    purpose: "Interaktives Menü"
    mutates_host: true
  - name: Get-SqlServerLabWorkflow
    source: Public/Get-SqlServerLabWorkflow.ps1
    purpose: "Konsolidierte, geheimnisfreie Workflow- und Imageübersicht"
    mutates_host: false
  - name: Invoke-SqlServerLabWorkflowAction
    source: Public/Invoke-SqlServerLabWorkflowAction.ps1
    purpose: "Nicht interaktive UI-Aktion für einen zulässigen Hyper-V-Workflow-Schritt"
    mutates_host: true
  - name: New-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Schema-gesteuertes Manifest interaktiv oder aus einem Objekt erstellen"
    mutates_host: true
    writes_files: true
  - name: Test-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Manifest gegen Schema, Kataloge und Runtime-Grenzen prüfen"
    mutates_host: false
  - name: New-SqlServerLab
    source: Public/New-SqlServerLab.ps1
    purpose: "Lab ad hoc oder per Manifest erstellen"
    mutates_host: true
    returns:
      - RunId
      - ScopeId
      - State
      - Name
      - Instances
      - StateRoot
  - name: Get-SqlServerLab
    source: Public/Get-SqlServerLab.ps1
    purpose: "State und Live-Status je ProviderSubRun lesen"
    mutates_host: false
  - name: Start-SqlServerLab
    source: Public/Start-SqlServerLab.ps1
    purpose: "Gestoppten Run über alle gespeicherten ProviderSubRuns starten"
    mutates_host: true
  - name: Stop-SqlServerLab
    source: Public/Stop-SqlServerLab.ps1
    purpose: "Laufenden Run über alle gespeicherten ProviderSubRuns stoppen"
    mutates_host: true
  - name: Restart-SqlServerLab
    source: Public/Restart-SqlServerLab.ps1
    purpose: "Stop und Start kombinieren"
    mutates_host: true
  - name: Remove-SqlServerLab
    source: Public/Remove-SqlServerLab.ps1
    purpose: "Einzelnen Run scope-validiert entfernen"
    mutates_host: true
  - name: Clear-SqlServerLab
    source: Public/Clear-SqlServerLab.ps1
    purpose: "Lab-Container und/oder State bereinigen"
    mutates_host: true
  - name: New-SqlServerLabDatabase
    source: Public/New-SqlServerLabDatabase.ps1
    purpose: "Datenbank mit konfigurierbaren Dateien und Containerpfaden erstellen"
    mutates_sql: true
  - name: Restore-SqlServerLabDatabase
    source: Public/Restore-SqlServerLabDatabase.ps1
    purpose: "Direkte .bak-Datei aus lokalem Pfad oder URL wiederherstellen; URL-Acquisition mit Trust, SHA-256, Cache und Run Lock; Ziel bevorzugt per RunId aufloesen"
    mutates_sql: true
    external_dependencies:
      - sqlcmd
  - name: Invoke-SqlServerLabScript
    source: Public/Invoke-SqlServerLabScript.ps1
    purpose: "T-SQL-Skript ausführen"
    mutates_sql: true
  - name: Test-SqlServerLabPrerequisite
    source: Private/ResourceAssessment.ps1
    purpose: "Provider, RAM, Storage und Ports ohne Mutation prüfen"
    mutates_host: false
  - name: Test-SqlServerLabAdapter
    source: Public/Test-SqlServerLabAdapter.ps1
    purpose: "Project Adapter gegen Schema, Pfadgrenzen und optional einen Run pruefen"
    mutates_host: false
  - name: Install-SqlServerLabAdapter
    source: Public/Install-SqlServerLabAdapter.ps1
    purpose: "Validierten Adapter-Entrypoint ohne Lifecycle-Seiteneffekt auf eine Instanz anwenden"
    mutates_sql: true
    external_dependencies:
      - sqlcmd

internal_components:
  - name: ManifestBuilder
    source: Private/ManifestBuilder.ps1
    responsibilities:
      - "alle Manifestfelder dynamisch aus dem JSON-Schema erfassen"
      - "x-ui-Pfadsemantik, Scope und aufgeloeste Hostvorschau im Wizard anzeigen"
      - "Schema-, Katalog- und Runtime-Grenzen vor dem Speichern prüfen"
      - "Warnungen für vorbereitete oder riskante Konfigurationen erzeugen"
  - name: ManifestParser
    source: Private/ManifestParser.ps1
    responsibilities:
      - "Manifest lesen und Pflichtfelder prüfen"
      - "Defaults anwenden"
      - "relative Pfade auflösen"
      - "Sample-Referenzen in den typisierten Artifact-Vertrag auflösen"
      - "nur ausführbare Backup-Varianten in Restoredefinitionen umwandeln"
  - name: VersionCatalog
    source: Private/VersionCatalog.ps1
    responsibilities:
      - "Basisversionen und CU-Builds auflösen"
      - "Container-Images bestimmen"
      - "Ressourcenprofile liefern"
      - "Sample-Katalog lesen"
  - name: ResourceAssessment
    source: Private/ResourceAssessment.ps1
    responsibilities:
      - "Runtime-Verfügbarkeit für alle verwendeten Provider prüfen"
      - "RAM, Storage und Ports bewerten"
  - name: StateMachine
    source: Private/StateMachine.ps1
    responsibilities:
      - "State-Root bestimmen"
      - "Run-State und ProviderSubRuns persistieren"
      - "State-Transitions und Fehlerhistorie verwalten"
  - name: ArtifactResolver
    source: Private/ArtifactResolver.ps1
    responsibilities:
      - "HTTP(S)-Backup-Acquisition in einen lokalen Staging-Bereich"
      - "einmaligen Trust mit versionierten lokalen SHA-256-Records verwalten"
      - "inhaltsadressierten Cache und Quarantaene bei Hash-Mismatch verwalten"
      - "sanitisiertes manifest.lock.json vor dem Restore schreiben"
  - name: SampleArtifactHandlers
    source: Private/SampleArtifactHandlers.ps1
    responsibilities:
      - "executable Backup-Varianten des Sample-Katalogs auflisten und filtern"
      - "Trust- und Cache-Status je Variante read-only melden"
      - "Backup-Samples ueber Resolver, Idempotenzregel und Restore installieren"
      - "erwartete Datenbank als ONLINE verifizieren und DATASET_READY melden"
  - name: ProjectAdapter
    source: Private/ProjectAdapter.ps1
    responsibilities:
      - "adapter.json gegen Schemas/project-adapter.schema.json validieren"
      - "Pfadgrenzen des Adapter-Roots und Reparse Points erzwingen"
      - "unbekannte Major-Vertrags- und Core-Versionen ablehnen"
      - "Versions- und Capability-Gates gegen eine Run-Instanz pruefen"
  - name: CleanupEngine
    source: Private/CleanupEngine.ps1
    responsibilities:
      - "Cleanup-Plan und providergebundene Cleanup-SubRuns vor Mutation erzeugen"
      - "Compensation-Schritte je Provider speichern und ausführen"
  - name: PortAllocation
    source: Private/PortAllocation.ps1
    responsibilities:
      - "belegte SQL-Hostports aus TCP-Listenern, Docker und Podman ermitteln"
      - "Portsuche und Runtime-Bindung mit hostweitem, prozessübergreifendem Mutex serialisieren"
      - "atomare Parallelprovisionierung unterstützen"
  - name: SqlReadiness
    source: Private/SqlReadiness.ps1
    responsibilities:
      - "SQL-Erreichbarkeit und Major-Version prüfen"
      - "Benutzerdatenbank-Readiness nach Start oder Restart pollen"
      - "Podman-Windows-Localhostfehler früh diagnostizieren"
  - name: ServerConfig
    source: Private/ServerConfig.ps1
    responsibilities:
      - "Memory, TempDB, MaxDOP und sp_configure anwenden"
      - "Datenbankoptionen anwenden"
      - "External Languages vorbereiten"
  - name: SecretProvider
    source: Private/SecretProvider.ps1
    responsibilities:
      - "SA-Passwort im lokalen Run-Verzeichnis speichern und lesen"

providers:
  docker:
    status: implemented
    implementation: Providers/Docker/DockerProvider.ps1
    metadata: Providers/Docker/provider.json
    command: docker
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
  podman:
    status: implemented
    implementation: Providers/Podman/PodmanProvider.ps1
    metadata: Providers/Podman/provider.json
    command: podman
    windows_networking: Documentation/HowTo/PODMAN_WINDOWS_NETWORKING.md
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
  hyperv:
    status: partial_manifest_clone_specialization_readiness_orchestration
    implementation: Providers/HyperV/HyperVProvider.ps1
    image_registry: Private/HyperVImageRegistry.ps1
    image_builder: Private/HyperVImageBuilder.ps1
    metadata: Providers/HyperV/provider.json
    documentation: Providers/HyperV/README.md
    command: Get-VMHost
    sql_provisioning: "partial_prepared_image_clone_only; realer allgemeiner SQL-End-to-End-Nachweis offen"
    native_smoke: Tests/Integration/Invoke-HyperVSmokeTest.ps1
    registry_static_checks: Tests/Static/Invoke-HyperVImageRegistryChecks.ps1
    builder_static_checks: Tests/Static/Invoke-HyperVImageBuilderChecks.ps1
    template_pool: "Maximal 20 immutable OS_SEALED-/SQL_PREPARED_SEALED-Images; aktive Builder und Lab-Klone blockieren Parent-Löschung"

catalogs:
  sql_versions:
    data: Catalogs/sql-server-versions.json
    schema: Schemas/version-catalog.schema.json
  sample_databases:
    data: Catalogs/sample-databases.json
    schema: Schemas/sample-databases.schema.json
    artifact_contract: "Artifact Type, Installation, erwartete Outputs, Groessen- und Integrity-/Trust-Metadaten sind maschinenlesbar"
    executable_variants: "Direkte .bak-Backups, ZIP-/7z-Archive mit exakt einer katalogisierten .bak-Payload sowie gepinnte Einzelskripte mit runtimeStatus executable; Integritaet ueber Katalog-SHA-256 oder Trust-Pfad interactive-once"

project_adapters:
  schema: Schemas/project-adapter.schema.json
  contract_version: "0.1-draft"
  example: Adapters/Examples/synthetic-demo/adapter.json
  runtime: "Nur relative T-SQL-Entrypoints innerhalb des Adapter-Roots; ApplyAdapter ohne Lifecycle-Seiteneffekt"
  reserved_fields:
    - sqlPackageCatalogs
    - defaultPackageRefs
  prioritization: Documentation/Project_Planning/PROJECT_ADAPTER_PRIORITIZATION.md

planning_contracts:
  sample_artifact_and_manifest_wizard:
    source: Documentation/Architecture/SAMPLE_DATABASE_PROVISIONING_AND_MANIFEST_WIZARD.md
    status: BINDING_IMPLEMENTATION_TARGET
    runtime_status: PARTIALLY_IMPLEMENTED_FOUNDATION
    covers:
      - typed_artifact_contract
      - contextual_manifest_path_guidance
      - multiple_sample_selection
      - artifact_handlers
      - persistent_trust_store
      - manifest_lock
      - content_addressed_cache
      - sql_script_and_bundle_installation
      - contextual_path_guidance
      - lab_generated_baselines
      - hyperv_baseline_bindings
  hyperv_image_provisioning_network:
    source: Documentation/Architecture/HYPERV_IMAGE_PROVISIONING_AND_NETWORK_CONTRACT.md
    status: BINDING_IMPLEMENTATION_TARGET
    runtime_status: PARTIALLY_IMPLEMENTED_WINDOWS_SPECIALIZATION_SQL_READINESS
    covers:
      - sealed_os_and_sql_images
      - media_license_and_evaluation_lifecycle
      - best_available_artifact_resolution
      - hyperv_vm_and_drive_lifecycle
      - provider_neutral_network_intents
      - exposure_policy
      - provider_neutral_software_and_external_runtimes
      - manual_action_and_resume
      - environment_reconcile
      - artifact_refresh_and_rebuild
  mixed_provider_lifecycle:
    source: Documentation/Architecture/MIXED_PROVIDER_LIFECYCLE.md
    status: IMPLEMENTED_CONTAINER_SCOPE
    providers:
      - docker
      - podman
    covers:
      - provider_subrun_state
      - provider_bound_status_start_stop_cleanup
      - startup_rollback
      - mixed_provider_smoke_test
    excludes:
      - hyperv
      - cross_provider_networking
      - reconcile

state_files:
  root_resolution:
    windows: '%LOCALAPPDATA%\SqlServerLab'
    linux_macos: "~/.sql-server-lab"
    override_environment_variable: SQL_SERVER_LAB_STATE
  per_run:
    - run-state.json
    - cleanup-plan.json
    - connection-info.json
    - manifest.lock.json
    - secrets/
  cache:
    - trust/sample-artifacts.json
    - cache/artifacts/sha256/<sha256>/
    - cache/quarantine/
  repository_policy: "State, Secrets, Connection Information und konkrete Hostpfade nie versionieren"

provisioning_flow:
  - "Read-LabManifest oder Ad-hoc-Normalisierung"
  - "Test-SqlServerVersionSupported"
  - "Test-SqlServerLabPrerequisite"
  - "New-LabRunState"
  - "ProviderSubRuns anlegen"
  - "New-CleanupPlan"
  - "Invoke-LabPortAllocationLock"
  - "Find-LabAvailablePort"
  - "Provider-Container erstellen und Port runtimeautoritativ binden"
  - "Wait-SqlReady"
  - "Set-LabServerConfig"
  - "New-SqlServerLabDatabase für Create-Datenbanken"
  - "Install-LabSampleDatabase für Sample-Datenbanken (Trust, Cache, Restore, Verification)"
  - "Restore-SqlServerLabDatabase für direkte Restore-Datenbanken"
  - "Set-LabDatabaseOptions"
  - "Invoke-LabSqlScript für postProvision"
  - "connection-info.json schreiben"
  - "State RUNNING"

validation:
  static_manifest_builder:
    command: '.\Tests\Static\Invoke-ManifestBuilderChecks.ps1'
    source: Tests/Static/Invoke-ManifestBuilderChecks.ps1
    covers:
      - schema_validation
      - semantic_validation
      - atomic_manifest_write
  static_documentation:
    command: '.\Tests\Static\Invoke-DocumentationChecks.ps1'
    source: Tests/Static/Invoke-DocumentationChecks.ps1
  static_runtime_contracts:
    command: '.\Tests\Static\Invoke-ReadinessContractChecks.ps1'
    source: Tests/Static/Invoke-ReadinessContractChecks.ps1
    covers:
      - readiness
      - interactive_menu
      - atomic_port_allocation
  static_mixed_provider_contracts:
    command: '.\Tests\Static\Invoke-MixedProviderLifecycleChecks.ps1'
    source: Tests/Static/Invoke-MixedProviderLifecycleChecks.ps1
    covers:
      - provider_subrun_state
      - mixed_provider_example
      - grouped_lifecycle_and_cleanup
  static_artifact_resolver:
    command: '.\Tests\Static\Invoke-ArtifactResolverChecks.ps1'
    source: Tests/Static/Invoke-ArtifactResolverChecks.ps1
    covers:
      - trust_store
      - content_addressed_cache
      - manifest_lock
      - trust_required_non_interactive
  static_cleanup_recovery:
    command: '.\Tests\Static\Invoke-CleanupRecoveryChecks.ps1'
    source: Tests/Static/Invoke-CleanupRecoveryChecks.ps1
    covers:
      - provider_remove_failure
      - recovery_required_state
      - persisted_failure_cause
      - successful_cleanup_retry
      - deferred_secret_removal
  static_podman_bootstrap:
    command: '.\Tests\Static\Invoke-PodmanBootstrapChecks.ps1'
    source: Tests/Static/Invoke-PodmanBootstrapChecks.ps1
    covers:
      - already_ready
      - stopped_default_machine
      - unique_custom_machine
      - no_machine
      - ambiguous_machines
      - start_failure
      - readiness_timeout
      - concurrent_start_lock
  static_sample_handler:
    command: '.\Tests\Static\Invoke-SampleHandlerChecks.ps1'
    source: Tests/Static/Invoke-SampleHandlerChecks.ps1
    covers:
      - executable_variant_listing
      - sample_restore_resolution
      - idempotency_and_trust_contract
      - trust_required_non_interactive
  static_project_adapter:
    command: '.\Tests\Static\Invoke-ProjectAdapterChecks.ps1'
    source: Tests/Static/Invoke-ProjectAdapterChecks.ps1
    covers:
      - adapter_schema_validation
      - contract_and_core_version_gate
      - adapter_root_path_boundary
      - capability_and_sql_version_gate
  single_provider_smoke:
    source: Tests/Integration/Invoke-SmokeTest.ps1
    docker: '.\Tests\Integration\Invoke-SmokeTest.ps1 -Provider docker'
    podman: '.\Tests\Integration\Invoke-SmokeTest.ps1 -Provider podman'
  runtime_matrix:
    source: Tests/Integration/Invoke-SmokeMatrix.ps1
    command: '.\Tests\Integration\Invoke-SmokeMatrix.ps1 -Provider all -FullMatrix -IncludeParallel'
    versions:
      - "2019"
      - "2022"
      - "2025"
    checks:
      - full_lifecycle_per_provider
      - major_version_matrix
      - parallel_unique_run_and_scope_ids
      - parallel_unique_ports
      - isolated_cleanup
  mixed_provider_smoke:
    source: Tests/Integration/Invoke-MixedProviderSmokeTest.ps1
    command: '.\Tests\Integration\Invoke-MixedProviderSmokeTest.ps1'
    checks:
      - docker_and_podman_in_one_run
      - provider_subrun_status
      - grouped_stop_start
      - grouped_cleanup
  restore_smoke:
    source: Tests/Integration/Invoke-RestoreSmokeTest.ps1
    docker: '.\Tests\Integration\Invoke-RestoreSmokeTest.ps1 -Provider docker'
    podman: '.\Tests\Integration\Invoke-RestoreSmokeTest.ps1 -Provider podman'
    checks:
      - synthetic_backup_fixture
      - local_sha256_guard
      - run_based_provider_resolution
      - restore_filelistonly_and_move
      - restored_database_online_and_content
      - full_cleanup
  remote_workflows:
    static_contracts:
      source: .github/workflows/static-contracts.yml
      runners:
        - windows-latest
        - ubuntu-latest
      required_pull_request_checks: true
    adapter_github_hosted:
      source: .github/workflows/adapter-smoke-github-hosted.yml
      runner: ubuntu-latest
    docker_github_hosted:
      source: .github/workflows/runtime-smoke-docker-github-hosted.yml
      runner: ubuntu-latest
    docker:
      source: .github/workflows/runtime-smoke-docker.yml
      labels:
        - self-hosted
        - SQL_Lab
        - Docker
    podman:
      source: .github/workflows/runtime-smoke-podman.yml
      labels:
        - self-hosted
        - SQL_Lab
        - Podman
    mixed_providers:
      source: .github/workflows/runtime-smoke-mixed-providers.yml
      labels:
        - self-hosted
        - SQL_Lab
        - Docker
        - Podman
    triggers:
      - workflow_dispatch
      - pull_request
    static_push_trigger: true
    runtime_push_trigger: false
  last_confirmed_result:
    date: "2026-08-08"
    source: Documentation/Quality/VALIDATION_RESULT_2026-08-08.md
    docker: "PASS – Auto-Smoke 33/33 und Provider-Matrix"
    podman: "PASS – erreichbarer Provider in der Provider-Matrix"
    hyperv: "PASS – nativer VM-/VHDX-/Image-Builder-Lifecycle; kein SQL-End-to-End-Nachweis"

change_coupling:
  public_command_change:
    - SqlServerLab.psd1
    - Public/README.md
    - README.md
    - Documentation/User/Getting_Started.md
    - .ai/repo_map.yaml
    - Tests/Static/Invoke-DocumentationChecks.ps1
  manifest_field_change:
    - Schemas/lab-manifest.schema.json
    - Private/ManifestParser.ps1
    - "zuständige Runtimefunktion"
    - Schemas/README.md
    - Documentation/Quality/KNOWN_LIMITATIONS.md
    - "mindestens ein example-*.json"
    - Tests/Static/Invoke-DocumentationChecks.ps1
  provider_change:
    - Private/PortAllocation.ps1
    - Providers/<Provider>/<Provider>Provider.ps1
    - Providers/<Provider>/provider.json
    - Providers/<Provider>/README.md
    - README.md
    - Documentation/Quality/KNOWN_LIMITATIONS.md
    - Tests/Static/Invoke-ReadinessContractChecks.ps1
    - Tests/Integration/Invoke-SmokeTest.ps1
    - Tests/Integration/Invoke-SmokeMatrix.ps1
    - .github/workflows/runtime-smoke-<provider>.yml
  catalog_change:
    - "Catalogs/*.json"
    - "zugehöriges Schema"
    - Catalogs/README.md
    - Private/VersionCatalog.ps1
    - Tests/Static/Invoke-DocumentationChecks.ps1
    - Tests/Integration/Invoke-SmokeMatrix.ps1

known_limitations:
  binding_document: Documentation/Quality/KNOWN_LIMITATIONS.md
  highlights:
    - "Hyper-V sealed VHDX Registry, Builder-/Resume-Grundlage und enger Manifest-Klonpfad implementiert; vollautomatische OS-Factory, breites Manifest-Binding und echter Windows-/SQL-End-to-End-Nachweis bleiben offen"
    - "Container-Manifeste laufen standardmäßig unattended mit externen Secret-Referenzen, SHA-256-/Trust-Schutz und read-only Host-Mount-Default"
    - "providerneutrale Network Intents, Exposure Policy und Reconcile nicht implementiert"
    - "Artifact Refresh und Rebuild für Medien, VHDX und Derived Images nicht implementiert"
    - "kein provideruebergreifendes Docker-/Podman-Netzwerk oder Hyper-V-SubRun"
    - "Sample-Backup-Handler mit Trust-Pfad, Mehrfachauswahl, ZIP-/7z-Backup-Payloads und gepinnten Einzelskripten sind implementiert; Script Bundles, mehrteilige/nicht freigegebene Archive und Attach-Handler bleiben offen"
    - "LAB_GENERATED-Baselines und beste kompatible Aufsetzpunkte noch nicht implementiert"
    - "mehrere reservierte serverConfig-Felder noch ohne stabilen Runtimepfad"
    - "Versionskatalog wird nicht automatisch als aktuell garantiert"

continuation_rules:
  - "Planungsdokumente nie als Runtime-Nachweis behandeln"
  - "Testdatenbank-, Trust-, Wizard- und Baseline-Entscheidungen am verbindlichen Zielvertrag ausrichten"
  - "Hyper-V-, Image-, Netzwerk-, Software-, Reconcile- und Refresh-Entscheidungen am verbindlichen Hyper-V-Zielvertrag ausrichten"
  - "Keine neuen Exportnamen ohne implementierte Funktion und Test"
  - "Keine Manifestfelder nur im Schema ergänzen"
  - "Keine realen State-, Secret-, Host- oder Kundendaten committen"
  - "Vor einer Mutation einen Cleanup-Pfad beibehalten"
  - "Docker und Podman getrennt testen"
  - "Portwahl bei Parallelität immer über Private/PortAllocation.ps1 führen"
  - "Runtime-Smoke-Workflows nur mit SQL_Lab plus exaktem Capability-Label ausführen"
