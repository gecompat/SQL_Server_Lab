    - SqlServerLab.psd1
    - Public/README.md
    - Public/Invoke-SqlServerLabReconcileAction.ps1
    - Private/ExternalRuntimeReconcile.ps1
    - README.md
    - Documentation/README.md
    - Documentation/User/Getting_Started.md
    - .ai/repo_map.yaml
    - Tests/Static/Invoke-ReconcileActionContractChecks.ps1
    - Tests/Static/Invoke-ExternalRuntimeReconcileChecks.ps1
    - Tests/Static/Invoke-DocumentationChecks.ps1
    - en-US/about_SqlServerLab.help.txt
    - de-DE/about_SqlServerLab.help.txt
  manifest_field_change:
    - Schemas/lab-manifest.schema.json
    - Private/ManifestParser.ps1
    - "zuständige Runtimefunktion"
    - Schemas/README.md
    - Documentation/Quality/KNOWN_LIMITATIONS.md
    - "mindestens ein example-*.json"
