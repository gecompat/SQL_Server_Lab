foundation_integration:
  source_repository: gecompat/AI_Repository_Foundation
  source_commit: 7ddc29988b23570f462e46ebf527f8dfdd05fd75
  ruleset_version: "1.8.0"
  foundation_integrity_index: .ai/foundation/repo_map.yaml
  feature_catalog: .ai/foundation/feature_catalog.json
  selected_adapters:
    - github-copilot
  adapter_rule_rehome:
    github-copilot: ops/sql-cu-policy.md
  semantic_classification:
    equivalent:
      - truthful_status_and_validation_evidence
      - local_impact_based_validation
      - small_coherent_branch_and_pr_changes
    project_stronger:
      - synthetic_and_allowlisted_repository_data
      - additional_approval_and_cleanup_requirements
      - provider_specific_runtime_evidence
    project_selectable_override:
      - custom_target_license
      - german_project_documentation
      - ai_commit_prefix
    complementary:
      - detailed_model_and_cost_routing
      - sql_server_domain_and_provider_contracts
      - extended_validation_statuses
  model_routing_mapping: .ai/MODEL_ROUTING_POLICY.md
  validation_scope_mapping: Documentation/Quality/LOCAL_VALIDATION_STRATEGY.md
  identity_registration_mapping: .ai/IDENTITY_AND_ARTIFACT_REGISTRATION.md
  identity_adoption_mode: PRESERVE
  registration_authorities:
    hyperv_images: Import-HyperVImageArtifact
    sample_baselines: Register-LabSampleBaseline
    runs_and_scopes: New-LabRunState
    final_human_reference_scope: not_currently_allocated_authority_required_before_use
  selected_capabilities:
    - rule-context-cache
  upgrade_assessment:
    current_record: .ai/foundation-upgrade-assessments/1.7.0-to-1.8.0.json
    records:
      - .ai/foundation-upgrade-assessments/1.4.0-to-1.7.0.json
      - .ai/foundation-upgrade-assessments/1.7.0-to-1.8.0.json
    assessed_on: "2026-09-02"
    open_recommendations: []
    resolved_recommendations:
      rule-context-cache:
        decision: IMPLEMENTED
        decided_on: "2026-09-02"
        authority: .ai/foundation-upgrade-assessments/1.7.0-to-1.8.0.json
      repository-continuity-break-glass:
        decision: IMPLEMENTED
        decided_on: "2026-08-27"
        authority: Documentation/Quality/REPOSITORY_CONTINUITY_RUNBOOK.md
  repository_continuity:
    status: IMPLEMENTED
    target: refs/heads/main
    core_safety_ruleset:
      name: Core safety - main
      enforcement: active
      bypass_actors: []
      requires_pull_request: true
      blocks_deletion: true
      blocks_force_push: true
    ci_gates_ruleset:
      name: CI gates - main
      enforcement: active
      required_status_check: PR Gate
      strict_required_status_checks: true
      bypass_actor: repository_owner
      bypass_mode: pull_request
    decision_rule:
      allowed: INFRASTRUCTURE_UNAVAILABLE
      prohibited:
        - VALIDATION_FAILURE
        - UNKNOWN
    deferred_validation_required: true
  unresolved_conflicts: []

public_commands:
  - name: New-SqlServerLabBatch
    source: Public/BatchWorkflow.ps1
    purpose: "Providerneutralen Einzel- oder Mengenbatch validieren, expandieren und persistent einreihen"
    mutates_host: true
  - name: Get-SqlServerLabQueue
    source: Public/BatchWorkflow.ps1
    purpose: "Persistente Queue, Worker, Locks, Blockierungen und User-Gates lesen"
    mutates_host: false
  - name: Confirm-SqlServerLabOperationUserAction
    source: Public/BatchWorkflow.ps1
    purpose: "Ausdruecklich bestaetigte User-Gates einzeln technisch verifizieren und fortsetzen"
    mutates_host: true
  - name: Invoke-SqlServerLabScheduler
    source: Public/BatchWorkflow.ps1
    purpose: "Queue mit Ressourcenklassen, Locks und Resume verarbeiten"
    mutates_host: true
  - name: Invoke-SqlServerLab
    source: Public/Invoke-SqlServerLab.ps1
    purpose: "Interaktives Menü"
    mutates_host: true
  - name: Get-SqlServerLabWorkflow
    source: Public/Get-SqlServerLabWorkflow.ps1
    purpose: "Konsolidierte, geheimnisfreie Workflow- und Imageübersicht einschließlich read-only Evaluation-/Refreshstatus"
    mutates_host: false
  - name: Get-SqlServerLabHyperVResourcePreview
    source: Public/Get-SqlServerLabHyperVResourcePreview.ps1
    purpose: "Registrierte Hyper-V-Location, Kapazitaet und physische Klassenroots vor UAC read-only aufloesen"
    mutates_host: false
  - name: New-SqlServerLabWindowsSlotPool
    source: Public/New-SqlServerLabWindowsSlotPool.ps1
    purpose: "N resumierbare Windows-Hyper-V-Slots aus einer geeigneten OS_SEALED-Baseline mit Ressourcen-/Locale-Vertrag und unbeaufsichtigter OOBE erzeugen"
    mutates_host: true
  - name: Get-SqlServerLabGeneratedWindowsAccess
    source: Public/Get-SqlServerLabGeneratedWindowsAccess.ps1
    purpose: "Automatisch generierten, run-lokal DPAPI-geschuetzten Windows-Administratorzugang gezielt abrufen"
    mutates_host: false
  - name: Get-SqlServerLabCatalog
    source: Public/Get-SqlServerLabCatalog.ps1
    purpose: "Laufzeitworkflow-Katalog als persistentes, maschinenlesbares JSON-Artefakt erstellen"
    mutates_host: true
    writes_files: true
  - name: Get-SqlServerLabReconcilePlan
    source: Public/Get-SqlServerLabReconcilePlan.ps1
    purpose: "Read-only Lifecycle-, Hyper-V-Netzwerk-/vCPU-/RAM-, Containerressourcen-/Autostart- oder resolvergebundener External-Runtime-Reconcile-Plan"
    mutates_host: false
  - name: Invoke-SqlServerLabReconcileAction
    source: Public/Invoke-SqlServerLabReconcileAction.ps1
    purpose: "START/STOP, Hyper-V-Netzwerk-/vCPU-/RAM-Reparatur, Containerressourcen/Autostart oder additiven Container-Runtime-Refresh journal- und validierungsgebunden ausfuehren"
    mutates_host: true
  - name: Invoke-SqlServerLabWorkflowAction
    source: Public/Invoke-SqlServerLabWorkflowAction.ps1
    purpose: "Nicht interaktive UI-Aktion für einen zulässigen Hyper-V-Workflow-Schritt, einen pfad-/secretfreien Run-/Instanz-/Datenbank-gebundenen Container-Paketexport oder eine strikt read-only gebundene Container-Migrationsinventur"
    mutates_host: true
  - name: New-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Schema-gesteuertes Manifest interaktiv oder aus einem Objekt erstellen"
    mutates_host: true
    writes_files: true
  - name: Test-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Manifest gegen Schema, Kataloge und Runtime-Grenzen prüfen"
    mutates_host: false
  - name: New-SqlServerLab
    source: Public/New-SqlServerLab.ps1
    purpose: "Lab ad hoc oder per Manifest erstellen"
    mutates_host: true
    returns:
      - RunId
      - ScopeId
      - State
      - Name
      - Instances
      - StateRoot
  - name: Get-SqlServerLab
    source: Public/Get-SqlServerLab.ps1
    purpose: "State und Live-Status je ProviderSubRun lesen"
    mutates_host: false
  - name: Sync-SqlServerLabRuntimeState
    source: Public/Sync-SqlServerLabRuntimeState.ps1
    purpose: "Gespeicherten Run-State mit Docker, Podman und Hyper-V abgleichen und fehlende gebundene Runtimeobjekte fail-closed als RECOVERY_REQUIRED markieren"
    mutates_host: true
  - name: Get-SqlServerLabMaintenancePlan
    source: Public/Maintenance.ps1
    purpose: "State und alle vorhandenen Docker-, Podman- und Hyper-V-Ressourcen read-only auf Drift, Orphans und Testartefakte vergleichen"
    mutates_host: false
  - name: Invoke-SqlServerLabMaintenance
    source: Public/Maintenance.ps1
    purpose: "Revalidierte sichere, scopegebundene und ausdruecklich freigegebene Maintenance-Aktionen ausfuehren"
    mutates_host: true
  - name: Start-SqlServerLab
    source: Public/Start-SqlServerLab.ps1
    purpose: "Gestoppten Run über alle gespeicherten ProviderSubRuns starten"
    mutates_host: true
  - name: Stop-SqlServerLab
    source: Public/Stop-SqlServerLab.ps1
    purpose: "Laufenden Run über alle gespeicherten ProviderSubRuns stoppen"
    mutates_host: true
  - name: Restart-SqlServerLab
    source: Public/Restart-SqlServerLab.ps1
    purpose: "Stop und Start kombinieren"
    mutates_host: true
  - name: Remove-SqlServerLab
    source: Public/Remove-SqlServerLab.ps1
