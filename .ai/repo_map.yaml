internal_components:
  - name: ManifestBuilder
    source: Private/ManifestBuilder.ps1
    responsibilities:
      - "alle Manifestfelder dynamisch aus dem JSON-Schema erfassen"
      - "x-ui-Pfadsemantik, Scope und aufgeloeste Hostvorschau im Wizard anzeigen"
      - "Hilfe, schrittweise Zuruecknavigation, Zwischenzusammenfassung und Abbruch ohne partielle Manifestdatei anbieten"
      - "nur resolverfreigegebene External-Runtime-Varianten im Instanzkontext anbieten"
      - "mutationsfreie Software-Planvorschau mit Downloads, Build/Gastmutation, Downtime, Locks, Verification und Aenderungsklassen liefern"
      - "mutationsfreie Sample-/Artifact-Planvorschau mit Quelle, Lizenz, Outputs, Groessen, Integritaet, Trust, Handler und Idempotenz liefern"
      - "Schema-, Katalog- und Runtime-Grenzen vor dem Speichern prüfen"
      - "reservierte Runtimefelder und -werte schemaabgeleitet fail-closed ablehnen"
      - "Warnungen für riskante, aber ausführbare Konfigurationen erzeugen"
  - name: ManifestParser
    source: Private/ManifestParser.ps1
    responsibilities:
      - "Manifest lesen und Pflichtfelder prüfen"
      - "Defaults anwenden"
      - "relative Pfade auflösen"
      - "Sample-Referenzen in den typisierten Artifact-Vertrag auflösen"
      - "nur ausführbare Backup-Varianten in Restoredefinitionen umwandeln"
  - name: LabNetwork
    source: Private/LabNetwork.ps1
    responsibilities:
      - "providerneutrale Network- und Exposure-Intents mutationsfrei aufloesen"
      - "Container-NAT sowie Hyper-V-HostOnly und -Isolation an portable Bindings und Capabilities koppeln"
      - "Exposure-Konflikte, Legacy-Switch-Konflikte und nicht implementierte Providerkombinationen vor Mutation fail-closed ablehnen"
    validation: Tests/Static/Invoke-LabNetworkChecks.ps1
  - name: VersionCatalog
    source: Private/VersionCatalog.ps1
    responsibilities:
      - "Basisversionen und CU-Builds auflösen"
      - "Container-Images bestimmen"
      - "Windows-CU-Pakete quell-, pfad-, SHA-256- und Microsoft-Authenticode-gebunden in den Media Root laden"
      - "exakte Linux-CU-MCR-Tags in den gebundenen Docker-/Podman-Cache laden"
      - "Ressourcenprofile liefern"
      - "Sample-Katalog lesen"
  - name: SoftwareCatalog
    source: Private/SoftwareCatalog.ps1
    responsibilities:
      - "Python-, R- und Java-Anforderungen in providerneutrale Software-Intents normalisieren"
      - "SQL-Version, Betriebssystem, Architektur, Provider und Runtimevariante deterministisch aufloesen"
      - "unbelegte Varianten, freie Commands und nicht gesperrte Pakete vor Provider-Mutationen ablehnen"
      - "sanitisierte Softwareplaene, portable PlanKey-Identitaet und Installation-Receipt-Vertraege bereitstellen"
      - "Aenderungswege als rebuild, restart, recreate, reprovision oder no-op klassifizieren"
  - name: ExternalRuntimeContainerImage
    source: Private/ContainerImageArtifact.ps1
    recipe: Images/ExternalLanguages/Linux/recipe.json
    responsibilities:
      - "providerneutralen Python-, R-, Java- oder kombinierten Image-Key aus Basisdigest, Varianten, Locks und Kontext-SHA-256 bilden"
      - "R 4.2.3 und RevoScaleR aus einem digestgebundenen Buildstage ohne Compiler im Zielimage bereitstellen"
      - "Java 11, Language Extension 1.1.1, SDK und synthetisches Probe-JAR aus SHA-256-gebundenen Quellen reproduzierbar und compilerfrei bereitstellen"
      - "Docker- und Podman-Buildreceipts getrennt und ohne Hostpfade persistieren"
      - "Derived-Image-Plaene, Buildreceipts und wiederverwendete Image-Artefakte an die exakten Software-PlanKeys binden"
      - "rootful-cgroup-v1-, Capability-, Security-Option- und Namespace-Sicherheitsvertrag vor Container-Mutation erzwingen"
      - "SQL-Satellite-OpenSSL-Aufloesung und Java-Sandbox-Datenverzeichnisse reproduzierbar im Image binden"
      - "wiederverwendbare Images außerhalb des normalen Run-Cleanups halten"
  - name: ExternalRuntimeWindows
    source: Private/ExternalRuntimeWindows.ps1
    recipe: Images/ExternalLanguages/Windows/recipe.json
    guest_installer: Images/ExternalLanguages/Windows/Install-ExternalRuntimes.ps1
    responsibilities:
      - "SHA-256-gebundene Python-/R-/Java-Offlinemedien in einen inhaltsadressierten Media-Root aufloesen"
      - "einen hostpfad- und quellfreien Gastinstallationsplan erzeugen und ueber PowerShell Direct ausfuehren"
      - "INSTALLING-, RECOVERY_REQUIRED- und EXTENSIONS_READY_RUN-State vor und nach Gastmutationen persistieren"
      - "SQL-External-Scripts aktivieren und echte Python-/R-/Java-Postconditions im Windows-Gast pruefen"
      - "Java-SDK aus dem gesperrten Extension-Archiv extrahieren, das synthetische Probe-JAR reproduzierbar erzeugen und beide per Content-Hash binden"
  - name: ExternalRuntimeLifecycle
    source: Private/ExternalRuntimeLifecycle.ps1
    responsibilities:
      - "external scripts enabled aktivieren oder beim letzten Runtime-Removal verifiziert deaktivieren und den gebundenen Container kontrolliert neu starten"
      - "launchpadd-Readiness und echte Python-/R-/Java-sp_execute_external_script-Postconditions prüfen"
      - "Java-Sprache und -Libraries pro Zieldatenbank idempotent registrieren, Drift ablehnen und fehlgeschlagene Neuanlagen kompensieren"
      - "sanitisierte Runtime-Installation-Receipts im Run persistieren"
  - name: ResourceAssessment
    source: Private/ResourceAssessment.ps1
    responsibilities:
      - "Runtime-Verfügbarkeit für alle verwendeten Provider prüfen"
      - "RAM, Storage und Ports bewerten"
  - name: StateMachine
    source: Private/StateMachine.ps1
    responsibilities:
      - "State-Root bestimmen"
      - "Run-State und ProviderSubRuns persistieren"
      - "State-Transitions und Fehlerhistorie verwalten"
  - name: ArtifactResolver
    source: Private/ArtifactResolver.ps1
    responsibilities:
      - "HTTP(S)-Backup-Acquisition in einen lokalen Staging-Bereich"
      - "einmaligen Trust mit versionierten lokalen SHA-256-Records verwalten"
      - "inhaltsadressierten Cache und Quarantaene bei Hash-Mismatch verwalten"
      - "sanitisiertes manifest.lock.json vor dem Restore schreiben"
  - name: DatabaseMigrationDependency
    source: Private/DatabaseMigrationDependency.ps1
    responsibilities:
      - "SQL-seitig beobachtbare Login-, Agent-Job-, Proxy-, Linked-Server- und TDE-Abhaengigkeiten read-only als Kategorien und Counts inventarisieren"
      - "Serverkonfiguration, SSISDB und SSAS als nicht aus dem Datenbankartefakt beweisbare externe Review-Grenzen ausweisen"
      - "Datenbankdateien und Backups nie als vollstaendige Instanzmigration oder als TDE-Key-/Secret-Export darstellen"
      - "sanitisierte Migration-Boundaries in neue Backup- und Datenbankpaket-Receipts einbetten"
      - "persistierte Migrationskategorien und Warnungen pfad- und geheimnisfrei ueber die Datenbankpaket-Auswahl an CLI und Browser projizieren"
      - "Live-Inventur direkt oder ueber stabile Run-/Instanzbindung als oeffentliches read-only Cmdlet bereitstellen"
      - "aus jedem validierten Inventar einen versionierten, geheimnisfreien und strikt nicht ausfuehrbaren Migrations-Review-Plan mit TDE-Blockern ableiten"
  - name: SampleArtifactHandlers
    source: Private/SampleArtifactHandlers.ps1
    responsibilities:
      - "executable Backup-, Einzel-Skript- und Script-Bundle-Varianten des Sample-Katalogs auflisten und filtern"
      - "Trust- und Cache-Status je Variante read-only melden"
      - "Samples ueber Resolver, Idempotenzregel und typisierten Handler installieren"
      - "Script Bundles sicher extrahieren, erlaubte sqlcmd-Features root-gebunden expandieren und mehrere Outputs verifizieren"
      - "erwartete Datenbanken als ONLINE verifizieren und DATASET_READY oder RECOVERY_REQUIRED melden"
  - name: SampleBaselineRegistry
    source: Private/SampleBaselineRegistry.ps1
    responsibilities:
      - "deterministische Baseline Keys aus Sample-, Quellen-, Handler-, SQL- und Verification-Invarianten bilden"
      - "verifizierte LAB_GENERATED-Backups inhaltsadressiert und portabel registrieren"
      - "exakte und kompatible Baselines deterministisch auswaehlen"
      - "fehlende, pfadfremde oder hashabweichende Baselines quarantainisieren"
  - name: SampleBaselineRuntime
    source: Private/SampleBaselineRuntime.ps1
    responsibilities:
      - "Single- und Multi-Output-Container-Samples sowie run-gebundene Hyper-V-Samples nach erfolgreicher SQL-Verifikation mit CHECKSUM sichern"
      - "erzeugte Backups vor Registrierung mit RESTORE VERIFYONLY pruefen"
      - "exakte oder kompatible LAB_GENERATED-Baselines vor dem Originalartefakt bevorzugen"
      - "bei fehlender oder ungueltiger Baseline sicher auf das verifizierte Originalartefakt zurueckfallen"
      - "Hyper-V-Backups nur ueber verifizierte Storage-Receipts in der gebundenen Backup-Lane erzeugen, per PowerShell Direct exportieren und im Gast bereinigen"
      - "run-gebundene Ad-hoc-Sample-CREATEs und -Restores ohne datenbankspezifische Bindung auf exakt verifizierte Default-Data-/Default-Log-Lanes begrenzen"
  - name: ProjectAdapter
    source: Private/ProjectAdapter.ps1
    responsibilities:
      - "adapter.json gegen Schemas/project-adapter.schema.json validieren"
      - "Pfadgrenzen des Adapter-Roots und Reparse Points erzwingen"
      - "unbekannte Major-Vertrags- und Core-Versionen ablehnen"
      - "Versions- und Capability-Gates gegen eine Run-Instanz pruefen"
  - name: DesiredState
    source: Private/DesiredState.ps1
    responsibilities:
      - "geheimnisfreien Sollzustand vor jeder Provider-Mutation erzeugen"
      - "Hyper-V-Manifest-Drives als run-lokale VHDX- und Guest-Initialisierungs-Intents binden"
      - "Drive-, Network- und Software-Anforderungen providerneutral normalisieren"
      - "deklarative Provider-Capability-Evidenz ohne Runtime-Annahme persistieren"
  - name: CleanupEngine
    source: Private/CleanupEngine.ps1
    audit: Public/Get-SqlServerLabCleanupAudit.ps1
    audit_findings: Private/CleanupAuditFindings.ps1
    storage_residency: Private/StorageResidencyInventory.ps1
    persistent_storage_catalog: Private/PersistentStorageCatalog.ps1
    persistent_storage_artifact_sync: Public/Sync-SqlServerLabPersistentStorageArtifact.ps1
    persistent_storage_removal_plan: Private/PersistentStorageRemovalPlan.ps1
    persistent_storage_removal_preview: Public/Get-SqlServerLabPersistentStorageRemovalPlan.ps1
    persistent_storage_removal_executor: Private/PersistentStorageRemovalExecutor.ps1
    persistent_storage_removal_action: Public/Invoke-SqlServerLabPersistentStorageRemoval.ps1
    container_runtime_scope: Private/ContainerRuntimeScope.ps1
    maintenance_core: Private/Maintenance.ps1
    maintenance_commands: Public/Maintenance.ps1
    maintenance_schema: Schemas/lab-maintenance-plan.schema.json
    maintenance_script: Tools/Invoke-SqlServerLabMaintenance.ps1
    hyperv_persistent_data_drive: Private/HyperVPersistentDataDrive.ps1
    responsibilities:
      - "Cleanup-Plan und providergebundene Cleanup-SubRuns vor Mutation erzeugen"
      - "Compensation-Schritte je Provider speichern und ausführen"
      - "Run-lokale Ressourcen an Software-PlanKeys binden und wiederverwendbare Softwareartefakte ausdrücklich behalten"
      - "Hyper-V-Cleanup vor der ersten Mutation gegen Run-Binding, registrierte Zusatzlaufwerksroots und terminales Migrationsjournal revalidieren"
      - "Hyper-V-Run-Schutzbereiche, Shared-Roots und ungetrackte Preserve-Dateien read-only auditieren"
      - "Lab_Data, native Runtime-Volumes und -Images, normalisierte Runtime-Speichernutzung, providerseitiges Host-Backing, externe Pfade, Hyper-V-Ressourcen und Retention als versionierte read-only Storage-Residency klassifizieren"
      - "bewusst retained Objekte, unerwartete Residuen, Recovery-Befunde und unverifizierbare Evidence mit stabilen Identitaeten, Reason-Codes und nicht mutierenden Handlungshinweisen getrennt ausgeben"
      - "stabile Persistent-Storage-IDs, Klassen, Zustände, Referenzen und exklusive Leases read-only validieren und mit dem Residency-Inventar abgleichen"
      - "Katalogmutationen mit read-only Preview, erwarteter Revision, unveraenderlicher Controller-/Vertragsgrenze, genau einem Revisionsschritt und rollbackfaehigem Spiegelcommit ausfuehren"
      - "verifizierte Backup-Sets und Datenbankpakete ueber denselben CAS-geschuetzten Artifact-Writer controllerweit rollbackfaehig mit eigener PersistentStorageId registrieren und Katalogfehler fail-closed quarantaenisieren; neue Receipts binden den nicht ausführbaren Migrationsplan an die automatisch berechnete Backup- beziehungsweise Paket-SHA-256"
      - "vorhandene Backup-Sets, Datenbankpakete und sichere Exchange-Workspaces oeffentlich einzeln revalidieren, previewfaehig und idempotent mit dem controllergebundenen Katalog synchronisieren"
      - "Datenbankpakete fuer CLI und Browser pfadfrei per stabiler DatabasePackageId inventarisieren; Voll-Hashing nur bei expliziter Integritaetspruefung oder unmittelbar vor Verwendung ausfuehren; den strikt nicht ausführbaren Migrationsplan nur als Manifest-SHA-gebundene Status-/Schrittzahl-/Blocker-Projektion ausgeben"
      - "laufende Docker-/Podman-Datenbanken im Browser nur ueber stabile Run-/Instanzbindung und validierten Datenbanknamen an denselben exklusiven Offline- und SHA-256-verifizierten Paketexport-Core binden; Host, Port, Pfad und Secrets nicht als UI-Vertrag transportieren"
      - "laufende Docker-/Podman-Datenbanken im Browser ausschliesslich per stabiler Run-/Instanzbindung, validiertem Datenbanknamen und fluechtigem SA-Passwort read-only auf Migrationsabhaengigkeiten inventarisieren; nur sanitisierte Kategorien, Counts, Grenzen und Review-Schritte im Live-Log ausgeben"
      - "Datenbankpakete per stabiler Run-/Instanzbindung an das live ermittelte SQL-Default-Data-Verzeichnis eines scopegebundenen Hyper-V-Gasts kopieren, dort vollstaendig hashen und erst nach vorab persistiertem Recovery-Journal attachen"
      - "Retention, Backup-/Package-on-Remove, externe Bindungsfreigabe und Recovery-Postconditions read-only planen; persistente Storage-Löschung getrennt halten"
      - "RETAIN_INSTANCE_STORE, BACKUP_ON_REMOVE, MDF/NDF/LDF-PACKAGE_ON_REMOVE und BACKUP_AND_PACKAGE für Docker-/Podman-Instanzstores frisch revalidiert, artefaktverifiziert und journalisiert ausführen; EXTERNAL_UNMANAGED löst ausschließlich revisionsgeschützt die eigene Katalogbindung und bestätigt die unveränderte Quelle; DELETE_WITH_RUN ist ausschließlich für nachgewiesene RUN_SCOPED/RUN_CLEANUP-Containerstores zweiphasig ausführbar, FILESTREAM, TDE und jede andere endgültige Löschung bleiben vor Mutation blockiert"
      - "CLI und Browser-UI über denselben frisch inventarisierten Retention-Plan-Core ausschließlich per stabiler Storage-ID vorausschauen und die unterstützten Policies bestätigt ausführen lassen"
      - "katalogisierte Docker-/Podman-Instanzstores in CLI und Browser per stabiler ID und Runtime-Label detached revalidieren, fuer Continue an den neuen Run leasen oder unter exklusiver Operations-Lease digestverifiziert klonen; verifizierte Datenbanken stabil referenzieren sowie Zielcommit und Quellfreigabe atomar koppeln"
      - "reguläre Hyper-V-Daten-VHDX vor ihrer Erzeugung controllerweit als INCOMPLETE mit stabiler Storage-ID und exklusiver Run-Lease reservieren, nach DiskIdentifier- und VM-Attachment-Postcondition auf IN_USE committen und Abbrüche als RECOVERY_REQUIRED fortsetzbar halten"
      - "aktiven Docker-Context beziehungsweise Podman-Connection/Machine read-only an eine stabile sanitisierte Runtime-ID binden und geteilte Engine-/Machine-/Hostdefaults als REPORT_ONLY vor Mutation schuetzen"
      - "sanitisierte Docker-/Podman-Runtime-Scopes im oeffentlichen Cleanup-Audit ueber zentral aufgeloeste Host-Tool-Aufrufe ausgeben, ohne Rohendpunkte, Identity-Pfade oder Managementautoritaet zu persistieren"
      - "katalogisierte Hyper-V-Daten-VHDX per stabiler Storage-ID, Clean-Detach-, DiskIdentifier-, VM-, Checkpoint-, SQL-Versions- und Gastpfad-Evidenz revalidieren, Clone und Reattach vor Hostmutation operationsgebunden leasen sowie Clone-Zielregistrierung mit Quellfreigabe, Reattach und Release nach physischer Postcondition atomar, idempotent und recoveryfaehig committen"
      - "Hyper-V-Daten-VHDX in CLI und Browser pfadfrei freigeben, reattachen und klonen; Release prueft alle SQL-Dateibindungen im Gast vor sauberem Shutdown, Detach-Receipts bleiben an Storage-ID, DiskIdentifier und guenstige Dateimetadaten gebunden, Clone-Evidence wird vor dem Katalogcommit persistiert"
  - name: PortAllocation
    source: Private/PortAllocation.ps1
    responsibilities:
      - "belegte SQL-Hostports aus TCP-Listenern, Docker und Podman ermitteln"
      - "Portsuche und Runtime-Bindung mit hostweitem, prozessübergreifendem Mutex serialisieren"
      - "atomare Parallelprovisionierung unterstützen"
  - name: HostToolResolution
    source: Private/HostToolResolution.ps1
    responsibilities:
      - "Docker, Podman und Python ueber sichere explizite Overrides, Sessionbefehle, persistierte PATH-Eintraege und bekannte Windows-Installationsorte deterministisch aufloesen"
      - "ausschliesslich den aktuellen Prozess-PATH idempotent erweitern und Benutzer-/Maschinen-PATH niemals persistierend veraendern"
      - "alle produktiven Docker-/Podman-Aufrufpfade ueber den zentral aufgeloesten absoluten Runtime-Aufruf vom geerbten Shell-PATH entkoppeln"
      - "eigenstaendig gestartete Docker-/Podman-Acceptances vor dem ersten Runtime-Probe zentral initialisieren und ueber den absoluten Invocation-Pfad ausfuehren"
      - "installierte Executables von nicht auffindbaren Tools trennen, ohne Runtime-Erreichbarkeit oder Ausfuehrungsberechtigung vorwegzunehmen"
  - name: ContainerAutoStart
    source: Private/ContainerAutoStart.ps1
    responsibilities:
      - "providergebundene Windows-Logon-Auftraege und native Linux-Hoststarts fuer markierte Lab-Container einrichten"
      - "parallele Docker-Desktop-/Podman-Desktop-Installationen erkennen und Docker vor der Podman Machine bereitstellen"
      - "den bekannten Podman-Desktop-Login-Eintrag receiptgebunden unterdruecken und beim letzten Podman-Autostart-Cleanup wiederherstellen"
  - name: SqlReadiness
    source: Private/SqlReadiness.ps1
    responsibilities:
      - "SQL-Erreichbarkeit und Major-Version prüfen"
      - "Benutzerdatenbank-Readiness nach Start oder Restart pollen"
      - "Podman-Windows-Localhostfehler früh diagnostizieren"
  - name: ServerConfig
    source: Private/ServerConfig.ps1
    responsibilities:
      - "Memory, TempDB, MaxDOP und sp_configure anwenden"
      - "Datenbankoptionen anwenden"
      - "External Languages nur nach RESOLVED-Softwareplan aktivieren"
  - name: SecretProvider
    source: Private/SecretProvider.ps1
    responsibilities:
      - "SA-Passwort im lokalen Run-Verzeichnis speichern und lesen"

providers:
  docker:
    status: implemented
    implementation: Providers/Docker/DockerProvider.ps1
    metadata: Providers/Docker/provider.json
    command: docker
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
    memory_binding: "cgroup-Limit plus MSSQL_MEMORY_LIMIT_MB mit 20 Prozent Headroom"
  podman:
    status: implemented
    implementation: Providers/Podman/PodmanProvider.ps1
    metadata: Providers/Podman/provider.json
    command: podman
    windows_networking: Documentation/HowTo/PODMAN_WINDOWS_NETWORKING.md
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
    memory_binding: "cgroup-Limit plus MSSQL_MEMORY_LIMIT_MB mit 20 Prozent Headroom"
  hyperv:
    status: windows_2025_sql_2025_prepared_build_and_manifest_clone_to_sql_ready_run_real_validated
    implementation: Providers/HyperV/HyperVProvider.ps1
    resource_binding: Private/HyperVResourceBinding.ps1
    resource_location_preview: "Public/Get-SqlServerLabHyperVResourcePreview.ps1 plus UI-User-Gate und explizit revalidierter UAC-Handoff"
    resource_migration: Private/HyperVResourceMigration.ps1
    resource_reconcile: "Private/HyperVResourceReconcile.ps1; manifestgebundener vCPU-/RAM-Istvergleich, Live-Min-/Max sowie journalisiertes Stop-Apply-Start mit Recovery-Resume"
    storage_reconcile: "Private/HyperVStorageReconcile.ps1 plus Private/HyperVSqlStorageReconcile.ps1; manifestgebundene zusaetzliche SCSI-VHDX, Grow-only-Resize, Gast-NTFS-Erweiterung sowie receiptgebundener SQL-Default-/TempDB-Reconcile mit Recovery-Resume"
    sql_configuration_reconcile: "Private/HyperVSqlConfigurationReconcile.ps1; persistierter oder eng begrenzt manifestaktualisierter serverConfig-Intent, read-only sys.configurations-/Trace-Flag-/Startup-Istvergleich sowie journalisierte Live- oder MSSQLSERVER-Dienstrestart-Reparatur mit VM-gebundenem Trace-Flag-Ownership, eigentumsgeschuetzter Runtime-Entfernung, Desired-State-Commit und Recovery-Resume"
    sql_port_reconcile: "Private/HyperVSqlPortReconcile.ps1; persistierter hyperv.sqlPort-Intent, hostwertfreier Registry-/Firewall-Istvergleich und journalisierte Reparatur mit ausschliesslichem SQL-Dienstrestart sowie Recovery-Resume"
    test_database_reconcile: "Private/HyperVTestDatabaseReconcile.ps1; katalogisierte Add-/Remove-Aktionen mit VM-gebundenem Ownership, verifiziertem Removal-Backup, Fremddatenbankschutz und Vorwaerts-Recovery"
