schema_version: 1
project:
  name: SQL_Server_Lab
  purpose: "Lokale, isolierte und reproduzierbare SQL-Server-Testumgebungen"
  default_branch: main
  consumers:
    SQL_PerformanceSchulung:
      purpose: example_construction
      default_environment: linux_current
      exceptions: windows_or_catalog_version_by_scenario
    SQL_Server_Analyze:
      purpose: development_and_acceptance
      environment_matrix: windows_linux_sql_2019_2022_2025
    SQL_Server_Toolbelt:
      purpose: development_and_acceptance
      environment_matrix: windows_linux_sql_2019_2022_2025
  module_manifest: SqlServerLab.psd1
  module_loader: SqlServerLab.psm1
  runtime_status: CONTAINER_CORE_IMPLEMENTED_HYPERV_SQL_CLI_ACCEPTED

