schema_version: 1
project:
  name: SQL_Server_Lab
  purpose: "Lokale, isolierte und reproduzierbare SQL-Server-Testumgebungen"
  default_branch: main
  module_manifest: SqlServerLab.psd1
  module_loader: SqlServerLab.psm1
  runtime_status: CONTAINER_CORE_IMPLEMENTED

sources_of_truth:
  exported_commands: SqlServerLab.psd1
  module_loading: SqlServerLab.psm1
  manifest_structure: Schemas/lab-manifest.schema.json
  manifest_resolution: Private/ManifestParser.ps1
  manifest_builder_validation: Private/ManifestBuilder.ps1
  sql_versions: Catalogs/sql-server-versions.json
  sample_databases: Catalogs/sample-databases.json
  state_contract: Private/StateMachine.ps1
  cleanup_contract: Private/CleanupEngine.ps1
  port_allocation_contract: Private/PortAllocation.ps1
  runtime_limitations: Documentation/Quality/KNOWN_LIMITATIONS.md
  user_entrypoint: README.md
  user_walkthrough: Documentation/User/Getting_Started.md
  validation_documentation: Tests/Static/Invoke-DocumentationChecks.ps1
  validation_runtime_contracts: Tests/Static/Invoke-ReadinessContractChecks.ps1
  validation_manifest_builder: Tests/Static/Invoke-ManifestBuilderChecks.ps1
  validation_runtime_matrix: Tests/Integration/Invoke-SmokeMatrix.ps1
  latest_validation_result: Documentation/Quality/VALIDATION_RESULT_2026-07-27.md

public_commands:
  - name: Invoke-SqlServerLab
    source: Public/Invoke-SqlServerLab.ps1
    purpose: "Interaktives Menü"
    mutates_host: true
  - name: New-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Schema-gesteuertes Manifest interaktiv oder aus einem Objekt erstellen"
    mutates_host: true
    writes_files: true
  - name: Test-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Manifest gegen Schema, Kataloge und Runtime-Grenzen prüfen"
    mutates_host: false
  - name: New-SqlServerLab
    source: Public/New-SqlServerLab.ps1
    purpose: "Lab ad hoc oder per Manifest erstellen"
    mutates_host: true
    returns:
      - RunId
      - ScopeId
      - State
      - Name
      - Instances
      - StateRoot
  - name: Get-SqlServerLab
    source: Public/Get-SqlServerLab.ps1
    purpose: "State und Live-Status lesen"
    mutates_host: false
  - name: Start-SqlServerLab
    source: Public/Start-SqlServerLab.ps1
    purpose: "Gestoppten Run über den gespeicherten Provider starten"
    mutates_host: true
  - name: Stop-SqlServerLab
    source: Public/Stop-SqlServerLab.ps1
    purpose: "Laufenden Run über den gespeicherten Provider stoppen"
    mutates_host: true
  - name: Restart-SqlServerLab
    source: Public/Restart-SqlServerLab.ps1
    purpose: "Stop und Start kombinieren"
    mutates_host: true
  - name: Remove-SqlServerLab
    source: Public/Remove-SqlServerLab.ps1
    purpose: "Einzelnen Run scope-validiert entfernen"
    mutates_host: true
  - name: Clear-SqlServerLab
    source: Public/Clear-SqlServerLab.ps1
    purpose: "Lab-Container und/oder State bereinigen"
    mutates_host: true
  - name: New-SqlServerLabDatabase
    source: Public/New-SqlServerLabDatabase.ps1
    purpose: "Datenbank mit konfigurierbaren Dateien und Containerpfaden erstellen"
    mutates_sql: true
  - name: Restore-SqlServerLabDatabase
    source: Public/Restore-SqlServerLabDatabase.ps1
    purpose: "Direkte .bak-Datei aus lokalem Pfad oder URL wiederherstellen"
    mutates_sql: true
    external_dependencies:
      - sqlcmd
  - name: Invoke-SqlServerLabScript
    source: Public/Invoke-SqlServerLabScript.ps1
    purpose: "T-SQL-Skript ausführen"
    mutates_sql: true
  - name: Test-SqlServerLabPrerequisite
    source: Private/ResourceAssessment.ps1
    purpose: "Provider, RAM, Storage und Ports ohne Mutation prüfen"
    mutates_host: false

internal_components:
  - name: ManifestBuilder
    source: Private/ManifestBuilder.ps1
    responsibilities:
      - "alle Manifestfelder dynamisch aus dem JSON-Schema erfassen"
      - "Schema-, Katalog- und Runtime-Grenzen vor dem Speichern prüfen"
      - "Warnungen für vorbereitete oder riskante Konfigurationen erzeugen"
  - name: ManifestParser
    source: Private/ManifestParser.ps1
    responsibilities:
      - "Manifest lesen und Pflichtfelder prüfen"
      - "Defaults anwenden"
      - "relative Pfade auflösen"
      - "direkte .bak-Sample-Varianten in Restoredefinitionen umwandeln"
  - name: VersionCatalog
    source: Private/VersionCatalog.ps1
    responsibilities:
      - "Basisversionen und CU-Builds auflösen"
      - "Container-Images bestimmen"
      - "Ressourcenprofile liefern"
      - "Sample-Katalog lesen"
  - name: ResourceAssessment
    source: Private/ResourceAssessment.ps1
    responsibilities:
      - "Runtime-Verfügbarkeit prüfen"
      - "RAM, Storage und Ports bewerten"
  - name: StateMachine
    source: Private/StateMachine.ps1
    responsibilities:
      - "State-Root bestimmen"
      - "Run-State persistieren"
      - "State-Transitions und Fehlerhistorie verwalten"
  - name: CleanupEngine
    source: Private/CleanupEngine.ps1
    responsibilities:
      - "Cleanup-Plan vor Mutation erzeugen"
      - "Compensation-Schritte speichern und ausführen"
  - name: PortAllocation
    source: Private/PortAllocation.ps1
    responsibilities:
      - "belegte SQL-Hostports aus TCP-Listenern, Docker und Podman ermitteln"
      - "Portsuche und Runtime-Bindung mit hostweitem, prozessübergreifendem Mutex serialisieren"
      - "atomare Parallelprovisionierung unterstützen"
  - name: SqlReadiness
    source: Private/SqlReadiness.ps1
    responsibilities:
      - "SQL-Erreichbarkeit und Major-Version prüfen"
      - "Benutzerdatenbank-Readiness nach Start oder Restart pollen"
      - "Podman-Windows-Localhostfehler früh diagnostizieren"
  - name: ServerConfig
    source: Private/ServerConfig.ps1
    responsibilities:
      - "Memory, TempDB, MaxDOP und sp_configure anwenden"
      - "Datenbankoptionen anwenden"
      - "External Languages vorbereiten"
  - name: SecretProvider
    source: Private/SecretProvider.ps1
    responsibilities:
      - "SA-Passwort im lokalen Run-Verzeichnis speichern und lesen"

providers:
  docker:
    status: implemented
    implementation: Providers/Docker/DockerProvider.ps1
    metadata: Providers/Docker/provider.json
    command: docker
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
  podman:
    status: implemented
    implementation: Providers/Podman/PodmanProvider.ps1
    metadata: Providers/Podman/provider.json
    command: podman
    windows_networking: Documentation/HowTo/PODMAN_WINDOWS_NETWORKING.md
    port_binding: "gemeinsame Portermittlung plus Runtime-Retry innerhalb des hostweiten Locks"
  hyperv:
    status: planned
    documentation: Providers/HyperV/README.md
    command: Get-VM

catalogs:
  sql_versions:
    data: Catalogs/sql-server-versions.json
    schema: Schemas/version-catalog.schema.json
  sample_databases:
    data: Catalogs/sample-databases.json
    schema: Schemas/sample-databases.schema.json
    executable_variants: "Nur direkte .bak-URLs"

state_files:
  root_resolution:
    windows: "%LOCALAPPDATA%\SqlServerLab"
    linux_macos: "~/.sql-server-lab"
    override_environment_variable: SQL_SERVER_LAB_STATE
  per_run:
    - run-state.json
    - cleanup-plan.json
    - connection-info.json
    - secrets/
  cache:
    - cache/backups/
  repository_policy: "State, Secrets, Connection Information und konkrete Hostpfade nie versionieren"

provisioning_flow:
  - "Read-LabManifest oder Ad-hoc-Normalisierung"
  - "Test-SqlServerVersionSupported"
  - "Test-SqlServerLabPrerequisite"
  - "New-LabRunState"
  - "New-CleanupPlan"
  - "Invoke-LabPortAllocationLock"
  - "Find-LabAvailablePort"
  - "Provider-Container erstellen und Port runtimeautoritativ binden"
  - "Wait-SqlReady"
  - "Set-LabServerConfig"
  - "New-SqlServerLabDatabase für Create-Datenbanken"
  - "Restore-SqlServerLabDatabase für Restore- und Sample-Datenbanken"
  - "Set-LabDatabaseOptions"
  - "Invoke-LabSqlScript für postProvision"
  - "connection-info.json schreiben"
  - "State RUNNING"

validation:
  static_manifest_builder:
    command: ".\Tests\Static\Invoke-ManifestBuilderChecks.ps1"
    source: Tests/Static/Invoke-ManifestBuilderChecks.ps1
    covers:
      - schema_validation
      - semantic_validation
      - atomic_manifest_write
  static_documentation:
    command: ".\Tests\Static\Invoke-DocumentationChecks.ps1"
    source: Tests/Static/Invoke-DocumentationChecks.ps1
  static_runtime_contracts:
    command: ".\Tests\Static\Invoke-ReadinessContractChecks.ps1"
    source: Tests/Static/Invoke-ReadinessContractChecks.ps1
    covers:
      - readiness
      - interactive_menu
      - atomic_port_allocation
  single_provider_smoke:
    source: Tests/Integration/Invoke-SmokeTest.ps1
    docker: ".\Tests\Integration\Invoke-SmokeTest.ps1 -Provider docker"
    podman: ".\Tests\Integration\Invoke-SmokeTest.ps1 -Provider podman"
  runtime_matrix:
    source: Tests/Integration/Invoke-SmokeMatrix.ps1
    command: ".\Tests\Integration\Invoke-SmokeMatrix.ps1 -Provider all -FullMatrix -IncludeParallel"
    versions:
      - "2019"
      - "2022"
      - "2025"
    checks:
      - full_lifecycle_per_provider
      - major_version_matrix
      - parallel_unique_run_and_scope_ids
      - parallel_unique_ports
      - isolated_cleanup
  remote_workflows:
    docker:
      source: .github/workflows/runtime-smoke-docker.yml
      labels:
        - self-hosted
        - SQL_Lab
        - Docker
    podman:
      source: .github/workflows/runtime-smoke-podman.yml
      labels:
        - self-hosted
        - SQL_Lab
        - Podman
    triggers:
      - workflow_dispatch
      - pull_request
    push_trigger: false
  last_confirmed_result:
    date: "2026-07-27"
    source: Documentation/Quality/VALIDATION_RESULT_2026-07-27.md
    docker: "PASS – 2019, 2022, 2025 lifecycle and parallel runs"
    podman: "PASS – 2019, 2022, 2025 lifecycle and parallel runs"

change_coupling:
  public_command_change:
    - SqlServerLab.psd1
    - Public/README.md
    - README.md
    - Documentation/User/Getting_Started.md
    - .ai/repo_map.yaml
    - Tests/Static/Invoke-DocumentationChecks.ps1
  manifest_field_change:
    - Schemas/lab-manifest.schema.json
    - Private/ManifestParser.ps1
    - "zuständige Runtimefunktion"
    - Schemas/README.md
    - Documentation/Quality/KNOWN_LIMITATIONS.md
    - "mindestens ein example-*.json"
    - Tests/Static/Invoke-DocumentationChecks.ps1
  provider_change:
    - Private/PortAllocation.ps1
    - Providers/<Provider>/<Provider>Provider.ps1
    - Providers/<Provider>/provider.json
    - Providers/<Provider>/README.md
    - README.md
    - Documentation/Quality/KNOWN_LIMITATIONS.md
    - Tests/Static/Invoke-ReadinessContractChecks.ps1
    - Tests/Integration/Invoke-SmokeTest.ps1
    - Tests/Integration/Invoke-SmokeMatrix.ps1
    - .github/workflows/runtime-smoke-<provider>.yml
  catalog_change:
    - "Catalogs/*.json"
    - "zugehöriges Schema"
    - Catalogs/README.md
    - Private/VersionCatalog.ps1
    - Tests/Static/Invoke-DocumentationChecks.ps1
    - Tests/Integration/Invoke-SmokeMatrix.ps1

known_limitations:
  binding_document: Documentation/Quality/KNOWN_LIMITATIONS.md
  highlights:
    - "Hyper-V nicht implementiert"
    - "gemischter Provider-Lifecycle innerhalb eines Runs nicht implementiert"
    - "Sample-Automation nur für direkte .bak-Varianten"
    - "mehrere reservierte serverConfig-Felder noch ohne stabilen Runtimepfad"
    - "Versionskatalog wird nicht automatisch als aktuell garantiert"

continuation_rules:
  - "Planungsdokumente nie als Runtime-Nachweis behandeln"
  - "Keine neuen Exportnamen ohne implementierte Funktion und Test"
  - "Keine Manifestfelder nur im Schema ergänzen"
  - "Keine realen State-, Secret-, Host- oder Kundendaten committen"
  - "Vor einer Mutation einen Cleanup-Pfad beibehalten"
  - "Docker und Podman getrennt testen"
  - "Portwahl bei Parallelität immer über Private/PortAllocation.ps1 führen"
  - "Runtime-Smoke-Workflows nur mit SQL_Lab plus exaktem Capability-Label ausführen"
