known_limitations:
  binding_document: Documentation/Quality/KNOWN_LIMITATIONS.md
  highlights:
    - "Hyper-V-Reconcile deckt Netzwerk, vCPU/RAM, zusaetzliche VHDX grow-only, Gast-NTFS, SQL-Default-/TempDB-Dateiplatzierung, SQL-Konfiguration, SQL-Port und katalogisierte Testdatenbank-Add-/Remove-Aktionen mit lokalen Journals beziehungsweise VM-gebundenem Ownership-Receipt synthetisch ab; fuer SQL-Konfiguration, SQL-Port und Testdatenbanken existieren getrennte isolierte native Runner samt Prepared-Artifact-Bootstrap, deren Ausfuehrung noch NOT_EXECUTED ist; weitere native Reparaturevidence, alte Runs ohne Testdatenbank-Receipt, Storage-Rebinding/-Removal sowie User-/Systemdatenbankverschiebung bleiben offen"
    - "Hyper-V sealed VHDX Registry, Builder-/Resume-Grundlage, realer Windows-2025-/SQL-2025-Prepared-Manifest-Klon bis SQL_READY_RUN, freie Manifest-Drives, NAT-Bound-Plan mit IPAM, LAN-Bound-Plan mit lokaler External-Switch-/Adapter-Allowlist und DHCP, read-only Netzwerk-Reconcile, eng begrenzte journalisierte Netzwerkreparatur und echter SQL-2025-CLI-Vertical-Slice implementiert; vollautomatische OS-Factory sowie allgemeines Datenbank-/Software-/Post-Provision-Binding und positive native External-Switch-/Netzwerkreparatur-Evidence bleiben offen"
    - "Container-Manifeste laufen standardmäßig unattended mit externen Secret-Referenzen, SHA-256-/Trust-Schutz und read-only Host-Mount-Default"
    - "providerneutrale Network Intents und Exposure Policy binden Container-NAT sowie Hyper-V-HostOnly/-Isolation/-NAT/-LAN und lehnen offene Kombinationen vor Mutation ab; Hyper-V-NAT nutzt Shared-WinNAT, mutationsfreie Kollisionspruefung, statische scopegebundene IPAM-Leases und Gateway-/DNS-Binding; Hyper-V-LAN nutzt eine lokale External-Switch-/Adapter-Allowlist und DHCP; Hyper-V-Netzdrift wird im Lifecycle-Reconcile semantisch, hostwertfrei und fail-closed gelesen; ein eigener journalisierter Executor repariert ausschließlich additive Infrastruktur und genau einen vorhandenen getrennten Adapter; Rebinding, Adapter-Neuanlage, Gastadressreparatur sowie positive native External-Switch-/Repair-Evidence bleiben offen; Lifecycle-Reconcile sowie journalisierter Container-Reconcile fuer CPU, RAM, SQL max memory, Hostport, Autostart und External Runtimes sind implementiert"
    - "Artifact Refresh und Rebuild für Medien, VHDX und Derived Images nicht implementiert"
    - "kein provideruebergreifendes Docker-/Podman-Netzwerk oder Hyper-V-SubRun"
    - "Sample-Handler mit Trust-Pfad, Mehrfachauswahl, ZIP-/7z-Backup-Payloads, gepinnten Einzelskripten und sicheren Multi-Output-ZIP-Script-Bundles sind implementiert; nicht freigegebene Archive und Attach-Handler bleiben offen"
    - "Containerbasierte und run-gebundene Hyper-V-LAB_GENERATED-Baselines samt automatischer Sample-Manifestbindung und kompatibler Aufsetzpunkte sind synthetisch validiert; reale Hyper-V-Runtime-Evidence bleibt offen"
    - "mehrere reservierte serverConfig-Felder noch ohne stabilen Runtimepfad; explizite Nutzung wird vor Auflösung und Mutation fail-closed abgelehnt"
    - "Versionskatalog wird nicht automatisch als aktuell garantiert"
    - "alle katalogisierten CUs sind ohne KI ueber Cmdlet oder Konsole beschaffbar; Windows wird per SHA-256 und Microsoft-Authenticode, Linux per exaktem MCR-Tag gebunden"

continuation_rules:
  - "Tatsächlich verfügbare KI-Systeme, Modelle, Kontingente, lokale Werkzeuge und Steuerungsmöglichkeiten ohne erfundene Fähigkeiten oder Modellwechsel bewerten"
  - "Je überprüfbarem Teilschritt die kostengünstigste ausreichend qualifizierte Kombination aus System, Reasoning-Aufwand, Werkzeugen und lokalen Tests verwenden"
  - "Systeme ohne Modellwechsel durch kleinen Kontext, fokussierte Werkzeuge, lokale Tests und zusätzliche Prüfung kostenoptimal einsetzen"
  - "Vollständige Logs lokal aggregieren und nur deduplizierte entscheidungsrelevante Ausschnitte weitergeben"
  - "Tests stufenweise ausführen und unveränderte grüne oder identische Fehlerläufe nicht ohne neue Evidence wiederholen"
  - "Planungsdokumente nie als Runtime-Nachweis behandeln"
  - "Testdatenbank-, Trust-, Wizard- und Baseline-Entscheidungen am verbindlichen Zielvertrag ausrichten"
  - "Hyper-V-, Image-, Netzwerk-, Software-, Reconcile- und Refresh-Entscheidungen am verbindlichen Hyper-V-Zielvertrag ausrichten"
  - "Keine neuen Exportnamen ohne implementierte Funktion und Test"
  - "Keine Manifestfelder nur im Schema ergänzen"
  - "Keine realen State-, Secret-, Host- oder Kundendaten committen"
  - "Vor einer Mutation einen Cleanup-Pfad beibehalten"
  - "Docker und Podman getrennt testen"
  - "Portwahl bei Parallelität immer über Private/PortAllocation.ps1 führen"
  - "Runtime-Smoke-Workflows nur mit SQL_Lab plus exaktem Capability-Label ausführen"
