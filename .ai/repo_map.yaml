foundation_integration:
  source_repository: gecompat/AI_Repository_Foundation
  source_commit: d49f978f33001fcc098998ff7c04ffb209b28033
  ruleset_version: "1.7.0"
  foundation_integrity_index: .ai/foundation/repo_map.yaml
  feature_catalog: .ai/foundation/feature_catalog.json
  selected_adapters:
    - github-copilot
  adapter_rule_rehome:
    github-copilot: ops/sql-cu-policy.md
  semantic_classification:
    equivalent:
      - truthful_status_and_validation_evidence
      - local_impact_based_validation
      - small_coherent_branch_and_pr_changes
    project_stronger:
      - synthetic_and_allowlisted_repository_data
      - additional_approval_and_cleanup_requirements
      - provider_specific_runtime_evidence
    project_selectable_override:
      - custom_target_license
      - german_project_documentation
      - ai_commit_prefix
    complementary:
      - detailed_model_and_cost_routing
      - sql_server_domain_and_provider_contracts
      - extended_validation_statuses
  model_routing_mapping: .ai/MODEL_ROUTING_POLICY.md
  validation_scope_mapping: Documentation/Quality/LOCAL_VALIDATION_STRATEGY.md
  identity_registration_mapping: .ai/IDENTITY_AND_ARTIFACT_REGISTRATION.md
  identity_adoption_mode: PRESERVE
  registration_authorities:
    hyperv_images: Import-HyperVImageArtifact
    sample_baselines: Register-LabSampleBaseline
    runs_and_scopes: New-LabRunState
    final_human_reference_scope: not_currently_allocated_authority_required_before_use
  selected_capabilities: []
  upgrade_assessment:
    installed_version: "1.4.0"
    source_version: "1.7.0"
    assessed_on: "2026-08-27"
    candidates:
      artifact-registration: ALREADY_EQUIVALENT
      central-artifact-registry: NOT_APPLICABLE
      layered-validation: APPLY_DEFAULT
      repository-continuity-break-glass: RECOMMENDED
      semantic-integration: APPLY_DEFAULT
      semantic-upgrade-applicability: APPLY_DEFAULT
    open_recommendations: []
    resolved_recommendations:
      repository-continuity-break-glass:
        decision: IMPLEMENTED
        decided_on: "2026-08-27"
        authority: Documentation/Quality/REPOSITORY_CONTINUITY_RUNBOOK.md
  repository_continuity:
    status: IMPLEMENTED
    target: refs/heads/main
    core_safety_ruleset:
      name: Core safety - main
      enforcement: active
      bypass_actors: []
      requires_pull_request: true
      blocks_deletion: true
      blocks_force_push: true
    ci_gates_ruleset:
      name: CI gates - main
      enforcement: active
      required_status_check: PR Gate
      strict_required_status_checks: true
      bypass_actor: repository_owner
      bypass_mode: pull_request
    decision_rule:
      allowed: INFRASTRUCTURE_UNAVAILABLE
      prohibited:
        - VALIDATION_FAILURE
        - UNKNOWN
    deferred_validation_required: true
  unresolved_conflicts: []

public_commands:
  - name: New-SqlServerLabBatch
    source: Public/BatchWorkflow.ps1
    purpose: "Providerneutralen Einzel- oder Mengenbatch validieren, expandieren und persistent einreihen"
    mutates_host: true
  - name: Get-SqlServerLabQueue
    source: Public/BatchWorkflow.ps1
    purpose: "Persistente Queue, Worker, Locks, Blockierungen und User-Gates lesen"
    mutates_host: false
  - name: Confirm-SqlServerLabOperationUserAction
    source: Public/BatchWorkflow.ps1
    purpose: "Ausdruecklich bestaetigte User-Gates einzeln technisch verifizieren und fortsetzen"
    mutates_host: true
  - name: Invoke-SqlServerLabScheduler
    source: Public/BatchWorkflow.ps1
    purpose: "Queue mit Ressourcenklassen, Locks und Resume verarbeiten"
    mutates_host: true
  - name: Invoke-SqlServerLab
    source: Public/Invoke-SqlServerLab.ps1
    purpose: "Interaktives Menü"
    mutates_host: true
  - name: Get-SqlServerLabWorkflow
    source: Public/Get-SqlServerLabWorkflow.ps1
    purpose: "Konsolidierte, geheimnisfreie Workflow- und Imageübersicht"
    mutates_host: false
  - name: Get-SqlServerLabCatalog
    source: Public/Get-SqlServerLabCatalog.ps1
    purpose: "Laufzeitworkflow-Katalog als persistentes, maschinenlesbares JSON-Artefakt erstellen"
    mutates_host: true
    writes_files: true
  - name: Get-SqlServerLabReconcilePlan
    source: Public/Get-SqlServerLabReconcilePlan.ps1
    purpose: "Read-only Lifecycle- oder resolvergebundener External-Runtime-Refresh-Plan"
    mutates_host: false
  - name: Invoke-SqlServerLabReconcileAction
    source: Public/Invoke-SqlServerLabReconcileAction.ps1
    purpose: "START/STOP oder additiven SQL-2022-Container-Runtime-Refresh journal- und validierungsgebunden ausfuehren"
    mutates_host: true
  - name: Invoke-SqlServerLabWorkflowAction
    source: Public/Invoke-SqlServerLabWorkflowAction.ps1
    purpose: "Nicht interaktive UI-Aktion für einen zulässigen Hyper-V-Workflow-Schritt"
    mutates_host: true
  - name: New-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Schema-gesteuertes Manifest interaktiv oder aus einem Objekt erstellen"
    mutates_host: true
    writes_files: true
  - name: Test-SqlServerLabManifest
    source: Public/New-SqlServerLabManifest.ps1
    purpose: "Manifest gegen Schema, Kataloge und Runtime-Grenzen prüfen"
    mutates_host: false
  - name: New-SqlServerLab
    source: Public/New-SqlServerLab.ps1
    purpose: "Lab ad hoc oder per Manifest erstellen"
    mutates_host: true
    returns:
      - RunId
      - ScopeId
      - State
      - Name
      - Instances
      - StateRoot
  - name: Get-SqlServerLab
    source: Public/Get-SqlServerLab.ps1
    purpose: "State und Live-Status je ProviderSubRun lesen"
    mutates_host: false
  - name: Start-SqlServerLab
    source: Public/Start-SqlServerLab.ps1
    purpose: "Gestoppten Run über alle gespeicherten ProviderSubRuns starten"
    mutates_host: true
  - name: Stop-SqlServerLab
    source: Public/Stop-SqlServerLab.ps1
    purpose: "Laufenden Run über alle gespeicherten ProviderSubRuns stoppen"
    mutates_host: true
  - name: Restart-SqlServerLab
    source: Public/Restart-SqlServerLab.ps1
    purpose: "Stop und Start kombinieren"
    mutates_host: true
  - name: Remove-SqlServerLab
    source: Public/Remove-SqlServerLab.ps1
    purpose: "Einzelnen Run scope-validiert entfernen"
    mutates_host: true
  - name: Clear-SqlServerLab
    source: Public/Clear-SqlServerLab.ps1
    purpose: "Lab-Container und/oder State bereinigen"
    mutates_host: true
  - name: New-SqlServerLabDatabase
    source: Public/New-SqlServerLabDatabase.ps1
    purpose: "Datenbank mit konfigurierbaren Dateien und absoluten Linux- oder Windows-SQL-Pfaden erstellen"
    mutates_sql: true
  - name: Restore-SqlServerLabDatabase
    source: Public/Restore-SqlServerLabDatabase.ps1
    purpose: "Direkte .bak-Datei aus lokalem Pfad oder URL wiederherstellen; URL-Acquisition mit Trust, SHA-256, Cache und Run Lock; Ziel bevorzugt per RunId aufloesen"
    mutates_sql: true
    external_dependencies:
      - sqlcmd
  - name: Invoke-SqlServerLabScript
    source: Public/Invoke-SqlServerLabScript.ps1
    purpose: "T-SQL-Skript ausführen"
    mutates_sql: true
  - name: Test-SqlServerLabPrerequisite
    source: Private/ResourceAssessment.ps1
    purpose: "Provider, RAM, Storage und Ports ohne Mutation prüfen"
    mutates_host: false
  - name: Test-SqlServerLabAdapter
    source: Public/Test-SqlServerLabAdapter.ps1
    purpose: "Project Adapter gegen Schema, Pfadgrenzen und optional einen Run pruefen"
    mutates_host: false
  - name: Install-SqlServerLabAdapter
    source: Public/Install-SqlServerLabAdapter.ps1
    purpose: "Validierten Adapter-Entrypoint ohne Lifecycle-Seiteneffekt auf eine Instanz anwenden"
    mutates_sql: true
    external_dependencies:
      - sqlcmd

internal_components:
  - name: ManifestBuilder
    source: Private/ManifestBuilder.ps1
    responsibilities:
      - "alle Manifestfelder dynamisch aus dem JSON-Schema erfassen"
      - "x-ui-Pfadsemantik, Scope und aufgeloeste Hostvorschau im Wizard anzeigen"
      - "nur resolverfreigegebene External-Runtime-Varianten im Instanzkontext anbieten"
      - "mutationsfreie Software-Planvorschau mit Downloads, Build/Gastmutation, Downtime, Locks, Verification und Aenderungsklassen liefern"
      - "Schema-, Katalog- und Runtime-Grenzen vor dem Speichern prüfen"
      - "Warnungen für vorbereitete oder riskante Konfigurationen erzeugen"
  - name: ManifestParser
    source: Private/ManifestParser.ps1
    responsibilities:
      - "Manifest lesen und Pflichtfelder prüfen"
      - "Defaults anwenden"
      - "relative Pfade auflösen"
      - "Sample-Referenzen in den typisierten Artifact-Vertrag auflösen"
      - "nur ausführbare Backup-Varianten in Restoredefinitionen umwandeln"
  - name: VersionCatalog
    source: Private/VersionCatalog.ps1
    responsibilities:
      - "Basisversionen und CU-Builds auflösen"
      - "Container-Images bestimmen"
      - "Ressourcenprofile liefern"
      - "Sample-Katalog lesen"
  - name: SoftwareCatalog
    source: Private/SoftwareCatalog.ps1
    responsibilities:
      - "Python-, R- und Java-Anforderungen in providerneutrale Software-Intents normalisieren"
      - "SQL-Version, Betriebssystem, Architektur, Provider und Runtimevariante deterministisch aufloesen"
      - "unbelegte Varianten, freie Commands und nicht gesperrte Pakete vor Provider-Mutationen ablehnen"
      - "sanitisierte Softwareplaene, portable PlanKey-Identitaet und Installation-Receipt-Vertraege bereitstellen"
      - "Aenderungswege als rebuild, restart, recreate, reprovision oder no-op klassifizieren"
  - name: ExternalRuntimeContainerImage
    source: Private/ContainerImageArtifact.ps1
    recipe: Images/ExternalLanguages/Linux/recipe.json
    responsibilities:
      - "providerneutralen Python-, R-, Java- oder kombinierten Image-Key aus Basisdigest, Varianten, Locks und Kontext-SHA-256 bilden"
      - "R 4.2.3 und RevoScaleR aus einem digestgebundenen Buildstage ohne Compiler im Zielimage bereitstellen"
      - "Java 11, Language Extension 1.1.1, SDK und synthetisches Probe-JAR aus SHA-256-gebundenen Quellen reproduzierbar und compilerfrei bereitstellen"
      - "Docker- und Podman-Buildreceipts getrennt und ohne Hostpfade persistieren"
      - "Derived-Image-Plaene, Buildreceipts und wiederverwendete Image-Artefakte an die exakten Software-PlanKeys binden"
      - "rootful-cgroup-v1-, Capability-, Security-Option- und Namespace-Sicherheitsvertrag vor Container-Mutation erzwingen"
      - "SQL-Satellite-OpenSSL-Aufloesung und Java-Sandbox-Datenverzeichnisse reproduzierbar im Image binden"
      - "wiederverwendbare Images außerhalb des normalen Run-Cleanups halten"
  - name: ExternalRuntimeWindows
    source: Private/ExternalRuntimeWindows.ps1
    recipe: Images/ExternalLanguages/Windows/recipe.json
    guest_installer: Images/ExternalLanguages/Windows/Install-ExternalRuntimes.ps1
    responsibilities:
      - "SHA-256-gebundene Python-/R-/Java-Offlinemedien in einen inhaltsadressierten Media-Root aufloesen"
      - "einen hostpfad- und quellfreien Gastinstallationsplan erzeugen und ueber PowerShell Direct ausfuehren"
      - "INSTALLING-, RECOVERY_REQUIRED- und EXTENSIONS_READY_RUN-State vor und nach Gastmutationen persistieren"
      - "SQL-External-Scripts aktivieren und echte Python-/R-/Java-Postconditions im Windows-Gast pruefen"
      - "Java-SDK aus dem gesperrten Extension-Archiv extrahieren, das synthetische Probe-JAR reproduzierbar erzeugen und beide per Content-Hash binden"
  - name: ExternalRuntimeLifecycle
    source: Private/ExternalRuntimeLifecycle.ps1
    responsibilities:
      - "external scripts enabled aktivieren und den gebundenen Container kontrolliert neu starten"
      - "launchpadd-Readiness und echte Python-/R-/Java-sp_execute_external_script-Postconditions prüfen"
      - "Java-Sprache und -Libraries pro Zieldatenbank idempotent registrieren, Drift ablehnen und fehlgeschlagene Neuanlagen kompensieren"
      - "sanitisierte Runtime-Installation-Receipts im Run persistieren"
  - name: ResourceAssessment
    source: Private/ResourceAssessment.ps1
    responsibilities:
      - "Runtime-Verfügbarkeit für alle verwendeten Provider prüfen"
      - "RAM, Storage und Ports bewerten"
  - name: StateMachine
    source: Private/StateMachine.ps1
    responsibilities:
      - "State-Root bestimmen"
      - "Run-State und ProviderSubRuns persistieren"
      - "State-Transitions und Fehlerhistorie verwalten"
  - name: ArtifactResolver
    source: Private/ArtifactResolver.ps1
    responsibilities:
      - "HTTP(S)-Backup-Acquisition in einen lokalen Staging-Bereich"
      - "einmaligen Trust mit versionierten lokalen SHA-256-Records verwalten"
      - "inhaltsadressierten Cache und Quarantaene bei Hash-Mismatch verwalten"
      - "sanitisiertes manifest.lock.json vor dem Restore schreiben"
  - name: SampleArtifactHandlers
    source: Private/SampleArtifactHandlers.ps1
    responsibilities:
      - "executable Backup-, Einzel-Skript- und Script-Bundle-Varianten des Sample-Katalogs auflisten und filtern"
      - "Trust- und Cache-Status je Variante read-only melden"
      - "Samples ueber Resolver, Idempotenzregel und typisierten Handler installieren"
      - "Script Bundles sicher extrahieren, erlaubte sqlcmd-Features root-gebunden expandieren und mehrere Outputs verifizieren"
      - "erwartete Datenbanken als ONLINE verifizieren und DATASET_READY oder RECOVERY_REQUIRED melden"
  - name: SampleBaselineRegistry
    source: Private/SampleBaselineRegistry.ps1
    responsibilities:
      - "deterministische Baseline Keys aus Sample-, Quellen-, Handler-, SQL- und Verification-Invarianten bilden"
      - "verifizierte LAB_GENERATED-Backups inhaltsadressiert und portabel registrieren"
      - "exakte und kompatible Baselines deterministisch auswaehlen"
      - "fehlende, pfadfremde oder hashabweichende Baselines quarantainisieren"
  - name: SampleBaselineRuntime
    source: Private/SampleBaselineRuntime.ps1
    responsibilities:
      - "Single- und Multi-Output-Container-Samples nach erfolgreicher SQL-Verifikation mit CHECKSUM sichern"
      - "erzeugte Backups vor Registrierung mit RESTORE VERIFYONLY pruefen"
      - "exakte oder kompatible LAB_GENERATED-Baselines vor dem Originalartefakt bevorzugen"
      - "bei fehlender oder ungueltiger Baseline sicher auf das verifizierte Originalartefakt zurueckfallen"
  - name: ProjectAdapter
    source: Private/ProjectAdapter.ps1
    responsibilities:
      - "adapter.json gegen Schemas/project-adapter.schema.json validieren"
      - "Pfadgrenzen des Adapter-Roots und Reparse Points erzwingen"
      - "unbekannte Major-Vertrags- und Core-Versionen ablehnen"
      - "Versions- und Capability-Gates gegen eine Run-Instanz pruefen"
  - name: DesiredState
    source: Private/DesiredState.ps1
    responsibilities:
      - "geheimnisfreien Sollzustand vor jeder Provider-Mutation erzeugen"
      - "Hyper-V-Manifest-Drives als run-lokale VHDX- und Guest-Initialisierungs-Intents binden"
      - "Drive-, Network- und Software-Anforderungen providerneutral normalisieren"
      - "deklarative Provider-Capability-Evidenz ohne Runtime-Annahme persistieren"
  - name: CleanupEngine
    source: Private/CleanupEngine.ps1
    responsibilities:
      - "Cleanup-Plan und providergebundene Cleanup-SubRuns vor Mutation erzeugen"
      - "Compensation-Schritte je Provider speichern und ausführen"
      - "Run-lokale Ressourcen an Software-PlanKeys binden und wiederverwendbare Softwareartefakte ausdrücklich behalten"
  - name: PortAllocation
    source: Private/PortAllocation.ps1
    responsibilities:
      - "belegte SQL-Hostports aus TCP-Listenern, Docker und Podman ermitteln"
      - "Portsuche und Runtime-Bindung mit hostweitem, prozessübergreifendem Mutex serialisieren"
      - "atomare Parallelprovisionierung unterstützen"
  - name: SqlReadiness
    source: Private/SqlReadiness.ps1
    responsibilities:
      - "SQL-Erreichbarkeit und Major-Version prüfen"
      - "Benutzerdatenbank-Readiness nach Start oder Restart pollen"
      - "Podman-Windows-Localhostfehler früh diagnostizieren"
  - name: ServerConfig
    source: Private/ServerConfig.ps1
    responsibilities:
      - "Memory, TempDB, MaxDOP und sp_configure anwenden"
      - "Datenbankoptionen anwenden"
      - "External Languages nur nach RESOLVED-Softwareplan aktivieren"
  - name: SecretProvider
    source: Private/SecretProvider.ps1
    responsibilities:
      - "SA-Passwort im lokalen Run-Verzeichnis speichern und lesen"

