  - "Test-SqlServerLabPrerequisite"
  - "New-LabRunState"
  - "ProviderSubRuns anlegen"
  - "New-CleanupPlan"
  - "Invoke-LabPortAllocationLock"
  - "Find-LabAvailablePort"
  - "Provider-Container erstellen und Port runtimeautoritativ binden"
  - "Bei instances[].autostart=on Runtime-Restart-Policy und Hostkoordinator aktivieren"
  - "Wait-SqlReady"
  - "Set-LabServerConfig"
  - "New-SqlServerLabDatabase für Create-Datenbanken"
  - "Install-LabSampleDatabase für Sample-Datenbanken (Trust, Cache, Restore, Verification)"
  - "Restore-SqlServerLabDatabase für direkte Restore-Datenbanken"
  - "Set-LabDatabaseOptions"
  - "Invoke-LabSqlScript für postProvision"
  - "connection-info.json schreiben"
  - "State RUNNING"

