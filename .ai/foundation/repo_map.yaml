schema_version: 1
foundation_ruleset_version: 1.18.0
canonical_entrypoint: AGENTS.md
authority:
  required_or_baseline:
    - .ai/foundation/FOUNDATION_RULESET.md
    - .ai/foundation/PROJECT_RULES.md
    - .ai/foundation/SEMANTIC_INTEGRATION_POLICY.md
    - .ai/foundation/PERSISTENT_IDENTITY_POLICY.md
    - .ai/foundation/ARTIFACT_REGISTRATION_POLICY.md
    - .ai/foundation/CENTRAL_ARTIFACT_REGISTRY_POLICY.md
    - .ai/foundation/UPGRADE_APPLICABILITY_POLICY.md
    - .ai/foundation/REPOSITORY_CONTINUITY_POLICY.md
    - .ai/foundation/RULE_CONTEXT_CACHE_POLICY.md
    - .ai/foundation/AI_WORK_ORCHESTRATION_POLICY.md
    - .ai/foundation/feature_catalog.json
    - .ai/foundation/WORKING_RULES.md
    - .ai/foundation/MODEL_ROUTING_POLICY.md
    - .ai/foundation/VALIDATION_POLICY.md
    - .ai/foundation/DATA_PRIVACY_AND_CONFIDENTIALITY.md
    - .ai/foundation/SECURITY_AND_SAFE_OPERATIONS.md
    - .ai/foundation/DOCUMENTATION_POLICY.md
    - .ai/foundation/THIRD_PARTY_AND_LICENSING.md
    - .ai/foundation/SOURCE_AND_EVIDENCE_POLICY.md
    - .ai/foundation/DEPENDENCY_POLICY.md
  schemas:
    - .ai/foundation/schemas/artifact-record.schema.json
    - .ai/foundation/schemas/artifact-registry.schema.json
    - .ai/foundation/schemas/artifact-registry-v2.schema.json
    - .ai/foundation/schemas/artifact-registration-request.schema.json
    - .ai/foundation/schemas/feature-catalog.schema.json
    - .ai/foundation/schemas/upgrade-assessment.schema.json
    - .ai/foundation/schemas/installation-provenance.schema.json
    - .ai/foundation/schemas/rule-context-cache.schema.json
    - .ai/foundation/schemas/model-routing-request.schema.json
    - .ai/foundation/schemas/model-routing-decision.schema.json
    - .ai/foundation/schemas/model-router-catalog.schema.json
    - .ai/foundation/schemas/model-routing-snapshot.schema.json
    - .ai/foundation/schemas/model-router-profiles.schema.json
    - .ai/foundation/schemas/model-routing-request-v2.schema.json
    - .ai/foundation/schemas/model-routing-decision-v2.schema.json
    - .ai/foundation/schemas/model-router-catalog-fragment-v2.schema.json
    - .ai/foundation/schemas/ai-work-request.schema.json
    - .ai/foundation/schemas/capability-descriptor.schema.json
    - .ai/foundation/schemas/execution-plan.schema.json
    - .ai/foundation/schemas/execution-report.schema.json
    - .ai/foundation/schemas/execution-checkpoint.schema.json
    - .ai/foundation/schemas/approval-receipt.schema.json
    - .ai/foundation/schemas/validation-evidence.schema.json
    - .ai/foundation/schemas/gap-report.schema.json
    - .ai/foundation/schemas/provision-plan.schema.json
    - .ai/foundation/schemas/provision-request.schema.json
    - .ai/foundation/schemas/provision-approval.schema.json
    - .ai/foundation/schemas/provision-report.schema.json
    - .ai/foundation/schemas/runtime-inventory.schema.json
    - .ai/foundation/schemas/ai-adapter-protocol.schema.json
    - .ai/foundation/schemas/ai-runtime-configuration.schema.json
    - .ai/foundation/schemas/resource-cost-evidence.schema.json
    - .ai/foundation/schemas/client-integration-plan.schema.json
    - .ai/foundation/schemas/client-model-routing-capability.schema.json
    - .ai/foundation/schemas/vscode-model-routing-plan.schema.json
    - .ai/foundation/schemas/manual-handoff.schema.json
    - .ai/foundation/schemas/dispatch-receipt.schema.json
    - .ai/foundation/schemas/adapter-synthesis-report.schema.json
    - .ai/foundation/schemas/model-runtime-evidence.schema.json
    - .ai/foundation/schemas/model-evidence-sources.schema.json
    - .ai/foundation/schemas/ai-orchestration-request.schema.json
    - .ai/foundation/schemas/ai-orchestration-report.schema.json
provenance:
  foundation_notice: .ai/foundation/AI_REPOSITORY_FOUNDATION_NOTICE.md
  installation_receipt: .ai/foundation/installation-provenance.json
  installation_receipt_schema: .ai/foundation/schemas/installation-provenance.schema.json
  source_hash_normalization: UTF8_CRLF_TO_LF_ELSE_EXACT
  drift_classifications: UNCHANGED_CURRENT_BASELINE_INTENTIONAL_OVERRIDE_PREVIOUS_FOUNDATION_VERSION_UNKNOWN_DRIFT
  target_root_license_behavior: independent_and_untouched
integration_contract:
  root_entrypoint: AGENTS.md
  project_governance_must_be_transitively_discoverable: true
  stricter_project_rules: compatible
  existing_project_rule_labels_required: false
  adapter_governance_migration: preserve_then_rehome_then_thin
  project_repo_map_behavior: preserve_and_optionally_bridge
  orphaned_authority_is_integration_defect: true
  compatibility_classes: EQUIVALENT_PROJECT_STRONGER_PROJECT_SELECTABLE_OVERRIDE_COMPLEMENTARY_DUPLICATE_GOVERNANCE_FOUNDATION_REQUIRED_CONFLICT_TARGET_INTERNAL_CONFLICT_ORPHANED_AUTHORITY_ADAPTER_GOVERNANCE_MISPLACED
identity_contract:
  policy: .ai/foundation/PERSISTENT_IDENTITY_POLICY.md
  required_invariants: stable_no_reuse_no_silent_rename_legacy_preservation_identity_vs_classification_explicit_relations_revision_separation_no_auth_by_id
  default_machine_identifier: rfc9562_uuidv7_as_urn_uuid
  compatible_uuid_profiles: uuidv7_uuidv4
  default_human_reference: flat_typed_project_local
  default_human_reference_pattern: PREFIX_SEQUENCE
  prefix_meaning_reuse: prohibited
  hierarchy_and_status: metadata_not_canonical_identity
  external_references: aliases_or_locators_not_canonical_by_default
  content_hash_scope: immutable_revision_or_content
  existing_project_default_mode: PRESERVE
  new_project_default_mode: FOUNDATION_DEFAULT
  adoption_modes: PRESERVE_ADOPT_FORWARD_MIGRATE_EXPLICIT
  migration_requires_explicit_decision: true
  unknown_existing_project_choice: PRESERVE
registration_contract:
  policy: .ai/foundation/ARTIFACT_REGISTRATION_POLICY.md
  artifact_schema: .ai/foundation/schemas/artifact-record.schema.json
  legacy_registry_schema: .ai/foundation/schemas/artifact-registry.schema.json
  central_registry_schema: .ai/foundation/schemas/artifact-registry-v2.schema.json
  request_schema: .ai/foundation/schemas/artifact-registration-request.schema.json
  authority_scope: one_registration_authority_per_overlapping_identifier_scope
  same_authority_for_humans_and_ai: true
  implementation_language: project_selectable
  python_required: false
  powershell_supported: true
  allocation_modes: DIRECT_DEFERRED
  direct_requires_serialized_or_equivalent_unique_allocation: true
  deferred_uid_is_final_before_human_reference: true
  final_human_reference_must_be_authority_allocated: true
  default_registry_profile: foundation-artifact-registry/v2
  compatible_registry_profiles: foundation-artifact-registry/v1_foundation-artifact-registry/v2
  reference_clients: optional_capability
  reference_client_capability: artifact-registration-clients
central_registry_contract:
  policy: .ai/foundation/CENTRAL_ARTIFACT_REGISTRY_POLICY.md
  profile: foundation-artifact-registry/v2
  complete_records_in_single_registry: true
  human_reference_is_object_key: true
  persist_next_sequence: false
  allocation_derivation: max_existing_sequence_plus_one
  persist_global_registry_revision: false
  git_revision_is_concurrency_token: true
  object_level_three_way_merge_required: true
  git_merge_result_must_equal_semantic_merge: true
  cross_pr_preflight_recommended: true
  optional_github_capability: artifact-registry-github
upgrade_contract:
  policy: .ai/foundation/UPGRADE_APPLICABILITY_POLICY.md
  feature_catalog: .ai/foundation/feature_catalog.json
  feature_catalog_schema: .ai/foundation/schemas/feature-catalog.schema.json
  assessment_schema: .ai/foundation/schemas/upgrade-assessment.schema.json
  complete_feature_delta_required: true
  candidate_definition: introduced_or_materially_changed_after_installed_through_source_version
  assessment_classifications: NOT_APPLICABLE_ALREADY_EQUIVALENT_PROJECT_STRONGER_APPLY_DEFAULT_RECOMMENDED_DECISION_REQUIRED_CONFLICT
  silent_skip_prohibited: true
  surface_results: RECOMMENDED_DECISION_REQUIRED_CONFLICT
  unknown_installed_version_behavior: resolve_baseline_or_conservative_assessment
continuity_contract:
  policy: .ai/foundation/REPOSITORY_CONTINUITY_POLICY.md
  classification: VALIDATION_FAILURE_INFRASTRUCTURE_UNAVAILABLE_UNKNOWN
  validation_failure_bypass: prohibited
  infrastructure_unavailable_bypass: project_selectable
  unknown_bypass: prohibited
  audit_path_required: true
  direct_push_break_glass: prohibited
  deferred_validation_after_recovery: required
  target_repository_administration: recommend_never_silently_configure
  ci_supersession_and_queue_strategy: project_selectable
  exact_commit_or_tested_integration_candidate_required: true
  unsafe_mutating_runtime_cancellation: prohibited
  github_actions_concurrency_and_merge_queue: project_selectable
rule_context_cache_contract:
  policy: .ai/foundation/RULE_CONTEXT_CACHE_POLICY.md
  schema: .ai/foundation/schemas/rule-context-cache.schema.json
  native_instruction_discovery_per_run: required
  source_of_truth: repository_files
  statuses: CACHE_HIT_PARTIAL_INVALIDATION_CACHE_MISS
  head_only_hit: prohibited
  dirty_worktree_inputs: staged_unstaged_untracked
  partial_invalidation: changed_sources_plus_transitive_dependents
  uncertainty_behavior: CACHE_MISS
  semantic_analysis_storage: session_local_by_analysis_key
  persistent_record_content: fingerprints_and_dependency_metadata_only
  persistent_record_authority: none
  persistent_record_version_control: prohibited
  atomic_write_and_lock: required
  optional_reference_capability: rule-context-cache
validation_contract:
  foundation_integrity:
    label: FOUNDATION_INTEGRITY
    authority: foundation_ruleset
    purpose: installed_foundation_structure_provenance_and_deterministic_contracts
  project_semantic:
    label: PROJECT_SEMANTIC
    authority: target_repository
    purpose: project_rules_local_overrides_architecture_domain_and_documentation_contracts
  runtime_empirical:
    label: RUNTIME_EMPIRICAL
    authority: target_repository
    purpose: tests_builds_integrations_runtime_research_data_and_manual_validation
  text_content_equivalence:
    utf8_crlf_lf_equivalent: true
    lone_cr_significant: true
    final_newline_significant: true
    binary_byte_exact: true
    target_gitattributes_behavior: preserve_project_policy_do_not_create_for_eol_only_foundation_drift
  validation_availability:
    classifications: VALIDATION_FAILURE_INFRASTRUCTURE_UNAVAILABLE_UNKNOWN
    validation_failure_break_glass: prohibited
    infrastructure_unavailable_break_glass: project_selectable
    missing_validation_remains_pending: true
  status_vocabulary:
    foundation_reserved_meanings: not_executed_pending_manual_validation_validated
    target_extensions_allowed: true
    reserved_meanings_may_not_be_redefined: true
  completion:
    selection: impact_based
    foundation_integrity_does_not_replace_project_validation: true
model_routing_contract:
  request_schema: .ai/foundation/schemas/model-routing-request.schema.json
  decision_schema: .ai/foundation/schemas/model-routing-decision.schema.json
  catalog_schema: .ai/foundation/schemas/model-router-catalog.schema.json
  snapshot_schema: .ai/foundation/schemas/model-routing-snapshot.schema.json
  profiles_schema: .ai/foundation/schemas/model-router-profiles.schema.json
  request_v2_schema: .ai/foundation/schemas/model-routing-request-v2.schema.json
  decision_v2_schema: .ai/foundation/schemas/model-routing-decision-v2.schema.json
  catalog_fragment_v2_schema: .ai/foundation/schemas/model-router-catalog-fragment-v2.schema.json
  foundation_tiers: LOCAL_ECONOMICAL_BALANCED_FRONTIER
  target_policy_may_be_more_detailed: true
  semantic_mapping_when_overlapping: required
  concrete_models_are_runtime_facts: true
  profile: foundation-model-router/v2
  compatible_profiles: foundation-model-router/v1_foundation-model-router/v2
  constraint_order: privacy_authorization_capability_context_quality_freshness_budget_before_cost
  objective: minimum_complete_chain_expected_cost_of_success
  resource_money_requires_evidence: true
  resource_pressure_without_money: tie_breaker_only
  provider_catalog_refresh: isolated_per_provider_with_unexpired_last_known_good
  price_epoch_and_expiry: required
  session_affinity: conditional
  new_model_default: UNASSESSED
  bounded_evaluation: required
  runtime_state: outside_version_control
  credential_storage: prohibited
  graceful_degradation: MCP_CLI_LAUNCHER_OR_SNAPSHOT_MANUAL_HANDOFF_PORTABLE_TIER_ONLY
  optional_reference_capability: model-router
ai_work_contract:
  policy: .ai/foundation/AI_WORK_ORCHESTRATION_POLICY.md
  profile: foundation-ai-work/v1
  request_schema: .ai/foundation/schemas/ai-work-request.schema.json
  capability_schema: .ai/foundation/schemas/capability-descriptor.schema.json
  plan_schema: .ai/foundation/schemas/execution-plan.schema.json
  report_schema: .ai/foundation/schemas/execution-report.schema.json
  validation_evidence_schema: .ai/foundation/schemas/validation-evidence.schema.json
  gap_report_schema: .ai/foundation/schemas/gap-report.schema.json
  provision_plan_schema: .ai/foundation/schemas/provision-plan.schema.json
  provision_request_schema: .ai/foundation/schemas/provision-request.schema.json
  provision_approval_schema: .ai/foundation/schemas/provision-approval.schema.json
  provision_report_schema: .ai/foundation/schemas/provision-report.schema.json
  runtime_inventory_schema: .ai/foundation/schemas/runtime-inventory.schema.json
  adapter_protocol_schema: .ai/foundation/schemas/ai-adapter-protocol.schema.json
  runtime_configuration_schema: .ai/foundation/schemas/ai-runtime-configuration.schema.json
  runtime_configuration_profile: foundation-ai-runtime-configuration/v1
  runtime_configuration_lifecycle: detect_propose_edit_test_save_verify_rollback
  missing_runtime_configuration: configuration_required_with_safe_proposals
  runtime_credential_storage: references_only
  runtime_model_selection: ROUTER_MANUAL_PINNED
  resource_cost_evidence_schema: .ai/foundation/schemas/resource-cost-evidence.schema.json
  model_runtime_evidence_schema: .ai/foundation/schemas/model-runtime-evidence.schema.json
  model_evidence_sources_schema: .ai/foundation/schemas/model-evidence-sources.schema.json
  orchestration_request_schema: .ai/foundation/schemas/ai-orchestration-request.schema.json
  orchestration_report_schema: .ai/foundation/schemas/ai-orchestration-report.schema.json
  execution_checkpoint_schema: .ai/foundation/schemas/execution-checkpoint.schema.json
  approval_receipt_schema: .ai/foundation/schemas/approval-receipt.schema.json
  adapter_protocol: foundation-ai-adapter-jsonl/v1
  reference_executor: optional_capability
  executor_capability: ai-executor
  reference_host_preparation: optional_capability
  host_preparation_capability: ai-provisioning
  reference_orchestrator: optional_capability
  orchestrator_capability: ai-orchestrator
  orchestration_profile: foundation-ai-orchestration/v1
  orchestration_pipeline: catalog_evidence_route_invoke_validate_fallback_report
  orchestration_model_evidence: fresh_source_backed_external_only
  orchestration_unattested_result: MANUAL_REQUIRED
  cost_refresh_minimum_seconds: 86400
  payload_transport: content_handles_outside_control_plane
  payload_persistence_default: prohibited
  statuses: EXECUTABLE_MANUAL_REQUIRED_UNAVAILABLE_BLOCKED
  capability_failures: isolated
  authority_expansion: prohibited
  runtime_state: outside_version_control
  python_required: false
  optional_reference_capability: ai-work
  optional_adapter_capability: ai-runtime-adapters
ai_client_integration_contract:
  profile: foundation-ai-client-integration/v1
  plan_schema: .ai/foundation/schemas/client-integration-plan.schema.json
  native_model_capability_schema: .ai/foundation/schemas/client-model-routing-capability.schema.json
  vscode_model_plan_schema: .ai/foundation/schemas/vscode-model-routing-plan.schema.json
  native_model_routing: fresh_capability_first_then_mcp_cli_launcher_manual
  manual_handoff_schema: .ai/foundation/schemas/manual-handoff.schema.json
  dispatch_receipt_schema: .ai/foundation/schemas/dispatch-receipt.schema.json
  adapter_synthesis_report_schema: .ai/foundation/schemas/adapter-synthesis-report.schema.json
  lifecycle: detect_plan_apply_verify_rollback
  dispatch_attestation: requested_and_actual_model_from_explicitly_trusted_host_execution_or_response_metadata
  unattested_status: REQUESTED_NOT_ATTESTED
  manual_fallback_status: MANUAL_DISPATCH_REQUIRED
  payload_transport: external_content_handle
  runtime_state: outside_version_control
  optional_reference_capability: ai-client-integration
override_contract:
  required: minimum_floor_project_may_be_stricter
  default: project_may_override_intentionally
  project_specific_facts: target_repository_is_authoritative
